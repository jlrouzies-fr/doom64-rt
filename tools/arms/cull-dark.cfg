// ab cull arm: cull-dark -- WHICH light is coming through the hole.
//
// Default culling, but both sky sources off: rt_sun 0 (the moon, the directional
// light) and rt_sky 0 (the dome, sampled on ray miss). Whatever wash survives is
// the LEVEL'S OWN lights -- ceiling lamps, monitors, lava -- arriving through a
// wall that was not uploaded.
//
// This matters because it decides which document you are in. The sky-leak work
// (docs/moon-and-sky-leaks.md) is about the moon and the dome; if the leak is
// still there with both at 0, none of rt_sun_require_sky, rt_sun_angdiam or
// rt_sky_nowalls can ever touch it, and the answer is geometry (cull-wide /
// cull-all) or nothing.
//
// Pair it with cull-stock from the same spot.
//
// The room in the report has lit ceiling lamps in frame, and those are ALSO off
// here (as in every cull arm -- see cull-stock.cfg). So this arm is now the
// darkest of the four by some way: no moon, no dome, no ceiling insets, no
// perimeter bulbs, no wall strips. Anything still washing a surface after all
// of that is the map's own placed lights, lava, or GI -- and if it still swings
// as you turn, geometry culling is the only remaining explanation.
//
// If instead the room goes flat black and you cannot tell whether the leak is
// gone or the room simply is, restore the fixtures for one run:
//
//   .\tools\ab.cmd cull-dark 02 -- +rt_ceiling_lamps 1 +rt_ceiling_edge_lamps 1 +rt_wall_strips 1
rt_cpu_cullmode 0
rt_cpu_nocullradius 10
rt_sun 0
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 0
rt_sky_always 1
rt_sky_nowalls 0
rt_flsh 0
rt_ceiling_lamps 0
rt_ceiling_edge_lamps 0
rt_wall_strips 0
rt_hang_lamps 1
rt_solo_lamps 1
rt_spin_panels 1
rt_dynlight 1
rt_flame_light_on 1
