// ab cull arm: cull-all -- THE DIAGNOSTIC, and read the warning before shipping it.
//
// rt_cpu_cullmode 2: upload the WHOLE MAP every frame, no culling at all. Every
// wall in the level is in the acceleration structure regardless of where you
// look, so if the leak is geometry culling it MUST disappear here. That makes
// this the decisive arm rather than a candidate setting:
//
//   leak gone in cull-all   -> it was culling. Ship the smallest thing that
//                              also fixes it, which is usually cull-wide.
//   leak still there        -> it was never geometry. Go back to
//                              docs/moon-and-sky-leaks.md, and check the DOME
//                              (rt_sky 0) before anything else, since the dome
//                              is sampled on ray miss and no occlusion test of
//                              any kind touches it.
//
// WHY IT IS NOT SIMPLY THE ANSWER. rt_main.cpp refuses to select mode 2 on its
// own for mod maps, and says why: "uncull-all (mode 2) on large UDMF mods
// freezes the main thread for a long time (looks hung; needs force-close)".
// Doom 64 Retribution is exactly that -- a large UDMF mod. The guard only
// covers the paths where the ENGINE picks the mode (static-scene export); an
// explicit rt_cpu_cullmode 2 from a cfg goes through, which is what makes this
// arm possible and also what makes it a diagnostic rather than a default.
//
// So: expect a long stall at level load, possibly one that looks like a hang.
// Give it time before force-closing, and do not leave this in the pins.
//
// Ceiling and strip lamps off, as in every cull arm -- cull-stock.cfg explains
// why, and why BOTH ceiling cvars have to be zeroed. It matters most here: this
// arm has to be compared against cull-stock with ONE variable changed, and the
// inferred fixtures are the loudest thing that could differ.
rt_cpu_cullmode 2
rt_cpu_nocullradius 10
rt_sun 1
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_sky_always 1
rt_sky_nowalls 0
rt_flsh 0
rt_ceiling_lamps 0
rt_ceiling_edge_lamps 0
rt_wall_strips 0
rt_hang_lamps 1
rt_solo_lamps 1
rt_spin_panels 1
rt_dynlight 1
rt_flame_light_on 1
