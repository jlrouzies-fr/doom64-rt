// ab arm: ghost-noemis -- the DIAGNOSTIC that found the additive-blend bug, kept
// as the historical control. NOT a proposal, and no longer the fix.
//
//   .\tools\ab.cmd ghost-noemis 03      alpha 1.00, emission off, no split
//   .\tools\ab.cmd ghost-opaque 03      alpha 1.00, what ships (eyes kept)
//
// WHAT IT SHOWS. rt_ghost_debug proved the alpha reaches prim.color intact --
// 0.42 packs as 89/255, 1.00 as 214/255 -- and the screen did not move either
// way. The blend mode was the reason: a ghost's eye mask gives it
// "emissiveMult": 2.0, RTGL1's TextureMeta writes that into prim.emissive, and
// ToPipelineState turns any TRANSLUCENT primitive with emissive>0 into an
// ADDITIVE one (SRC_ALPHA / ONE). Additive cannot occlude what is behind it at
// any alpha, so no value of the cvar could ever read as "more solid".
//
// This arm removes the emissive outright, which restores real alpha blending and
// takes the glowing EYES with it -- both halves at once, which is what made it a
// clean diagnosis: a solid body AND dark eyes.
//
// WHY IT IS NOT THE FIX. The eyes are worth more than the knob. What ships
// instead is rt_ghost_emis_split: the body goes out with no emissive (so it
// alpha-blends) and the eye mask is uploaded again on a second quad whose alpha
// is ZERO -- contributing nothing to the body, because attachment 0 blends
// SRC_ALPHA, and the full mask to the emission, because attachment 1 blends
// ONE,ONE and never reads alpha. No RTGL1 change was needed after all.
//
// Run this only to re-confirm the mechanism, or to check the split's second
// primitive is not adding body brightness of its own: this arm and ghost-opaque
// must differ ONLY in the eyes.
rt_ghost_emis 0
rt_ghost_emis_split 0
rt_nightmareimp_alpha 1.0
rt_spectre_alpha 1.0
// Identical to ghost-opaque from here down.
rt_translucent_minalpha 0.72
rt_ghost_lightscale 1
rt_ghost_solid 0
rt_spectre_corpse_solid 1
rt_mod_compat 1
rt_ghost_debug 1
rt_upscale_dlss 2
rt_rayreconstr 0
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sky 25
rt_flsh 0
