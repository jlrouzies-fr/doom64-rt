// ab arm: spark-debug
// The staged ladder, once a second: A/hit, B/spawn, C/sent. The ONLY spark
// arm that logs a look -- console spam over the image is the last thing you
// want while judging one. It is what separates 'nothing spawned' from
// 'spawned but not drawn', which are identical on screen.
//
// Self-contained: every rt_spark_* value is stated, so no arm can inherit
// another's leftovers from the ini (they are CVAR_ARCHIVE).
// Applied with +exec AFTER tools/d64rt-pins.cfg, so these win.
rt_spark 1
rt_spark_count 8
rt_spark_life 1.1
rt_spark_speed 6.0
rt_spark_spread 38
rt_spark_gravity 11
rt_spark_drag 1.6
rt_spark_size 0.055
rt_spark_grid 0.03125
rt_spark_bright 2.0
rt_spark_max 640
rt_spark_far 40
rt_spark_style 0
rt_spark_streak 2.5
rt_spark_collide 1
rt_spark_bounce 0.38
rt_spark_friction 0.28
rt_spark_rest 0.55
rt_spark_trace_max 24
rt_spark_debris 1
rt_spark_debris_count 6
rt_spark_debris_life 1.4
rt_spark_debris_speed 3.4
rt_spark_debris_size 0.05
rt_spark_debris_gravity 17
rt_spark_debris_bounce 0.22
rt_spark_light 1
rt_spark_light_intensity 180
rt_spark_light_life 0.18
rt_spark_light_max 12
rt_spark_glow 1
rt_spark_glow_max 8
rt_spark_glow_intensity 26
rt_spark_surface_debug 1
rt_spark_debug 1
