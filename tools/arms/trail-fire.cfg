// THE TRIGGER, for the weapon-trail lab (MAP94).
//
// ONE LINE, and that is not style. `wait` defers only THE REST OF THE SAME
// COMMAND STRING (c_dispatch.cpp:376), so a cfg with one command per line runs
// every line immediately at exec time and the waits do nothing -- the gives
// land before the level exists and are silently dropped, and you spawn holding
// a pistol, which looks exactly like the arm having failed to apply. Same
// reason tools/ab-cheats.cfg is shaped this way.
//
// THE SEQUENCE, in map tics:
//    40  the level and the player exist; give the loadout
//    55  slot 3 -> shotgun
//    70  slot 3 again -> SUPER SHOTGUN (slot 3 cycles within the slot)
//    90  +attack, HELD and never released
//
// Held rather than tapped: the SSG fires, reloads over ~1.5 s with the sprite
// swinging across most of the lower frame, and fires again. That reload sweep
// IS the instrument -- it is what drags the sprite through the muzzle-lit fog.
// A single tap gives one sweep and one chance to catch it.
wait 40; give weapons; give ammo; slot 3; wait 15; slot 3; wait 20; +attack
