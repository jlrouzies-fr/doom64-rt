// ab lampshaft arm: lampshaft-solo -- SOLO BULBS ONLY.
//
// rt_volume_shaft_src 4. SFLATDE / SFLATCH / SFLATAS: single-bulb ceiling flats
// that show a lit bulb in the art, so a visible cone under one is the most
// defensible shaft in the game -- the fixture is painted, not inferred.
//
// They are also the DIMMEST (rt_solo_small_intensity 45 against the inset lamp's
// 700), so if a family is going to disappear under rt_volume_shaft_mincontrib it
// is this one. Check it here before raising that knob globally.
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_moon_presets 1
rt_flsh 0
rt_volume_type 1
rt_volume_far 60
rt_volume_scatter 1
rt_volume_ambient 0.2
rt_volume_lintensity 1
rt_volume_lassymetry 0.5
rt_volume_history 8
rt_volume_dither 5
rt_volume_dither_z 1
rt_volume_blur 1
rt_volume_occlude_emis 1
rt_ceiling_lamps 0
rt_ceiling_lamp_intensity 0
rt_ceiling_edge_lamps 1
rt_faux_lamps 1
rt_solo_lamps 1
rt_ceiling_bulb_gain 7
rt_ceiling_bulb_emis 20
rt_smoke 1
rt_volume_shafts 1
rt_volume_shaft_src 4
rt_volume_shaft_bands 4
rt_volume_shaft_max 32
rt_volume_shaft_trace 4
rt_volume_shaft_mult 1
rt_volume_shaft_nearfade 1.5
