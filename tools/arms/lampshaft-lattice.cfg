// ab lampshaft arm: lampshaft-lattice -- CEILING PERIMETER AND BULB PANES ONLY.
//
// rt_volume_shaft_src 2. By far the densest family: a lamp pane is ~16 point
// lights on a 16-unit lattice, so without the dedupe one pane takes the whole
// budget and produces a single blob while every other fixture in the room gets
// nothing. This arm keeps rt_volume_shaft_mingap at its shipping 96 -- compare
// against lampshaft-nogap, which turns it off, to see the failure it prevents.
//
// 20 of docs/rt-lighting-practices.md is the standing warning here: a dense
// family turned on wholesale is how ~105 flickering lights nearly landed on one
// map.
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_moon_presets 1
rt_flsh 0
rt_volume_type 1
rt_volume_far 60
rt_volume_scatter 1
rt_volume_ambient 0.2
rt_volume_lintensity 1
rt_volume_lassymetry 0.5
rt_volume_history 8
rt_volume_dither 5
rt_volume_dither_z 1
rt_volume_blur 1
rt_volume_occlude_emis 1
rt_ceiling_lamps 0
rt_ceiling_lamp_intensity 0
rt_ceiling_edge_lamps 1
rt_faux_lamps 1
rt_solo_lamps 1
rt_ceiling_bulb_gain 7
rt_ceiling_bulb_emis 20
rt_smoke 1
rt_volume_shafts 1
rt_volume_shaft_src 2
rt_volume_shaft_max 16
rt_volume_shaft_trace 3
rt_volume_shaft_mult 1
rt_volume_shaft_nearfade 1.5
rt_volume_shaft_falloff 1
rt_volume_shaft_relcull 0.05
rt_volume_shaft_mincontrib 0
rt_volume_shaft_asym -2
rt_volume_shaft_maxdist 1024
rt_volume_shaft_mingap 96
rt_volume_shaft_minint 0
rt_volume_shaft_debug 0
rt_volume_shaft_verbose 1
