// ab dust arm: dust-streak -- THE DENOISER SMEAR, kept runnable.
//
// This arm is the fat one's sizes with dust otherwise shipping, i.e. the
// configuration screen/pointyTriangles.png was taken in. The long pale wedges
// fanning from the screen centre in that shot were NOT geometry: RTGL1 matches a
// primitive to its previous frame by uniqueObjectID and then takes vertex i
// against vertex i, and this batch is a camera-relative cell sweep where vertex i
// is a different mote as soon as you move. Every mote reported a bogus
// world-space delta of metres, and the denoiser drew it.
//
// It is fixed with RG_MESH_PRIMITIVE_NO_MOTION_VECTORS, so this arm should now
// show big blocky motes and NO wedges. If wedges come back, the flag has stopped
// reaching GeomInfoManager::FindPrevFrameData and no amount of size tuning will
// help. Turn the camera while watching -- the smear only appeared on rotation.
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_moon_presets 1
rt_flsh 0
rt_volume_type 1
rt_volume_far 60
rt_volume_scatter 1
rt_volume_ambient 0.2
rt_volume_lintensity 1
rt_volume_lassymetry 0.5
rt_volume_history 8
rt_volume_dither 5
rt_volume_dither_z 1
rt_volume_blur 1
rt_volume_occlude_emis 1
rt_ceiling_lamps 0
rt_ceiling_lamp_intensity 0
rt_ceiling_edge_lamps 1
rt_faux_lamps 1
rt_solo_lamps 1
rt_ceiling_bulb_gain 7
rt_ceiling_bulb_emis 20
rt_smoke 1
rt_volume_shafts 1
rt_volume_shaft_src 7
rt_volume_shaft_bands 4
rt_volume_shaft_max 32
rt_volume_shaft_trace 4
rt_volume_shaft_mult 10
rt_volume_shaft_nearfade 1.5
rt_volume_shaft_falloff 0.5
rt_volume_shaft_relcull 0.05
rt_volume_shaft_mincontrib 0
rt_volume_shaft_asym -2
