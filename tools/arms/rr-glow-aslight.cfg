// ab arm: rr-glow-aslight -- rr-full with glow mode 2, THE candidate fix for
// the RR emissive jitter: the glow sits in RR's input at a FIXED pre-exposure
// scale. Temporally stable input (RR dejitters it -> no bulb shimmer) and no
// 1/exposure pulse (-> no flashlight/transition instability from the glow).
// The trade: glow brightness now rides auto-exposure like the bulb it halos
// -- brighter in dark rooms, dimmer in bright ones. If halos read wrong,
// rt_rr_glowscale is live (35 = old mid-exposure brightness).
//
// Judge: bulbs calm? flashlight toggles calm? halos plausible across
// bright/dark rooms?
//
// Self-contained: every RR-relevant value stated (ab-cvars-must-not-persist).
rt_upscale_dlss 2
rt_upscale_fsr2 0
rt_rayreconstr 1
rt_framegen 0
rt_sharpen 0
rt_dlss_preset 5
rt_rr_preset 5
rt_nrd 0
rt_nrd_validation 0
rt_nrd_maxaccum 0
rt_nrd_fastaccum 0
rt_nrd_atrous 0
rt_nrd_prepass_diff 0
rt_nrd_prepass_spec 0
rt_nrd_philum 0
rt_nrd_minhitdist 0
rt_nrd_antifirefly 1
// THE CONTRACT
rt_rr_preexposure 1
rt_rr_exptex 1
rt_rr_translayer 1
rt_rr_glowpre 2
rt_rr_glowscale 1
rt_rr_demod 1
rt_rr_demod_filter 1
rt_rr_restir_mcap 4
rt_rr_preexp_debug 0
// rt_rr_* held at shipping values.
rt_rr_temporal 0
rt_rr_disocc 1
rt_rr_disocc_ratio 3.0
rt_rr_disocc_mindelta 0.01
rt_rr_disocc_show 0
rt_rr_firefly 0
rt_rr_firefly_minlum 0.01
rt_rr_spechitdist 1
rt_rr_guide_mode 1
rt_rr_guide_min 0.01
rt_rr_reset_on_lightcut 1
rt_rr_reset_on_dynlight 1
rt_rr_reset_delta 0.5
rt_rr_reset_min_ms 250
rt_rr_reset_hold 0
rt_rr_reset_now 0
rt_rr_reset_debug 0
// Signal quality upstream of RR, held at shipping values -- state every one.
rt_restir_bluenoise 1
rt_restir_tjitter 2.0
rt_restir_indir_antilag 1
rt_restir_initial 32
rt_restir_spatial 8
rt_restir_spatial_radius 30
rt_restir_mcap 20
rt_shadow_samples 1
rt_spp_direct 1
rt_spp_indirect 1
rt_mip_bias 0
// Auto-exposure at stock range -- the exposure contract must actually be
// exercised for this arm to test it.
rt_tnmp_ev100_min 2.0
rt_tnmp_ev100_max 7.7

