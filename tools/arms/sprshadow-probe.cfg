// ab arm: sprshadow-probe -- IS THE RAY BEING BLOCKED AT ALL?
//
//   .\tools\ab.cmd sprshadow-probe 02
//
// Stand exactly where the wall shadow is missing: sprite in front of you, light
// to its RIGHT, wall to its LEFT, shadow appearing on the floor but not on the
// wall.
//
// rt_debug_visibility 1 draws the shadow-ray VISIBILITY TERM instead of
// radiance: BLACK where the ray was blocked, and nothing else in the image --
// no light colour, no intensity, no denoiser output to hide behind. It exists
// for exactly this question, because the final image cannot separate "the
// occluder never blocked the ray" from "the shadow is cast but drowned in fill
// light or smeared away" -- both look like no shadow, and four A/B ladders
// failed to tell them apart before this was added.
//
// READ IT LIKE THIS:
//
//   actor-shaped BLACK on the wall  -> the proxies ARE occluding, the geometry
//     is right, and the shadow is being lost downstream. That means light
//     SELECTION: ReSTIR picks one light per pixel, so a lamp's shadow only
//     resolves where that lamp wins the draw -- the same mechanism rt_sun_split
//     fixed for the moon, which local lights do not get. Go to sprshadow-max.
//
//   no black on the wall            -> the ray really is not being blocked, and
//     the cause is geometric: the plane facing that bearing is too narrow, the
//     proxy is not being emitted for that actor, or the wall point is sampling a
//     different light entirely. Try rt_sprite_shadow_planes 1 vs 4 here and
//     watch whether the black region changes shape at all -- if it does not, the
//     proxies are not reaching that surface.
//
// Note rt_debug_visibility shows visibility for the light the pixel CHOSE, so a
// wall pixel that picked a different lamp shows white for a reason that has
// nothing to do with the sprite. That is the ambiguity sprshadow-max resolves.
rt_debug_visibility 1
rt_sprite_shadow 1
rt_sprite_shadow_planes 4
rt_sprite_shadow_scope 1
rt_sprite_shadow_hidecaster 1
rt_sprite_shadow_width 1
rt_sprite_shadow_dist 40
rt_sun_split 1
rt_shadow_samples 1
rt_spp_direct 1
rt_upscale_dlss 2
rt_rayreconstr 0
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sky 25
rt_flsh 0
