// ab arm: pillarchase-hard -- the same chase with the contrast pushed. A darker
// floor and a narrower crest, so at any moment one face is clearly THE lit one.
// If the default arm reads as "the lamps are breathing" rather than "the light
// is going round", this is the one that says whether the shape is right and only
// the contrast is wrong.
//
//   .\tools\ab.cmd pillarchase-hard 01
rt_pillar_chase 1
rt_pillar_chase_period 1.83
rt_pillar_chase_floor 0.12
rt_pillar_chase_width 100
rt_pillar_chase_cw 1
rt_pillar_chase_debug 0
rt_wall_strips 1
rt_wall_strip_intensity 180
rt_wall_strip_minlight 120
rt_wall_strip_seglen 64
rt_wall_strip_radius 0.35
