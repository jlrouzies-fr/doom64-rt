// ab lampshaft arm: lampshaft-dense -- MORE MEDIUM, NOT MORE LIGHT.
//
// rt_volume_scatter 2. A shaft is the medium being lit, so when a beam reads
// weak there are two independent causes: too little air, or too little light in
// it. This arm moves the air; lampshaft-bright moves the light. Judge them
// separately or a retune will chase the wrong one.
//
// Note what this does that rt_volume_shaft_mult does not: rt_volume_scatter
// scales the ambient haze and the extinction along with the lit term, so the
// whole level gets foggier and distant geometry fades. If the shaft improves but
// the room looks hazy, the answer is lampshaft-bright.
//
// PER METRE since the moon-shaft fix -- rt_main.cpp normalises it against
// rt_volume_far, so this means the same thing at any reach
// (docs/moon-and-sky-leaks.md 5.4).
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_moon_presets 1
rt_flsh 0
rt_volume_type 1
rt_volume_far 60
rt_volume_scatter 2
rt_volume_ambient 0.2
rt_volume_lintensity 1
rt_volume_lassymetry 0.5
rt_volume_history 8
rt_volume_dither 5
rt_volume_dither_z 1
rt_volume_blur 1
rt_volume_occlude_emis 1
rt_ceiling_lamps 0
rt_ceiling_lamp_intensity 0
rt_ceiling_edge_lamps 1
rt_faux_lamps 1
rt_solo_lamps 1
rt_ceiling_bulb_gain 7
rt_ceiling_bulb_emis 20
rt_smoke 1
rt_volume_shafts 1
rt_volume_shaft_src 7
rt_volume_shaft_bands 4
rt_volume_shaft_max 32
rt_volume_shaft_trace 4
rt_volume_shaft_mult 10
rt_volume_shaft_nearfade 1.5
rt_volume_shaft_falloff 0.5
rt_volume_shaft_relcull 0.05
rt_volume_shaft_mincontrib 0
rt_volume_shaft_asym -2
rt_volume_shaft_maxdist 1920
rt_volume_shaft_mingap 96
rt_volume_shaft_minint 0
rt_volume_shaft_debug 0
rt_volume_shaft_verbose 0
rt_dust 1
rt_dust_density 0.10
rt_dust_max 900
rt_dust_far 12
rt_dust_near 0.5
rt_dust_size 0.008
rt_dust_size_ang 0.0022
