// ab cull arm: cull-black -- THE PLUMBING CHECK. Everything the engine can add
// light with, off. If the room is not BLACK, the cfg is not reaching the game
// and every other result in this suite is worthless.
//
// WHY THIS ARM EXISTS. cull-stock/-wide/-all/-dark turn off the two INFERRED
// FIXTURE families (rt_ceiling_lamps + rt_ceiling_edge_lamps, rt_wall_strips)
// and the room stayed fully lit -- screen/stilllight.png. That is not a failure
// of the arms; those cvars only govern lamps the ENGINE invents from a texture
// (rt_lights_fixtures.cpp). They have nothing to do with the two things
// actually lighting that corridor, both measured from MAP02's own TEXTMAP:
//
//   83 map LIGHT THINGS -- 48 x 9800 PointLight, 35 x 9802 PointLightFlicker.
//     Placed by the mapper, uploaded by rt_dynlight, which those arms set to 1
//     ON PURPOSE (to hold it fixed) and which therefore kept every one of them
//     burning. This is the family AGENTS.md pitfall 27 is about.
//   153 SECTORS AT LIGHTLEVEL >= 160, of which 74 are >= 220. rt_sector_emis
//     (0.35, floor rt_sector_emis_minlight 160) makes any surface in them EMIT
//     in proportion to that lightlevel. Doom 64 paints its lamp recesses bright,
//     so the glowing ceiling insets in the shot are largely this -- painted
//     brightness turned into real emission -- not a fixture light at all.
//
// So "the lamps are off and the room is still lit" is the expected result, and
// the honest next question is whether ANY of this is reaching the game. Hence a
// arm whose correct outcome is unambiguous: black.
//
//   room goes black    -> the cfgs apply; re-add sources one at a time
//                         (rt_sector_emis 0.35, then rt_dynlight 1) to find
//                         which one leaks through the culled wall
//   room still lit     -> nothing here is applying. Check the launcher took the
//                         +exec at all before touching another cvar; a tool
//                         printing a value is not evidence the game took it
//
// Not a look, not a candidate setting -- an instrument.
rt_cpu_cullmode 0
rt_cpu_nocullradius 10
// sky
rt_sun 0
rt_sky 0
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky_always 1
rt_sky_nowalls 0
// map-placed lights: the 83 things in MAP02
rt_dynlight 0
rt_sector_lights 0
// painted brightness as emission: the 153 sectors
rt_sector_emis 0
rt_emis_mapboost 0
// every inferred fixture family
rt_ceiling_lamps 0
rt_ceiling_edge_lamps 0
rt_wall_strips 0
rt_hang_lamps 0
rt_solo_lamps 0
rt_spin_panels 0
rt_switch_lights 0
// fx
rt_flame_light_on 0
rt_lava_light_on 0
// carried by the player -- these stay off or the room is never black
rt_flsh 0
rt_gunglow 0
rt_mzlflsh 0
