// ab arm: rr-full -- THE REDONE DLSS-RR, full input contract. Compare against
// rr-asvgf (the shipping denoiser). This is the arm that answers "is RR usable
// now"; the rr-no-* arms answer "which part did it".
//
// What "full contract" means (NVIDIA RR guide + Duke-RT reference):
//   1. PRE-exposure radiance in, exposure applied after RR (rt_rr_preexposure)
//   2. the 1x1 exposure texture tells the network the frame's absolute scale
//      (rt_rr_exptex) -- a neural denoiser is not scale-invariant
//   3. rasterized translucency (fireballs, flames, particles, flares) goes to
//      the NGX transparency layer, composited after denoise, instead of being
//      baked into the input where guides describe the wall behind it
//      (rt_rr_translayer)
//   4. ReSTIR temporal M capped low on RR frames (rt_rr_restir_mcap 4) so
//      reservoir noise refreshes fast enough to be temporally white -- the
//      stable dark-dot pattern IS long-lived reservoir winners, which is why
//      it switched when the flashlight toggled
//
// READ THE ARM BACK before judging (rt-console.log):
//   Denoiser path: DLSS-RR (...) preExposure=on (post-RR pass)
//   RR guides: ... pInExposureTexture=BOUND (1x1, CmPrepareFinal),
//              pInTransparencyLayer=BOUND (raster redirected)
//
// WHAT TO JUDGE, in play, in motion (stills cannot measure temporal noise):
//   - dark-dot pattern on lit walls and sprites: gone / reduced / unchanged?
//   - flashlight on/off: does the noise pattern still switch?
//   - the constant image jitter: gone? (that was a bug in the post-RR pass,
//     fixed unconditionally -- it should be gone in EVERY rr arm now)
//   - translucent sprites (imp fireballs, torch flames): crisper? haloed?
//
// Self-contained: every RR-relevant value stated (ab-cvars-must-not-persist).
rt_upscale_dlss 2
rt_upscale_fsr2 0
rt_rayreconstr 1
rt_framegen 0
rt_sharpen 0
rt_dlss_preset 5
rt_rr_preset 5
// THE CONTRACT
rt_rr_preexposure 1
rt_rr_exptex 1
rt_rr_translayer 1
rt_rr_restir_mcap 4
rt_rr_preexp_debug 0
// rt_rr_* held at shipping values.
rt_rr_temporal 0
rt_rr_disocc 1
rt_rr_disocc_ratio 3.0
rt_rr_disocc_mindelta 0.01
rt_rr_disocc_show 0
rt_rr_firefly 0
rt_rr_firefly_minlum 0.01
rt_rr_spechitdist 1
rt_rr_guide_mode 1
rt_rr_guide_min 0.01
rt_rr_reset_on_lightcut 1
rt_rr_reset_on_dynlight 1
rt_rr_reset_delta 0.5
rt_rr_reset_min_ms 250
rt_rr_reset_hold 0
rt_rr_reset_now 0
rt_rr_reset_debug 0
// Signal quality upstream of RR, held at shipping values -- state every one.
rt_restir_bluenoise 1
rt_restir_tjitter 2.0
rt_restir_indir_antilag 1
rt_restir_initial 32
rt_restir_spatial 8
rt_restir_spatial_radius 30
rt_restir_mcap 20
rt_shadow_samples 1
rt_spp_direct 1
rt_spp_indirect 1
rt_mip_bias 0
// Auto-exposure at stock range -- the exposure contract must actually be
// exercised for this arm to test it.
rt_tnmp_ev100_min 2.0
rt_tnmp_ev100_max 7.7
