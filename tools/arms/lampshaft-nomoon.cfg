// ab lampshaft arm: lampshaft-nomoon -- LAMP SHAFTS AND NOTHING ELSE IN THE AIR.
//
// rt_sun 0. The directional light is the one thing the froxel pass scattered
// before this feature existed, so turning it off leaves the interior lamps as
// the ONLY source of visible scattering. Any beam on screen here is this
// feature's.
//
// Use it when a shaft is ambiguous outdoors or near a skylight: the moon's own
// shaft and a ceiling lamp's land in the same air, and at a glance the wrong one
// gets credited. Not a look -- the level will read flat and dark.
rt_sun 0
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_moon_presets 1
rt_flsh 0
rt_volume_type 1
rt_volume_far 60
rt_volume_scatter 1
rt_volume_ambient 0.2
rt_volume_lintensity 1
rt_volume_lassymetry 0.5
rt_volume_history 8
rt_volume_dither 5
rt_volume_dither_z 1
rt_volume_blur 1
rt_volume_occlude_emis 1
rt_ceiling_lamps 0
rt_ceiling_lamp_intensity 0
rt_ceiling_edge_lamps 1
rt_faux_lamps 1
rt_solo_lamps 1
rt_ceiling_bulb_gain 7
rt_ceiling_bulb_emis 20
rt_smoke 1
rt_volume_shafts 1
rt_volume_shaft_src 7
rt_volume_shaft_max 16
rt_volume_shaft_trace 3
rt_volume_shaft_mult 1
rt_volume_shaft_nearfade 1.5
rt_volume_shaft_falloff 1
rt_volume_shaft_relcull 0.05
rt_volume_shaft_mincontrib 0
rt_volume_shaft_asym -2
rt_volume_shaft_maxdist 1024
rt_volume_shaft_mingap 96
rt_volume_shaft_minint 0
rt_volume_shaft_debug 0
rt_volume_shaft_verbose 1
