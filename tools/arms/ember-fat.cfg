// ab arm: ember-fat
// RUN THIS FIRST. A huge scorch packed with big, bright, long-lived
// embers pouring smoke. It proves the PLUMBING before any value is
// judged, and the plumbing here is the longest on the page: a mark
// exists only if the walk matched `Rocket`, the MF_MISSILE edge fired
// and the probe found a surface -- and a WISP needs all of that plus
// rt_smoke, rt_arc_burn and a free ambient budget slot.
//
// rt_spark_debug is on, so the `sparks` ladder prints once a second
// with the mark and wisp counts broken out. Read it rather than
// guessing: `0 marks` is a spawn problem, `N marks, 0 wisps` is a
// smoke problem, and the two have nothing to do with each other.
//
// ROCKET IMPACT EMBERS -- a few hot spots still glowing IN the scorch a
// rocket burns into the wall, seeping thin threads of smoke while hot.
// They do NOT fly and they do NOT fall: an ember is part of the mark.
// The ONLY impact in the game that gets smoke. See docs/rt-impact-fx.md.
// Self-contained: every rt_ember_* value is stated, plus the rt_arc_burn_*
// group (the scorch is shared with the arcs) and rt_smoke (no wisp can
// spawn without it), so no arm inherits another's ini leftovers.
// Applied with +exec AFTER tools/d64rt-pins.cfg, so these win.
rt_ember 1
rt_ember_count 16
rt_ember_life 30
rt_ember_scatter 0.4
rt_ember_size 0.09
rt_ember_bright 5.0
rt_ember_glow_intensity 55
rt_ember_glow_radius 0.10
rt_ember_halo 0
rt_ember_halo_alpha 0.35
rt_ember_flicker 0.55
rt_ember_flicker_rate 1.6
rt_ember_far 40
rt_ember_burn_scale 4.0
rt_ember_smoke 1
rt_ember_smoke_every 0.12
rt_ember_smoke_delay 0.1
rt_ember_smoke_hot 0.55
rt_ember_smoke_lift 2.0
rt_ember_smoke_drift 0.35
rt_ember_smoke_radius 0.06
rt_ember_smoke_life 3.0
rt_ember_smoke_density 0.55
rt_ember_smoke_max 60
rt_arc 1
rt_arc_burn 1
rt_arc_burn_life 0
rt_arc_burn_radius 0.50
rt_arc_burn_color 0A0807
rt_arc_burn_color_var 0.65
rt_arc_burn_mottle 0.7
rt_arc_burn_blobs 9
rt_arc_burn_strength 1.00
rt_arc_burn_dist 25
rt_arc_burn_max 96
rt_smoke 1
rt_smoke_rocket 1
rt_smoke_projectile 1
rt_spark 0
rt_spark_surface_debug 0
rt_spark_debug 1
