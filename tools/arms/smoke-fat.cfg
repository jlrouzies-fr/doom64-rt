// ab-smoke arm: fat
// Self-contained: every rt_smoke_* value is stated, so no arm can inherit
// another's leftovers from the ini (they are CVAR_ARCHIVE).
// Applied with +exec AFTER tools/d64rt-pins.cfg, so these win.
rt_fog 0
rt_fog_presets 0
rt_volume_type 1
rt_volume_blur 1
rt_volume_occlude_emis 1
rt_volume_dither 2
rt_smoke 1
rt_smoke_density 24
rt_smoke_color 9E9689
// 8, because the shipping count is now 4 and this arm has to be
// unmistakable: it exists to prove the injection is LIVE before any
// value is tuned, so it must not be a subtle variation on the default.
rt_smoke_count 8
rt_smoke_budget 32
rt_smoke_life 2.2
rt_smoke_radius 0.8
rt_smoke_growth 0.5
rt_smoke_speed 1.8
rt_smoke_spread 0.55
rt_smoke_rise 0.65
rt_smoke_drag 1.9
rt_smoke_inherit 0.85
rt_smoke_offset 0.7
rt_smoke_repeat 5
rt_smoke_far 14
rt_smoke_ambient 0.08
rt_smoke_illum 1
rt_smoke_spp 4
rt_smoke_maxlight 6
rt_smoke_light_near 0.5
rt_smoke_monster 1
rt_smoke_monster_scale 1
rt_smoke_monster_far 18
rt_smoke_trail 1
rt_smoke_curl 1.6
rt_smoke_rocket 1
rt_smoke_rocket_every 1
rt_smoke_rocket_radius 0.16
rt_smoke_boom 5
rt_smoke_boom_radius 0.34
rt_smoke_light_far 6
rt_smoke_illum_blend 0.4
rt_smoke_debug 1
