// ab arm: title-samples -- ONE of title-sharp's four changes: the shadow rays.
//
//   .\tools\ab.cmd title-samples menu
//
// title-sharp made the 64MarineBot shadows appear (confirmed 2026-08-13), which
// settles the mechanism: the shadows were always being cast, and the pipeline
// was throwing them away. But it changed FOUR things at once -- upscaler off,
// RR off, rt_shadow_samples 1->8, rt_spp_direct 1->4 -- and native resolution is
// not shippable. This arm and title-native split the credit.
//
// This one keeps the pinned DLSS (balanced) and raises ONLY the shadow rays.
//
// Why it is the prime suspect, from the cvar's own description: "Direct
// illumination multiplies by a single binary visibility ray, so at 1 spp a
// pixel is fully lit or fully black -- that 0/1 term dominates the raw noise and
// is untouched by ReSTIR or by any denoiser tuning." A thin distant sprite's
// umbra covers a fraction of a pixel, so at 1 spp each pixel along it is a coin
// flip, and a coin flip with no temporal history is exactly what a denoiser
// averages to nothing. N samples make it a soft fraction instead; noise falls as
// 1/sqrt(N).
//
// Cost is N-1 extra rays per pixel -- real, but far cheaper than turning the
// upscaler off. If the shadows come back here, the fix is a sample count and
// title-cheap finds how few are enough.
rt_shadow_samples 8
rt_spp_direct 1
rt_spp_indirect 1
rt_upscale_dlss 2
rt_rayreconstr 0
// play lighting, unchanged
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_flsh 0
