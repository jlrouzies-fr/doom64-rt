// ab arm: gi-fix3-unlit -- GI bounce ladder (docs/rt-gi-bounces.md)
//
//   .\tools\ab.cmd gi-fix3-unlit 03
//
// THE "DEEP BUT UNLIT" CONTROL for gi-fix3. Same depth 3, same fix, but the
// shadow-ray floor is OFF and rt_shadowrays stays 3 -- so vertex 3 exists,
// costs its ray and its RIS pass, and samples no analytic lights. What is left
// of the depth-3 gain here is emissive surfaces only. gi-fix3 minus this arm
// is what lighting the deeper vertex is actually worth.
//
// Judge on the UNFILTERED signal first: rt_debug_show 16 (raw indirect) and
// 128 (only indirect diffuse). Exposure is pinned below so you are judging GI,
// not eye adaptation. Every value here is the live ini value except the one
// this arm exists to move.
rt_shadowrays 3
rt_gi_bounces 3
rt_gi_bounce_legacy 0
rt_gi_bounce_shadows 0
rt_spp_indirect 3
rt_spp_direct 1
rt_shadow_samples 1
rt_restir_initial 32
rt_restir_spatial 8
rt_restir_mcap 20
rt_reflrefr_depth 2
rt_tnmp_ev100_min 2
rt_tnmp_ev100_max 7.7
rt_debug_show 0
rt_debug_restir_m 0
rt_debug_visibility 0
rt_upscale_dlss 2
rt_rayreconstr 0
