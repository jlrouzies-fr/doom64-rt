// ab arm: rr-disocc-strict -- rr-full with the tile mask's thresholds
// raised (ratio 3->5, mindelta 0.01->0.05): a tile must change MUCH harder
// before RR history is discarded. THE LIGHT-SQUARES A/B: with many small
// bulbs + sparse candidates the tile means are noisy and the stock ratio
// trips spuriously, painting 16x16 squares of re-converging history. If the
// squares vanish here and transient lights still reset promptly, these
// become the defaults. Both cvars are live for finer laddering.
//
// Self-contained: every RR-relevant value stated (ab-cvars-must-not-persist).
rt_upscale_dlss 2
rt_upscale_fsr2 0
rt_rayreconstr 1
rt_framegen 0
rt_sharpen 0
rt_dlss_preset 5
rt_rr_preset 5
rt_nrd 0
rt_nrd_validation 0
rt_nrd_maxaccum 0
rt_nrd_fastaccum 0
rt_nrd_atrous 0
rt_nrd_prepass_diff 0
rt_nrd_prepass_spec 0
rt_nrd_philum 0
rt_nrd_minhitdist 0
rt_nrd_antifirefly 1
// THE CONTRACT
rt_rr_preexposure 1
rt_rr_exptex 1
rt_rr_translayer 1
rt_rr_glowpre 2
rt_rr_glowscale 1
rt_rr_demod 1
rt_rr_demod_filter 1
rt_rr_restir_mcap 4
rt_rr_preexp_debug 0
// rt_rr_* held at shipping values.
rt_rr_temporal 0
rt_rr_disocc 1
rt_rr_disocc_ratio 5.0
rt_rr_disocc_mindelta 0.05
rt_rr_disocc_show 0
rt_rr_firefly 0
rt_rr_firefly_minlum 0.01
rt_rr_spechitdist 1
rt_rr_guide_mode 1
rt_rr_guide_min 0.01
rt_rr_reset_on_lightcut 1
rt_rr_reset_on_dynlight 1
rt_rr_reset_delta 0.5
rt_rr_reset_min_ms 250
rt_rr_reset_hold 0
rt_rr_reset_now 0
rt_rr_reset_debug 0
// Signal quality upstream of RR, held at shipping values -- state every one.
rt_restir_bluenoise 1
rt_restir_tjitter 2.0
rt_restir_indir_antilag 1
rt_restir_initial 32
rt_restir_spatial 8
rt_restir_spatial_radius 30
rt_restir_mcap 20
rt_shadow_samples 1
rt_spp_direct 1
rt_spp_indirect 1
rt_mip_bias 0
// Auto-exposure at stock range -- the exposure contract must actually be
// exercised for this arm to test it.
rt_tnmp_ev100_min 2.0
rt_tnmp_ev100_max 7.7

