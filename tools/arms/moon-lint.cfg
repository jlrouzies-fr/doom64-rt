// ab moon arm: moon-lint -- BRIGHTER SHAFTS WITHOUT MORE HAZE.
//
// rt_volume_lintensity 1 -> 2. Note it is NOT in tools/d64rt-pins.cfg today, so
// it has silently been running at its compiled 1; if this arm wins it has to be
// added there, or the ini decides it.
//
// The difference from moon-dens matters. In RtVolumetric.rgen the cell stores
//
//     lighting  = volumeAmbient + volumeLightMult * radiance * phase
//     imageStore( ..., vec4( lighting * scattering, scattering + absorbtion ) )
//
// so rt_volume_scatter moves BOTH terms -- the lit shaft and the grey ambient
// haze, and the extinction with them -- while rt_volume_lintensity moves only
// the lit part. That makes this the arm for "the shaft should read, but the
// level should not get foggier".
//
// It sits ON TOP of the per-metre normalisation, not instead of it: the density
// is already back to what it was, and this asks for brighter shafts than the
// moon has ever cast. It also brightens every other light scattering in the
// medium -- a lamp standing in it, a lava pool -- since volumeLightMult is
// global to the volume. Take this over moon-dens when the shafts want lifting
// but the level does not want thickening.
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_moon_presets 1
rt_flsh 0
rt_volume_type 1
rt_volume_far 60
rt_volume_scatter 1
rt_volume_ambient 0.2
rt_volume_lintensity 2
rt_volume_lassymetry 0.5
rt_volume_history 8
rt_volume_dither 5
rt_volume_dither_z 1
rt_volume_blur 1
rt_volume_occlude_emis 1
rt_ceiling_bulb_gain 7
rt_ceiling_bulb_emis 20
rt_smoke 1
