// ab moon arm: moon-far30 -- THE PROOF THAT THE REACH NO LONGER CHANGES THE
// DENSITY.
//
// One line off moon-now: rt_volume_far 60 -> 30, the reach the pins carried
// until commit 11417f2 ("smoke: pin lightmult 4 and volume_far 60").
//
// Before the fix this arm was the whole answer -- it was the pre-smoke moon,
// because the shader's coefficient is per CELL and the grid is 64 slices at any
// reach, so half the reach was twice the density per metre. Now rt_main.cpp
// normalises rt_volume_scatter per metre against 30 m, and the point of this arm
// inverts:
//
//     moon-far30 and moon-now must look THE SAME near the camera, and differ
//     only in how far the haze carries.
//
// That is the acceptance test for the normalisation. If they still differ close
// up, the scale is not being applied and moon-before will show no difference
// either.
//
// NOT A CANDIDATE TO SHIP. The reach is smoke's render distance -- the froxel
// grid is camera-fitted, so a puff past this plane is not represented at all,
// and rt_smoke_ambient_far is 60 m of torch smoke whose far half this arm cannot
// draw. It buys resolution (0.47 m slices instead of 0.94), which is worth a
// look on a puff, and costs everything beyond 30 m.
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_moon_presets 1
rt_flsh 0
rt_volume_type 1
rt_volume_far 30
rt_volume_scatter 1
rt_volume_ambient 0.2
rt_volume_lintensity 1
rt_volume_lassymetry 0.5
rt_volume_history 8
rt_volume_dither 5
rt_volume_dither_z 1
rt_volume_blur 1
rt_volume_occlude_emis 1
rt_ceiling_bulb_gain 7
rt_ceiling_bulb_emis 20
rt_smoke 1
