// ab arm: pillarchase-off -- the CONTROL. MAP01's pre-exit hall exactly as it
// ships today: four static lights on the pillar's SFLATAQ bulb faces, nothing
// turning. This is what replaced the stripped ACS script 12.
//
//   .\tools\ab.cmd pillarchase-off 01
//
// Every value the other arms set is set here too, so no arm inherits from the ini.
rt_pillar_chase 0
rt_pillar_chase_period 1.83
rt_pillar_chase_floor 0.35
rt_pillar_chase_width 140
rt_pillar_chase_cw 1
rt_pillar_chase_debug 0
rt_wall_strips 1
rt_wall_strip_intensity 180
rt_wall_strip_minlight 120
rt_wall_strip_seglen 64
rt_wall_strip_radius 0.35
