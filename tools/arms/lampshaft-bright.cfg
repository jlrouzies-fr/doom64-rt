// ab lampshaft arm: lampshaft-bright -- MORE LIGHT, NOT MORE MEDIUM.
//
// rt_volume_shaft_mult 40. The lit term only: the haze, the extinction and the
// moon's own shafts are all untouched, which is exactly why this knob is
// separate from rt_volume_lintensity (global to the volume) and from
// rt_volume_scatter (the medium itself).
//
// Take this over lampshaft-dense when the beams want lifting but the level does
// not want thickening. 40 is 4x the shipping 10 -- a deliberate step, not a
// proposal. If it reads right, halve it and check again before pinning.
//
// NOTE THE BASELINE MOVED. This was 4 against a shipping mult of 1; both were
// scaled when 10 was judged in play, because an arm defined as a MULTIPLE of the
// shipping value silently becomes a no-op -- or an inversion -- when that value
// changes underneath it.
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_moon_presets 1
rt_flsh 0
rt_volume_type 1
rt_volume_far 60
rt_volume_scatter 1
rt_volume_ambient 0.2
rt_volume_lintensity 1
