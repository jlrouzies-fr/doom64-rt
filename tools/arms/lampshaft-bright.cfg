// ab lampshaft arm: lampshaft-bright -- MORE LIGHT, NOT MORE MEDIUM.
//
// rt_volume_shaft_mult 4. The lit term only: the haze, the extinction and the
// moon's own shafts are all untouched, which is exactly why this knob is
// separate from rt_volume_lintensity (global to the volume) and from
// rt_volume_scatter (the medium itself).
//
// Take this over lampshaft-dense when the beams want lifting but the level does
// not want thickening. 4 is a deliberate step, not a proposal -- if it reads
// right, halve it and check again before pinning.
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_moon_presets 1
rt_flsh 0
rt_volume_type 1
rt_volume_far 60
rt_volume_scatter 1
rt_volume_ambient 0.2
rt_volume_lintensity 1
rt_volume_lassymetry 0.5
rt_volume_history 8
rt_volume_dither 5
rt_volume_dither_z 1
rt_volume_blur 1
rt_volume_occlude_emis 1
rt_ceiling_lamps 0
rt_ceiling_lamp_intensity 0
rt_ceiling_edge_lamps 1
rt_faux_lamps 1
rt_solo_lamps 1
rt_ceiling_bulb_gain 7
rt_ceiling_bulb_emis 20
rt_smoke 1
rt_volume_shafts 1
rt_volume_shaft_src 7
rt_volume_shaft_max 16
rt_volume_shaft_trace 3
rt_volume_shaft_mult 4
rt_volume_shaft_nearfade 1.5
rt_volume_shaft_mincontrib 0
rt_volume_shaft_asym -2
rt_volume_shaft_maxdist 1024
rt_volume_shaft_mingap 96
rt_volume_shaft_minint 0
rt_volume_shaft_debug 0
rt_volume_shaft_verbose 1
