// ab dust arm: dust-on -- THE SHIPPING VALUES.
//
// Everything at its compiled default and its pin, so this is what play looks
// like. rt_dust_debug is on in every arm of this family: the console line prints
// the derived CELL SPACING, which says whether rt_dust_density or rt_dust_max is
// actually deciding the look -- they are not independent, the coarser wins.
//
// What to look for: motes bright inside a shaft and gone outside it. They are
// real traced geometry with no emission of their own, so a mote in shadow is
// black. If they glow in a dark room something is very wrong -- that would mean
// the batch was demoted to the rasterized overlay, which is fullbright.
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_moon_presets 1
rt_flsh 0
rt_volume_type 1
rt_volume_far 60
rt_volume_scatter 1
rt_volume_ambient 0.2
rt_volume_lintensity 1
rt_volume_lassymetry 0.5
rt_volume_history 8
rt_volume_dither 5
rt_volume_dither_z 1
rt_volume_blur 1
rt_volume_occlude_emis 1
rt_ceiling_lamps 0
rt_ceiling_lamp_intensity 0
rt_ceiling_edge_lamps 1
rt_faux_lamps 1
rt_solo_lamps 1
rt_ceiling_bulb_gain 7
rt_ceiling_bulb_emis 20
rt_smoke 1
rt_volume_shafts 1
rt_volume_shaft_src 7
rt_volume_shaft_bands 4
rt_volume_shaft_max 32
rt_volume_shaft_trace 4
rt_volume_shaft_mult 1
rt_volume_shaft_nearfade 1.5
rt_volume_shaft_falloff 1
rt_volume_shaft_relcull 0.05
rt_volume_shaft_mincontrib 0
rt_volume_shaft_asym -2
rt_volume_shaft_maxdist 1920
rt_volume_shaft_mingap 96
rt_volume_shaft_minint 0
rt_volume_shaft_debug 0
rt_volume_shaft_verbose 1
rt_dust 1
rt_dust_density 0.10
rt_dust_max 900
rt_dust_far 12
rt_dust_near 0.5
rt_dust_size 0.008
rt_dust_size_ang 0.0022
rt_dust_color C8C8C8
rt_dust_albedo 0.9
rt_dust_drift 0.35
rt_dust_speed 0.25
rt_dust_cone -0.25
rt_dust_debug 1
