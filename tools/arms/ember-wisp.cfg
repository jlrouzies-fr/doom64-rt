// ab arm: ember-wisp
// THE WISPS MADE UNMISSABLE, for judging WHERE THEY ARE rather than
// how they look. Three embers only, but each pouring fat, dense,
// long-lived parcels from the first moment.
//
// This is the arm for the 'smoke is inside the wall' class of bug --
// shoot a rocket at a VERTICAL wall and watch from the side. The
// smoke should leave the surface and then rise; if it climbs the wall
// half buried, rt_ember_smoke_lift and rt_ember_smoke_drift are the
// two knobs, and note that lift is in multiples of the parcel RADIUS
// -- which this arm doubles, so it also tests that the lift really
// scales with it.
//
// ROCKET IMPACT EMBERS -- a few hot spots still glowing IN the scorch a
// rocket burns into the wall, seeping thin threads of smoke while hot.
// They do NOT fly and they do NOT fall: an ember is part of the mark.
// The ONLY impact in the game that gets smoke. See docs/rt-impact-fx.md.
// Self-contained: every rt_ember_* value is stated, plus the rt_arc_burn_*
// group (the scorch is shared with the arcs) and rt_smoke (no wisp can
// spawn without it), so no arm inherits another's ini leftovers.
// Applied with +exec AFTER tools/d64rt-pins.cfg, so these win.
rt_ember 1
rt_ember_count 3
rt_ember_life 30
rt_ember_scatter 0.4
rt_ember_size 0.01
rt_ember_bright 2.0
rt_ember_glow_intensity 55
rt_ember_glow_radius 0.10
rt_ember_halo 0
rt_ember_halo_alpha 0.35
rt_ember_flicker 0.55
rt_ember_flicker_rate 1.6
rt_ember_far 40
rt_ember_burn_scale 3.4
rt_ember_smoke 1
rt_ember_smoke_every 0.10
rt_ember_smoke_delay 0.05
rt_ember_smoke_hot 1.0
rt_ember_smoke_lift 2.0
rt_ember_smoke_drift 0.35
rt_ember_smoke_radius 0.12
rt_ember_smoke_life 2.5
rt_ember_smoke_density 1.6
rt_ember_smoke_max 40
rt_arc 1
rt_arc_burn 1
rt_arc_burn_life 0
rt_arc_burn_radius 0.50
rt_arc_burn_color 0A0807
rt_arc_burn_color_var 0.65
rt_arc_burn_mottle 0.7
rt_arc_burn_blobs 9
rt_arc_burn_strength 1.00
rt_arc_burn_dist 25
rt_arc_burn_max 96
rt_smoke 1
rt_smoke_rocket 1
rt_smoke_projectile 1
rt_spark 0
rt_spark_surface_debug 0
rt_spark_debug 0
