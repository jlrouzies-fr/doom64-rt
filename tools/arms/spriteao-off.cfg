// ab arm: spriteao-off -- the CONTROL for spriteao-on. No contact occlusion.
//
//   .\tools\ab.cmd spriteao-off 02      run this first
//
// rt_sprite_ao 0, identical in every other value, so the pair isolates one flag.
// A separate cfg rather than "just launch normally" because rt_sprite_ao* are
// CVAR_ARCHIVE: after one spriteao-on run the ini holds 1, and an unarmed launch
// would be testing the feature while looking like a baseline.
//
// WHAT TO LOOK AT, so the comparison has a subject. Two shots, and the second is
// the one that matters:
//
//   1. A DROPPED WEAPON or a corpse on a lit floor. These get no shadow proxy at
//      all (rt_sprite_shadow_scope 1 excludes them by design -- a vertical cross
//      through a flat plate throws radiating spokes), so today they are pasted
//      onto the floor with nothing under them.
//   2. AN ENEMY WITH THE LIGHT TO ITS SIDE. This is the case the proxies still
//      lose: a light lying in a proxy plane projects it to a line. The blob does
//      not care where the light is, so it is what is left holding the actor down.
//
// Sprite shadows stay ON in both arms. The blob is not a replacement for them
// and testing it with them off would answer a question nobody asked.
rt_sprite_ao 0
rt_sprite_ao_strength 0.7
rt_sprite_ao_radius 1.6
rt_sprite_ao_upright 0.7
rt_sprite_ao_sizefall 0.6
rt_sprite_ao_shape 1
rt_sprite_ao_fit 1
rt_sprite_ao_aspect 0.4
rt_sprite_ao_fade 56
rt_sprite_ao_scope 0
rt_sprite_ao_segments 32
rt_sprite_ao_dist 30
rt_sprite_ao_debug 0
// shipping sprite shadows, unchanged across the pair
rt_sprite_shadow 1
rt_sprite_shadow_planes 4
rt_sprite_shadow_scope 1
rt_sprite_shadow_hidecaster 1
rt_sprite_shadow_width 1
rt_sprite_shadow_dist 40
rt_sun_split 1
rt_shadow_samples 1
rt_spp_direct 1
rt_upscale_dlss 2
rt_rayreconstr 0
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sky 25
rt_flsh 0
