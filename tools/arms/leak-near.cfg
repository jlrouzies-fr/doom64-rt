// ab leak arm: leak-near -- IS IT THE LAMPS IN THIS ROOM, or lamps far away?
//
// rt_volume_shaft_maxdist 128 map units (4 m): a fixture further than that from
// the camera is dropped before it is even offered to the shader. Shipping is
// 1920 (60 m, the froxel volume's own reach), and rt_volume_shaft_max 32 lets
// three dozen fixtures from all over the level contribute at once.
//
// THIS MATTERS MORE AT MULT 200 THAN IT LOOKS. A lamp's scattering is inverse
// square, softened by rt_volume_shaft_falloff 0.5, so it falls as ~d^-1.5: a
// fixture at 20 m contributes ~1/89 of one at 1 m. At the shipping mult of 10
// that is nothing; at 200 it is ~2.2, i.e. comparable to a lamp in your face at
// shipping brightness. So at 200 the whole level's fixtures light the whole
// volume, and that is arithmetic rather than a leak.
//
//   haze collapses -> much of what looks like leaking is distant fixtures being
//                     summed, and the honest test is leak-base at mult 10.
//   haze stays     -> it is coming from something within 4 m and the froxel
//                     arms are the next step.
//
// CONDITIONS, held by every leak-* arm so they differ in ONE thing only:
//
//   rt_cpu_cullmode 0      THE STOCK DEFAULT, and play's setting. Mode 2 was
//   rt_cpu_nocullradius 20 never the configuration -- it was set by hand once,
//                          on one map, and persisted in the ini because it is
//                          CVAR_ARCHIVE and nothing pinned it. Culling is NOT a
//                          variable here: on 2026-08-15 the leak survived both
//                          mode 0 at a 40 m shell and mode 2 (the whole map in
//                          the acceleration structure), which retires "a wall is
//                          missing from the AS" as the explanation
//                          (moon-and-sky-leaks.md 5.1). 20 m is the shell that
//                          answers the separate "a wall behind me culls" report.
//   rt_sun 0 + intensity 0 moon OFF, so every lit froxel in frame is a LAMP.
//   rt_moon_presets 0      LOAD-BEARING, not tidiness. RT_MoonApplyPresets
//                          (rt_presets.cpp:412-424) rewrites rt_sun_a / _b /
//                          rt_sun_intensity from RT_MOON_PRESETS on EVERY level
//                          load while presets are on, so an arm that turns the
//                          sun off and leaves this at 1 gets the moon back at
//                          map load and never says so.
//   shaft_mult 200         20x shipping, reproducing screen/shaft200.png. A
//                          residual invisible at 10 is unmissable here -- so
//                          re-check whatever survives at mult 10 before
//                          treating it as a defect.
rt_sun 0
rt_sun_intensity 0
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_moon_presets 0
rt_flsh 0
rt_volume_type 1
rt_volume_far 60
rt_volume_scatter 1
rt_volume_ambient 0.2
rt_volume_lintensity 1
rt_volume_lassymetry 0.5
rt_volume_history 8
rt_volume_dither 5
rt_volume_dither_z 1
rt_volume_blur 1
rt_volume_occlude_emis 1
rt_ceiling_lamps 0
rt_ceiling_lamp_intensity 0
rt_ceiling_edge_lamps 1
rt_faux_lamps 1
rt_solo_lamps 1
rt_ceiling_bulb_gain 7
rt_ceiling_bulb_emis 20
rt_smoke 1
rt_volume_shafts 1
rt_volume_shaft_src 7
rt_volume_shaft_bands 4
rt_volume_shaft_max 32
rt_volume_shaft_trace 4
rt_volume_shaft_mult 200
rt_volume_shaft_nearfade 1.5
rt_volume_shaft_falloff 0.5
rt_volume_shaft_relcull 0.05
rt_volume_shaft_mincontrib 0
rt_volume_shaft_asym -2
rt_volume_shaft_maxdist 128
rt_volume_shaft_mingap 96
rt_volume_shaft_minint 0
rt_volume_shaft_debug 0
rt_volume_shaft_verbose 0
rt_dust 1
rt_dust_density 0.10
rt_dust_max 900
rt_dust_far 12
rt_dust_near 0.5
rt_dust_size 0.008
rt_dust_size_ang 0.0022
rt_dust_color C8C8C8
rt_dust_albedo 0.9
rt_dust_drift 0.35
rt_dust_speed 0.25
