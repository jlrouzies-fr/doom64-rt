rt_dust_variance 0.75
rt_dust_size_var 0.6
rt_dust_fade 0.25
rt_dust_shaft_floor 0.08
rt_dust_shaft_radius 2.5
rt_dust_moon 1
rt_dust_moon_weight 1.0
rt_dust_clip 1
rt_dust_debug 0
rt_cpu_cullmode 0
rt_cpu_nocullradius 20
