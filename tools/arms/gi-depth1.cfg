// ab arm: gi-depth1 -- GI bounce ladder (docs/rt-gi-bounces.md)
//
//   .\tools\ab.cmd gi-depth1 03
//
// LIVENESS PROBE for the rt_gi_bounces plumbing (run before trusting any
// depth arm). Depth 1 removes the second bounce entirely. With the legacy
// weight on, that bounce is ~6x overweighted, so its absence must be OBVIOUS
// on rt_debug_show 16 -- colour bleed and fill in GI-lit corners drop out.
// If gi-depth1 and gi-shadow3 look the same, the uniform is not arriving:
// go back to the build log (=== ShaderCommonC.h changed === must have
// printed) and grep the staged .spv for indirectBounces.
//
// Judge on the UNFILTERED signal first: rt_debug_show 16 (raw indirect) and
// 128 (only indirect diffuse). Exposure is pinned below so you are judging GI,
// not eye adaptation. Every value here is the live ini value except the one
// this arm exists to move.
rt_shadowrays 3
rt_gi_bounces 1
rt_gi_bounce_legacy 1
rt_gi_bounce_shadows 1
rt_spp_indirect 3
rt_spp_direct 1
rt_shadow_samples 1
rt_restir_initial 32
rt_restir_spatial 8
rt_restir_mcap 20
rt_reflrefr_depth 2
rt_tnmp_ev100_min 2
rt_tnmp_ev100_max 7.7
rt_debug_show 0
rt_debug_restir_m 0
rt_debug_visibility 0
rt_upscale_dlss 2
rt_rayreconstr 0
