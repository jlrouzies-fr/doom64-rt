// ab arm: fire-still
// NO MOTION -- flipbook stopped and lean off, so every flame is one frozen
// drawing. Isolates how much of 'this reads as fire' is the ANIMATION and how
// much is the art and the colour.
//
// FIREBALL IMPACTS -- flames actually burning on the surface where a monster's
// fireball landed, in that projectile's own colour, over a small fading scorch.
//   BAL1 orange (imp)   BAL3 violet (nightmare imp)
//   BAL7 green (HELL KNIGHT)   BAL8 red (BARON OF HELL)
// Self-contained: every rt_fire_* value is stated, plus the rt_arc_burn_* group
// (the scorch is shared with the arcs) and rt_smoke (no wisp can spawn without
// it), so no arm inherits another's ini leftovers.
// Applied with +exec AFTER tools/d64rt-pins.cfg, so these win.
//
// WHERE: MAP97, the smoke lab's DARK room -- fire ADDS light rather than
// removing albedo, so the bright room that suits a scorch is the wrong one
// here. And the only way to test that anything ASKS for a mark is to summon
// the monster: 64DoomImp, 64NightmareImp, 64HellKnight, 64BaronOfHell.
rt_fire 1
rt_fire_count 7
rt_fire_life 3.5
rt_fire_size 12
rt_fire_scatter 0.9
rt_fire_bright 1.6
rt_fire_rate 0
rt_fire_flicker 0.45
rt_fire_flicker_rate 2.2
rt_fire_sway 0
rt_fire_tex 1
rt_fire_tint 1
rt_fire_glow 90
rt_fire_far 40
rt_fire_burn_scale 1.4
rt_fire_burn_life 25
rt_fire_smoke 1
rt_fire_smoke_delay 0.15
rt_fire_smoke_scale 1.6
rt_fire_debug 0
rt_arc 1
rt_arc_burn 1
rt_arc_burn_radius 0.50
rt_arc_burn_color 120C06
rt_arc_burn_color_var 0.65
rt_arc_burn_mottle 0.7
rt_arc_burn_blobs 9
rt_arc_burn_strength 1.00
rt_arc_burn_dist 25
rt_arc_glow 1
rt_smoke 1
rt_ember_smoke_every 0.30
rt_ember_smoke_hot 0.55
rt_ember_smoke_lift 2.0
rt_ember_smoke_drift 0.35
rt_ember_smoke_radius 0.06
rt_ember_smoke_life 2.0
rt_ember_smoke_density 0.55
rt_ember_smoke_max 10
rt_spark 0
rt_arc_debug 0
