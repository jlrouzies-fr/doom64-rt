// ab arm: arc-crackle
// The opposite arm: maximum crackle, fast, and long-lived enough to
// watch. For judging the flicker ALONE. Note what rate does -- it
// quantizes the age, so raising it makes branches switch more often
// but for shorter; past about 4 the eye stops resolving individual
// dropouts and it averages back into a dimmer, steady mark.
//
// PROJECTILE IMPACT ARCS -- a MARK on the wall, not particles. Branches are
// polylines regenerated from the mark's seed every frame, which is what lets
// them flicker. See docs/rt-impact-fx.md.
// Self-contained: every rt_arc_* value is stated, plus rt_spark, so no arm
// can inherit another's leftovers from the ini (they are CVAR_ARCHIVE).
// Applied with +exec AFTER tools/d64rt-pins.cfg, so these win.
rt_arc 1
rt_arc_life 2.0
rt_arc_bright 3.0
rt_arc_max 160
rt_arc_burn 1
rt_arc_burn_life 0
rt_arc_burn_radius 0.50
rt_arc_burn_color 0A0807
rt_arc_burn_color_var 0.65
rt_arc_burn_mottle 0.7
rt_arc_burn_blobs 9
rt_arc_burn_strength 1.00
rt_arc_burn_dist 25
rt_arc_burn_max 96
rt_arc_branches 9
rt_arc_segments 5
rt_arc_reach 0.35
rt_arc_width 0.024
rt_arc_jitter 0.55
rt_arc_fork 0.55
rt_arc_flicker 1.0
rt_arc_flicker_rate 2.5
rt_arc_churn 24
rt_arc_wander 0.45
rt_arc_creep 16
rt_arc_creep_reach 2.4
rt_arc_glow 1
rt_arc_glow_max 10
rt_arc_glow_intensity 45
rt_arc_core 0.07
rt_arc_far 40
rt_arc_light 1
rt_arc_light_intensity 220
rt_arc_light_life 2.5
rt_arc_probe 1.6
rt_arc_probe_max 512
rt_arc_debug 0
rt_spark 0
rt_spark_surface_debug 0
