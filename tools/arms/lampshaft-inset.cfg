// ab lampshaft arm: lampshaft-inset -- CEILING INSET LAMPS ONLY.
//
// rt_volume_shaft_src 1. One light at a lamp sector's centre (rt_ceiling_lamps),
// the sparsest of the three families and the one whose geometry is most
// beam-shaped. Start family isolation here.
//
// THIS ARM TURNS THE FAMILY ON. rt_ceiling_lamps is pinned 0 in
// tools/d64rt-pins.cfg -- a centre sphere in a big hall reads as a floating blob,
// which is why the perimeter walk exists -- so in play this bit of
// rt_volume_shaft_src offers nothing at all. That is deliberate and is not the
// null result it looks like: check the console line before concluding the
// feature is broken.
//
// These BLINK, and are deliberately still uploaded while dark so ReSTIR/RR
// history is not cut (rt_ceiling_lamp_off). rt_volume_shaft_minint is what stops
// a beam hanging under a lamp that is currently off; if you see one pulsing out
// of phase with its fixture, that is the knob.
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_moon_presets 1
rt_flsh 0
rt_volume_type 1
rt_volume_far 60
rt_volume_scatter 1
rt_volume_ambient 0.2
rt_volume_lintensity 1
rt_volume_lassymetry 0.5
rt_volume_history 8
rt_volume_dither 5
rt_volume_dither_z 1
rt_volume_blur 1
rt_volume_occlude_emis 1
rt_ceiling_lamps 1
rt_ceiling_lamp_intensity 700
rt_ceiling_edge_lamps 1
rt_faux_lamps 1
rt_solo_lamps 1
rt_ceiling_bulb_gain 7
rt_ceiling_bulb_emis 20
rt_smoke 1
rt_volume_shafts 1
rt_volume_shaft_src 1
rt_volume_shaft_max 16
rt_volume_shaft_trace 3
rt_volume_shaft_mult 1
rt_volume_shaft_nearfade 1.5
rt_volume_shaft_mincontrib 0
rt_volume_shaft_asym -2
rt_volume_shaft_maxdist 1024
rt_volume_shaft_mingap 96
rt_volume_shaft_minint 0
rt_volume_shaft_debug 0
rt_volume_shaft_verbose 1
