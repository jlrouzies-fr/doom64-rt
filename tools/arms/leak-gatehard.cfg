// ab leak arm: leak-gatehard -- THE ABSURD ARM. Not shippable, and that is
// the point: run it to prove the gate is LIVE before trusting any subtle
// result from leak-gate.
//
// feather 0.01 is a hard binary cut instead of a ramp, and taps 1 reads only
// the centre of each froxel column instead of the max over its footprint. Both
// failure modes should be blatant:
//
//   - the froxel GRID painted onto surfaces, in blocks, because a binary cut
//     quantises to the cell;
//   - hard stair-stepped edges along every geometry silhouette, because the
//     centre tap kills cells that the rest of the column can still see past.
//
// If this looks identical to leak-gate, the cvars are not reaching the shader
// and no conclusion from the pair is worth anything. That is the same job
// lampshaft-fat and shaft-probe do for their features, and it is cheaper than
// a round trip.
//
// Same conditions as every leak-* arm: rt_cpu_cullmode 2 (play's setting, and
// no longer a variable -- geometry was measured out), moon OFF via rt_sun 0 +
// rt_sun_intensity 0 + rt_moon_presets 0 (load-bearing: RT_MoonApplyPresets
// rewrites rt_sun_intensity on every level load while presets are on), and
// rt_volume_shaft_mult 200 so anything left is unmissable.
//
// Read against tools/arms/leak-base.cfg, which is screen/shaft200.png. Stand in
// the same place, and press yourself against the wall -- that is where the
// artefact peaks, because a surface nearer than slice 0's centre (~0.47 m at
// rt_volume_far 60) collects slice 0 wholesale.
rt_sun 0
rt_sun_intensity 0
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_moon_presets 0
rt_flsh 0
rt_volume_type 1
rt_volume_far 60
rt_volume_scatter 1
rt_volume_ambient 0.2
rt_volume_lintensity 1
rt_volume_lassymetry 0.5
rt_volume_history 8
rt_volume_dither 5
rt_volume_dither_z 1
rt_volume_blur 1
rt_volume_occlude_emis 1
rt_ceiling_lamps 0
rt_ceiling_lamp_intensity 0
rt_ceiling_edge_lamps 1
rt_faux_lamps 1
rt_solo_lamps 1
rt_ceiling_bulb_gain 7
rt_ceiling_bulb_emis 20
rt_smoke 1
rt_volume_shafts 1
rt_volume_shaft_src 7
rt_volume_shaft_bands 4
rt_volume_shaft_max 32
rt_volume_shaft_trace 4
rt_volume_shaft_mult 200
rt_volume_shaft_nearfade 1.5
rt_volume_shaft_falloff 0.5
rt_volume_shaft_relcull 0.05
rt_volume_shaft_mincontrib 0
rt_volume_shaft_asym -2
rt_volume_shaft_maxdist 1920
rt_volume_shaft_mingap 96
rt_volume_shaft_minint 0
rt_volume_shaft_debug 0
rt_volume_shaft_verbose 0
rt_dust 1
rt_dust_density 0.10
rt_dust_max 900
rt_dust_far 12
rt_dust_near 0.5
rt_dust_size 0.008
rt_dust_size_ang 0.0022
rt_dust_color C8C8C8
rt_dust_albedo 0.9
rt_dust_drift 0.35
rt_dust_speed 0.25
rt_dust_cone -0.25
rt_dust_variance 0.75
rt_dust_size_var 0.6
