// ab arm: spriteao-on -- contact occlusion under sprites, at shipping strength.
//
//   .\tools\ab.cmd spriteao-off 02      run the control FIRST
//   .\tools\ab.cmd spriteao-on  02
//
// THE PROBLEM. rt_sprite_shadow gave sprites a cast shadow that survives the
// camera turning, and it is as good as a board can be -- but a board still has
// no thickness, so when a light lies IN the board's plane the shadow projects to
// a LINE and the actor casts nothing. And the classes where a vertical cross is
// the wrong shape entirely (corpses, gibs, dropped weapons) were deliberately
// left out of the proxies, so they have nothing under them at all.
//
// THE FIX, and why it is a second mechanism rather than more planes. A cast
// shadow answers "where is the light". Contact occlusion answers "is something
// touching this floor" -- and that has the SAME ANSWER FROM EVERY DIRECTION, so
// it is exactly the term that survives the case the cast shadow loses.
//
// Each thing with a floor under it gets a soft dark blob on that floor: an RTGL1
// DECAL, a triangle fan multiplied into the floor's albedo, alpha 0.45 at the
// centre falling to 0 at the rim. No texture -- the falloff is vertex colour.
//
// Darkening albedo rather than adding a black overlay is the load-bearing
// choice: the blob scales with the light already on that floor, so it is at full
// strength in a lit room and INVISIBLE in a dark one. An occlusion term should
// never be able to push a surface below unlit.
//
// WHAT TO CHECK:
//
//   1. A dropped shotgun / a corpse on a lit floor. It should stop floating.
//   2. An enemy with a lamp exactly to its side -- the proxy shadow is a line
//      here, and the blob is what is left.
//   3. Walk into a dark corner. The blob must DISAPPEAR, not turn into a black
//      disc. If a disc is visible in an unlit room the albedo multiply is not
//      what is happening and something is writing screen emission.
//   4. Step off a ledge next to a prop. The blob must stop at the edge rather
//      than smear down the drop -- the decal discards past 5 cm of surface
//      mismatch, and that is the mechanism doing it.
//   5. A lost soul or a cacodemon crossing the room, and the player jumping. No
//      disc should travel with them: rt_sprite_ao_fade takes it out over 56 map
//      units of height.
//   6. NOTHING IN A MIRROR OR IN WATER. The blob is rasterized into the G-buffer
//      and is never in the acceleration structure, so a reflection must show the
//      floor with no blob. That asymmetry is the known cost of the approach.
//
// If it reads as a painted sticker rather than as contact, the knob is
// rt_sprite_ao_strength (down), not rt_sprite_ao_radius.
rt_sprite_ao 1
rt_sprite_ao_strength 0.7
rt_sprite_ao_radius 1.6
rt_sprite_ao_upright 0.7
rt_sprite_ao_sizefall 0.6
rt_sprite_ao_shape 1
rt_sprite_ao_fit 1
rt_sprite_ao_aspect 0.4
rt_sprite_ao_fade 56
rt_sprite_ao_scope 0
rt_sprite_ao_segments 32
rt_sprite_ao_dist 30
rt_sprite_ao_debug 0
// shipping sprite shadows, unchanged across the pair
rt_sprite_shadow 1
rt_sprite_shadow_planes 4
rt_sprite_shadow_scope 1
rt_sprite_shadow_hidecaster 1
rt_sprite_shadow_width 1
rt_sprite_shadow_dist 40
rt_sun_split 1
rt_shadow_samples 1
rt_spp_direct 1
rt_upscale_dlss 2
rt_rayreconstr 0
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sky 25
rt_flsh 0
