// ab arm: sprshadow-off -- the CONTROL for sprshadow-on: stock billboards.
//
//   .\tools\ab.cmd sprshadow-off 02      run this first
//
// rt_sprite_shadow 0, identical in every other value, so the pair isolates one
// flag. A separate cfg rather than "just launch normally" because the sprite
// shadow cvars are CVAR_ARCHIVE: after one sprshadow-on run the ini holds 1, and
// an unarmed launch would be testing the feature while looking like a baseline.
//
// What to look at, so the comparison has a subject: stand so a light is exactly
// to the SIDE of an enemy. Here the shadow is a line or absent -- that is the
// billboard's plane projected edge-on, and it is the thing being fixed. Then
// turn on the spot and watch the shadow's shape follow the camera.
rt_sprite_shadow 0
rt_sprite_shadow_planes 4
rt_sprite_shadow_scope 1
rt_sprite_shadow_hidecaster 1
rt_sprite_shadow_width 1
rt_sprite_shadow_dist 40
// the moon fix from earlier, so sprite shadows are actually resolved outdoors
rt_sun_split 1
// stock quality -- this must stand on its own
rt_shadow_samples 1
rt_spp_direct 1
rt_upscale_dlss 2
rt_rayreconstr 0
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sky 25
rt_flsh 0
