// ab floor arm: floor-noflame
// MAP22 CASF109 -- the floor that reads bright while the pillars standing on it
// stay dark (screen/level22stillbad.png, coloredtexturelevel22yesOrno.png).
//
// The map data is already ruled out: sector 17 is lightlevel 220 against a 220
// threshold, m_sectorLightLevel feeds l_worldemissive and nothing else, and that
// returns 0 for ll <= minLight. CASF109's albedo is 25.4 mean luminance, DARKER
// than the walls around it (CASFL7 34.8, C2 41.9, C23 50.9), and its ORM is
// unremarkable (metallic 0, roughness 216). So the floor is receiving more light,
// not reflecting better -- these arms find out from WHAT.
//
// Run all of them from the same spot as the screenshot and compare:
//   .\tools\ab.cmd floor-base 22      then floor-noemis / -noflame / -nodyn / -nosky
// Whichever one makes the floor go dark owns the light. If NONE of them does, the
// light is indirect and the next arm to write is one that kills GI.
//
// rt_flame_light_on 0 -- kills the two 64BigFire at 387u and the five torches. These are the nearest real lights.
rt_mod_compat 1
rt_sky 25
rt_sector_emis 0.35
rt_sector_emis_minlight 160
rt_sector_emis_margin 40
rt_sector_emis_debug 1
rt_emis_mapboost 200
rt_emis_maxscrcolor 3
rt_sector_lights 0
rt_dynlight 1
rt_ceiling_lamps 0
rt_hang_lamps 1
rt_wall_strips 1
rt_ceiling_edge_lamps 1
rt_spin_panels 1
rt_solo_lamps 1
rt_flame_light_on 0
rt_flsh 0
rt_gunglow 1
rt_mzlflsh 1
rt_tex_probe
