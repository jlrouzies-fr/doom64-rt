// ab arm: sprshadow-on -- crossed shadow proxies for sprites.
//
//   .\tools\ab.cmd sprshadow-off 02      run the control FIRST
//   .\tools\ab.cmd sprshadow-on  02
//
// THE PROBLEM. A sprite is a camera-facing quad with no thickness, so its shadow
// is the projection of a plane. Two consequences, both visible in play:
//
//   1. A light lying IN the billboard's plane -- e.g. exactly from your left
//      while you look straight at an enemy -- projects the quad to a LINE. The
//      actor casts nothing and reads as pasted onto the floor.
//   2. The quad turns to face you, so the shadow's SHAPE changes as you rotate
//      on the spot. Nothing physical does that.
//
// THE FIX. Each visible actor also submits crossed quads at FIXED WORLD angles,
// flagged RG_MESH_PRIMITIVE_SHADOW_ONLY -- in the acceleration structure, and
// invisible to every ray except a shadow ray. At 90 degrees apart no light
// direction is degenerate: as one plane goes edge-on the other is face-on. Being
// world-fixed, the shadow also stops moving when you do.
//
// The alpha test rides along, so the shadow is the sprite's SILHOUETTE, not a
// rectangle. rt_sprite_shadow_hidecaster 1 stops the visible billboard casting,
// or the umbra would be the union of all three quads.
//
// WHAT TO CHECK:
//
//   1. Stand so a lamp is exactly to the SIDE of an enemy and compare. This is
//      the case that had no shadow at all.
//   2. Turn on the spot with an enemy lit from one side. The shadow should keep
//      its shape now.
//   3. NOTHING NEW IS VISIBLE. The proxies must never be seen directly, in a
//      mirror, in water, or as a brightening from indirect light. If a faint
//      cross ever appears around an actor, the instance mask is wrong -- and
//      that is the one failure this design can have.
//   4. Spectres and fire sprites are UNCHANGED (translucent, so skipped -- they
//      are rasterized and cast nothing today either way).
//   5. Frame cost with a crowd, on MAP02 rather than the title screen.
//
// Judge (1) and (2) with the moon as well: .\tools\ab.cmd sprshadow-on menu
rt_sprite_shadow 1
rt_sprite_shadow_planes 4
rt_sprite_shadow_scope 1
rt_sprite_shadow_hidecaster 1
rt_sprite_shadow_width 1
rt_sprite_shadow_dist 40
// the moon fix from earlier, so sprite shadows are actually resolved outdoors
rt_sun_split 1
// stock quality -- this must stand on its own
rt_shadow_samples 1
rt_spp_direct 1
rt_upscale_dlss 2
rt_rayreconstr 0
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sky 25
rt_flsh 0
