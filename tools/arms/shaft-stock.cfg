// ab shaft arm: shaft-stock -- REPRODUCES THE BUG, on the fixed build.
//
// rt_volume_dither_z 5, which is what the depth axis was before it had a cvar:
// CmScatterAccum.comp passed one radius for all three components, so
// rt_volume_dither 5 drove depth as well as screen.
//
// The report this family exists for: screen/shaftsStoppingTooEarly.png, MAP13's
// west hall. The moonlight cone from the F_SKY1 window slots fades out in mid-air
// and never reaches the floor it is plainly lighting further along the beam --
// "not reaching enough towards the end", and pulled back toward the window.
//
// The mechanism, and why this arm is the whole demonstration. The per-pixel
// volume jitter is drawn from a HEMISPHERE and negated, so its depth component
// is always <= 0: the sample is never taken deeper than the surface, only
// shallower. g_volumetric is a PREFIX SUM from the camera outward
// (CmVolumetricProcess.comp), so a consistently shallower sample returns
// consistently less accumulated in-scattering. It does not blur the far end of a
// column -- it deletes it.
//
//   mean shortfall = E[rnd01] * radius * E[sqrt(1-u)] * (far / 64)
//                  = 0.5 * 5 * 0.667 * 0.94 m
//                  = 1.56 m,  worst case 4.69 m
//
// Stock RTGL1 is dither 2 at far 30 -> 0.47 m slices -> 0.31 m. The shipping
// pins were FIVE TIMES that, because rt_volume_dither 5 and rt_volume_far 60
// multiply -- the same compounding moon-sharp.cfg records for the smear, here
// acting on the mean instead. 1.5-4.7 m of missing beam is the size of the gap
// in the screenshot.
//
// VIEW IT THE WAY THE MOON ARMS ARE VIEWED: twice, once across the shaft and
// once along it. Across is where the reach is legible; along, the phase
// function's ~11x forward bias carries the beam whatever this does.
//
// The screen axes are NOT at fault and this arm does not move them: x and y are
// r*cos(phi) and r*sin(phi), symmetric about zero, so they blur the shaft's edge
// without displacing it.
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_moon_presets 1
rt_flsh 0
rt_volume_type 1
rt_volume_far 60
rt_volume_scatter 1
rt_volume_ambient 0.2
rt_volume_lintensity 1
rt_volume_lassymetry 0.5
rt_volume_history 8
rt_volume_dither 5
rt_volume_dither_z 5
rt_volume_blur 1
rt_volume_occlude_emis 1
rt_ceiling_bulb_gain 7
rt_ceiling_bulb_emis 20
rt_smoke 1
