// ab arm: lowblend -- rt_smoke_illum_blend 0.08 instead of 0.2.
//
// This is what the reprojected history was FOR. The blend had to stay high
// because the history was read at the same cell index every frame, and the grid
// is camera-attached, so it was wrong the moment you moved -- averaging over
// more frames would only have smeared wrong data. Now the cell's world position
// is projected into the previous frame's volume, so more averaging is honest
// averaging: 0.08 is ~12 frames against 0.2's ~5.
//
// The cost is response time on a 2-3 frame muzzle flash. Judge it by firing
// while moving, which is the case the whole change is about.
rt_fog 0
rt_fog_presets 0
rt_volume_type 1
rt_volume_blur 1
rt_smoke 1
rt_smoke_density 6
rt_smoke_color 9E9689
rt_smoke_count 3
