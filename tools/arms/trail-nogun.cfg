// ab arm: trail-nogun
// THE FLOOR: no weapon sprite drawn at all, fixes off. What a frame with no gun scores; a finished fix should land here.
//
// THE REPRO (MAP94, tools/trail-lab.ps1): a pure dark room, one flat wall 4 m
// ahead, no lights at all. Hold the trigger on the super shotgun. The muzzle
// flash lights its own smoke; the reload animation swings the sprite through
// that lit smoke.
//
// Self-contained: every relevant cvar stated, because the archived ones would
// otherwise inherit whatever the last arm left in the ini, and the three fix
// cvars are NOARCH so an arm that does not state them gets the pins' values.
rt_volume_fp 0
rt_volume_reproj 0
rt_volume_taccum 0
rt_volume_spriteshadow 1
rt_volume_history 8

// --- the medium: the weapon's own smoke --------------------------------
rt_smoke 1
rt_smoke_perweapon 0
rt_smoke_density 14
rt_smoke_radius 0.5
rt_smoke_growth 0.5
rt_smoke_life 3.0
rt_smoke_budget 128
rt_smoke_illum 1
rt_smoke_trail 1
rt_smoke_debug 0

// Map fog OFF: rt_fog_color is pinned 000000 (a black medium scatters
// nothing) and rt_fog_presets keys on a table MAP94 is not in.
rt_fog 0
rt_fog_presets 0
rt_flsh 0

// --- held fixed --------------------------------------------------------
rt_volume_type 1
rt_volume_edgesoft 2
rt_volume_edgesoft_edge 0.05
rt_volume_ubias 0
rt_volume_ubias_debug 0
rt_volume_postcomp 0
rt_volume_dither 5
rt_volume_dither_z 1
rt_volume_blur 1
rt_volume_depthgate 1
r_drawplayersprites 0
