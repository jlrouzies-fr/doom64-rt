// ab arm: spriteao-disc -- contact occlusion with the OLD circular footprint.
//
//   .\tools\ab.cmd spriteao-disc 02      round blob, every class
//   .\tools\ab.cmd spriteao-on   02      what ships: fitted to the sprite
//
// The pair that answers ONE question: should the footprint be fitted to the art?
//
// rt_sprite_ao_shape 0 is a circle at the collision radius for everything. It is
// camera-independent and it is honest for a STANDING body, whose footprint really
// is roughly round. It is wrong for a shotgun lying on the floor: a long thin
// object gets a disc the size of its pickup radius, which reads as a stain rather
// than as the object's own shadow.
//
// Shape 1 (spriteao-on) keeps the circle for upright things and fits an ellipse
// to the sprite quad's real horizontal extent for things lying down.
//
// WHAT TO LOOK AT. A dropped shotgun or a corpse, and then WALK A CIRCLE AROUND
// IT. The trade is deliberate and this is where you judge it:
//
//   disc  -- the blob never changes as you move. Also never resembles the object.
//   on    -- the blob is the length of the barrel, and it TURNS as you circle,
//            because the billboard it is measured from turns. That is the same
//            camera-dependence rt_sprite_shadow was built to REMOVE from cast
//            shadows -- correct there, and arguably correct here for the opposite
//            reason: a cast shadow's shape must not follow the viewer, but a
//            footprint traced from the drawn object should track what is drawn.
//
// If the swing reads worse than the disc did, rt_sprite_ao_shape 0 is the answer
// and it is a one-line pin change, not a rebuild.
//
// A third position exists if the ellipse is right but too eager: leave shape 1 and
// raise rt_sprite_ao_aspect toward 1, which rounds the ellipse out and shrinks the
// swing without giving up the fit.
rt_sprite_ao 1
rt_sprite_ao_strength 0.7
rt_sprite_ao_radius 1.6
rt_sprite_ao_shape 0
rt_sprite_ao_fit 1
rt_sprite_ao_aspect 0.4
rt_sprite_ao_fade 56
rt_sprite_ao_scope 0
rt_sprite_ao_segments 14
rt_sprite_ao_dist 30
rt_sprite_ao_debug 0
rt_sprite_shadow 1
rt_sprite_shadow_planes 4
rt_sprite_shadow_scope 1
rt_sprite_shadow_hidecaster 1
rt_sprite_shadow_width 1
rt_sprite_shadow_dist 40
rt_sun_split 1
rt_shadow_samples 1
rt_spp_direct 1
rt_upscale_dlss 2
rt_rayreconstr 0
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sky 25
rt_flsh 0
