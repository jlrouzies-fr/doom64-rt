// ab firesky arm: firesky-loud -- was the absurd arm. IT IS NOW THE ANSWER.
//
// rt_sky 400, run on MAP23 on 2026-08-23, and it looked RIGHT rather than
// blown out. So 400 became MAP23/32's shipping value and the orange maps were
// scaled to 175 from it. This arm is left at 400 and is therefore identical to
// shipping on the green maps and 2.3x shipping on the orange ones -- keep it
// for the orange overshoot and as the record of the launch that settled this.
//
// The reasoning below is what it was run to decide, kept because the outcome is
// only meaningful next to the alternatives it ruled out. Its "before" is now
// tools/arms/firesky-before.cfg.
//
// It was 333x the old shipping 1.2 and 16x the pinned global 25. Nothing else
// differs from firesky-base.
//
// WHY SO FAR PAST REASONABLE. "The fire sky emits no light" has two causes that
// look identical in a screenshot -- too dim to see, and never reached the
// shader -- and only a value far past visible separates them. This is
// lampshaft-fat's job, for the sky.
//
// WHAT IT DECIDES (docs/plan-fire-skies.md section 2):
//
//   open areas light, corridors stay dark
//       The multiplier is roughly right and the GEOMETRY is the problem: 60% of
//       the art's luminance is in its bottom quarter, i.e. at and below the
//       horizon, which is the one part of the sky a Doom wall blocks. A
//       horizon band cannot get into a room through a ceiling opening however
//       bright it is. -> section 4, the analytic fire ring.
//
//   nothing lights anywhere
//       The sky term is not reaching lighting on these maps at all. That is a
//       plumbing bug and every idea in the doc is premature. Bisect with
//       rt_debug_show before theorising.
//
//   everything lights and it looks BAD -- noisy, flat, washed
//       The variance argument holds: getSkyAlbedo is reached on ray miss only
//       (RaygenCommon.h) and the environment is not importance-sampled, so a
//       band near the horizon is a small source in solid-angle terms. Raising
//       the multiplier cannot fix that. -> section 4 again.
//
// Take the same two views as firesky-base: one open and sky-ceilinged, one in a
// corridor with a sky slot. The difference between those two views IS the
// measurement -- a single screenshot cannot tell these outcomes apart.
rt_moon_presets 0
rt_sun 0
rt_sun_intensity 0
rt_moon_geo 0
rt_clouds 0
rt_clouds_presets 0
rt_sky 400
rt_sky_saturation 1
rt_sky_stretch 1.2
rt_sky_always true
