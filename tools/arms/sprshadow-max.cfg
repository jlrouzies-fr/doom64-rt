// ab arm: sprshadow-max -- is the missing wall shadow a LIGHT-SELECTION problem?
//
//   .\tools\ab.cmd sprshadow-max 02
//
// Same viewpoint as sprshadow-probe: light right of the sprite, wall left of it,
// shadow on the floor but not on the wall.
//
// THE THEORY. rt_sun_split took the MOON out of ReSTIR's per-pixel light draw.
// Every ordinary lamp still competes: one light wins per pixel, so that lamp's
// shadow is only resolved where the lamp wins. On the floor right next to the
// sprite the lamp dominates and wins nearly always -- shadow appears. On a wall
// further away that several lights reach, it wins on a fraction of pixels, and a
// sparse shadow is what the denoiser flattens. Floor yes, wall no, with no
// geometry involved at all.
//
// This arm brute-forces that: 4 independent direct estimates per pixel, each
// drawing its own light, so a given lamp is sampled far more often; and 8
// visibility rays on whichever light was chosen, so the shadow it does find is a
// soft fraction rather than a 0/1 coin flip.
//
//   wall shadow appears  -> confirmed. The proxies were always occluding and the
//     estimator was losing it. The fix is NOT more planes; it is either these
//     sample counts (expensive, global) or extending the rt_sun_split treatment
//     to the dominant local light per pixel (cheaper, and a real design job).
//
//   wall shadow still absent -> selection is exonerated and the cause is
//     geometric after all. sprshadow-probe says which.
//
// Not a shipping configuration: rt_spp_direct 4 multiplies rays for every light
// in the level to repair one shadow.
rt_shadow_samples 8
rt_spp_direct 4
rt_restir_initial 16
rt_sprite_shadow 1
rt_sprite_shadow_planes 4
rt_sprite_shadow_scope 1
rt_sprite_shadow_hidecaster 1
rt_sprite_shadow_width 1
rt_sprite_shadow_dist 40
rt_sun_split 1
rt_upscale_dlss 2
rt_rayreconstr 0
rt_debug_visibility 0
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sky 25
rt_flsh 0
