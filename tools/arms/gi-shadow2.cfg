// ab arm: gi-shadow2 -- GI bounce ladder (docs/rt-gi-bounces.md)
//
//   .\tools\ab.cmd gi-shadow2 03
//
// STAGE 0 -- no shader change involved. rt_shadowrays is not a bounce count:
// it is which bounce VERTICES may sample analytic lights at all
// (RaygenCommon.h isDirectIlluminationValid). The live ini holds 2, so bounce
// vertex 2 samples NO lights today -- it returns emissives and sky only.
//
//   gi-shadow2  today's live value, the BEFORE
//   gi-shadow3  vertex 2 gains analytic lights + one shadow ray
//   gi-shadow4  THE CONTROL: only bounce indices 0/1/2 exist, so 4 MUST be
//               pixel-identical to 3. If it is not, the ladder is not reaching
//               the shader and nothing else in it can be believed.
//
// CONFOUND: shadow3 lights vertex 2 for the first time, and vertex 2 carries
// the stock ~2pi overweight (rt_gi_bounce_legacy). It may read as too bright
// or too red rather than as "more bounce". That is the energy bug becoming
// visible, not evidence against lighting vertex 2 -- judge WHERE light now
// reaches, not how much. gi-fix is the arm for how much.
//
// Judge on the UNFILTERED signal first: rt_debug_show 16 (raw indirect) and
// 128 (only indirect diffuse). Exposure is pinned below so you are judging GI,
// not eye adaptation. Every value here is the live ini value except the one
// this arm exists to move.
rt_shadowrays 2
rt_gi_bounces 2
rt_gi_bounce_legacy 1
rt_gi_bounce_shadows 1
rt_spp_indirect 3
rt_spp_direct 1
rt_shadow_samples 1
rt_restir_initial 32
rt_restir_spatial 8
rt_restir_mcap 20
rt_reflrefr_depth 2
rt_tnmp_ev100_min 2
rt_tnmp_ev100_max 7.7
rt_debug_show 0
rt_debug_restir_m 0
rt_debug_visibility 0
rt_upscale_dlss 2
rt_rayreconstr 0
