// ab cull arm: cull-dyn -- cull-black plus ONE source: the map's own lights.
//
// rt_dynlight 1 and nothing else. In MAP02 that is 83 things: 48 x 9800
// PointLight and 35 x 9802 PointLightFlicker, placed by the mapper. Everything
// else stays off exactly as in cull-black.
//
// Same two steps as cull-emis: turn on the spot, then
//
//   .\tools\ab.cmd cull-dyn 02 -- +rt_cpu_nocullradius 40
//
// These are ANALYTIC lights with a real position and a shadow ray, so the
// failure looks different from the emissive one: a light in the next room is
// sampled, its shadow ray finds no wall because the wall was not uploaded, and
// the surface is scored lit. The giveaway is a wash with a DIRECTION -- it
// points at where the neighbouring fixture is -- rather than a general lift.
//
// Do not change rt_dynlight_intensity to calm what you find here. It is global
// to every FDynamicLight in the game (AGENTS.md pitfall 28c): dialling it for
// one room dimmed the key-door lights and every other 9800 with it.
rt_cpu_cullmode 0
rt_cpu_nocullradius 10
rt_sun 0
rt_sky 0
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky_always 1
rt_sky_nowalls 0
// THE ONE SOURCE UNDER TEST
rt_dynlight 1
rt_dynlight_flicker 1
// everything else as cull-black
rt_sector_emis 0
rt_emis_mapboost 0
rt_sector_lights 0
rt_ceiling_lamps 0
rt_ceiling_edge_lamps 0
rt_wall_strips 0
rt_hang_lamps 0
rt_solo_lamps 0
rt_spin_panels 0
rt_switch_lights 0
rt_flame_light_on 0
rt_lava_light_on 0
rt_flsh 0
rt_gunglow 0
rt_mzlflsh 0
