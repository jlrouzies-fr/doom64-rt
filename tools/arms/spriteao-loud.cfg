// ab arm: spriteao-loud -- contact occlusion turned up until it is unmissable.
//
//   .\tools\ab.cmd spriteao-loud 02
//
// NOT A SHIPPING CONFIGURATION. This exists for one reason: the shipping values
// are deliberately subtle, and "I cannot see any difference" is ambiguous between
// "it is working and it is subtle" and "it is not running at all". This arm
// removes that ambiguity -- at 0.9 strength and 2.5x radius the blob is a black
// disc and there is no way to miss it.
//
// So run this FIRST when something looks wrong, before tuning anything. If the
// disc is absent here, the feature is not reaching the floor and no amount of
// strength will help: look at the height fade (is the thing actually standing on
// its floorz?), the distance cap, or the decal's 5 cm surface test.
//
// Once it is confirmed present, go back to spriteao-on and judge it there.
// Judging strength on this arm is how a feature ends up shipping as a sticker.
rt_sprite_ao 1
rt_sprite_ao_strength 0.9
rt_sprite_ao_radius 2.5
rt_sprite_ao_shape 1
rt_sprite_ao_fit 1
rt_sprite_ao_aspect 0.4
rt_sprite_ao_fade 56
rt_sprite_ao_scope 0
rt_sprite_ao_segments 24
rt_sprite_ao_dist 40
// Console proof, because "I see nothing" is ambiguous: this prints how many
// blobs were UPLOADED every 60 draws, plus the nearest one's world position.
// emitted>0 with a clean screen means the blob is being discarded by the decal's
// 5 cm surface test -- a POSITION bug -- not that the feature is off.
rt_sprite_ao_debug 1
rt_sprite_shadow 1
rt_sprite_shadow_planes 4
rt_sprite_shadow_scope 1
rt_sprite_shadow_hidecaster 1
rt_sprite_shadow_width 1
rt_sprite_shadow_dist 40
rt_sun_split 1
rt_shadow_samples 1
rt_spp_direct 1
rt_upscale_dlss 2
rt_rayreconstr 0
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sky 25
rt_flsh 0
