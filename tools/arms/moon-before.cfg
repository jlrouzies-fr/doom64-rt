// ab moon arm: moon-before -- REPRODUCE THE REPORT on the fixed build.
//
// rt_volume_scatter 0.5 at rt_volume_far 60. With the per-metre normalisation in
// rt_main.cpp that uploads a density of 1.0, which is EXACTLY what the game sent
// between commit 11417f2 and the fix -- i.e. this arm is the weak-shaft build,
// bit for bit, and nothing else about it differs from moon-now.
//
// So the pair is the whole diagnosis on screen:
//
//     .\tools\ab.cmd moon-before 01     the shafts as reported
//     .\tools\ab.cmd moon-now    01     the shafts as they were before the smoke work
//
// If those two look the same, the density is NOT the cause and the arithmetic in
// rt_main.cpp is not reaching the shader -- check rt_volume_scatter and
// rt_volume_far in the console before believing any of the other arms, because
// a launcher passthrough that never arrived looks exactly like a null result
// here.
//
// Keeping this arm after the fix ships is deliberate: it is the only way to see
// the regression again without reverting a commit, and it is the arm to reach
// for if someone reports the opposite complaint -- too much haze.
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_moon_presets 1
rt_flsh 0
rt_volume_type 1
rt_volume_far 60
rt_volume_scatter 0.5
rt_volume_ambient 0.2
rt_volume_lintensity 1
rt_volume_lassymetry 0.5
rt_volume_history 8
rt_volume_dither 5
rt_volume_blur 1
rt_volume_occlude_emis 1
rt_ceiling_bulb_gain 7
rt_ceiling_bulb_emis 20
rt_smoke 1
