// ab cull arm: cull-emis -- cull-black plus ONE source: painted brightness.
//
// rt_sector_emis 0.35 (the play value) and nothing else. In MAP02 that lights
// 153 sectors at lightlevel >= 160, 74 of them >= 220 -- including the bright
// ceiling recesses that read as lamps. Everything else stays off exactly as in
// cull-black, which is verified to give a black room.
//
// WHAT TO LOOK FOR, and it is not "is it lit":
//
//   1. Stand where the leak was and TURN ON THE SPOT. If the wash appears and
//      disappears with your heading, this is the source riding through the
//      missing wall.
//   2. Then widen the guaranteed shell without editing anything:
//
//        .\tools\ab.cmd cull-emis 02 -- +rt_cpu_nocullradius 40
//
//      If the wash stops moving, geometry culling is confirmed as the carrier
//      and the radius is the fix. If it moves exactly as before, the culling is
//      innocent for this source and the answer is somewhere else entirely.
//
// A self-emitting SURFACE is the most likely thing to leak this way, because it
// is not a light with a position that can be occlusion-tested -- it is emission
// gathered by whatever ray happens to land on it. A ray that passes through a
// wall that was never uploaded lands on the bright sector behind it.
rt_cpu_cullmode 0
rt_cpu_nocullradius 10
rt_sun 0
rt_sky 0
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky_always 1
rt_sky_nowalls 0
// THE ONE SOURCE UNDER TEST
rt_sector_emis 0.35
rt_sector_emis_minlight 160
rt_emis_mapboost 200
rt_emis_maxscrcolor 3
// everything else as cull-black
rt_dynlight 0
rt_sector_lights 0
rt_ceiling_lamps 0
rt_ceiling_edge_lamps 0
rt_wall_strips 0
rt_hang_lamps 0
rt_solo_lamps 0
rt_spin_panels 0
rt_switch_lights 0
rt_flame_light_on 0
rt_lava_light_on 0
rt_flsh 0
rt_gunglow 0
rt_mzlflsh 0
