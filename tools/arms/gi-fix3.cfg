// ab arm: gi-fix3 -- GI bounce ladder (docs/rt-gi-bounces.md)
//
//   .\tools\ab.cmd gi-fix3 03
//
// REAL DEPTH -- only meaningful with rt_gi_bounce_legacy 0: with the legacy
// weight every extra bounce multiplies by ~6.3 and depth 3 simply blows out.
// rt_gi_bounce_shadows 1 floors the shadow-ray depth to depth+1 per frame so
// the new vertex is actually lit (rt_shadowrays itself is never written).
//
// Against gi-fix (depth 2). Bias check: mean luminance of rt_debug_show 128
// must rise MONOTONICALLY WITH SHRINKING INCREMENTS from depth 2 -> 3 -> 4
// (1 + a + a^2 + a^3, a ~ 0.2-0.4). Depth 3 adding as much as depth 2 did =
// throughput is not accumulating; super-linear or fireflies = the pi/cos is
// still in the loop; depth 3 adding nothing = the shadow floor is not firing.
//
// Cost: vid_fps here AND in a stripe-bulb room -- with no light grid every
// bounce vertex runs a full RIS pass, so cost scales with the map's light
// count and one map's number does not generalise.
//
// Judge on the UNFILTERED signal first: rt_debug_show 16 (raw indirect) and
// 128 (only indirect diffuse). Exposure is pinned below so you are judging GI,
// not eye adaptation. Every value here is the live ini value except the one
// this arm exists to move.
rt_shadowrays 3
rt_gi_bounces 3
rt_gi_bounce_legacy 0
rt_gi_bounce_shadows 1
rt_spp_indirect 3
rt_spp_direct 1
rt_shadow_samples 1
rt_restir_initial 32
rt_restir_spatial 8
rt_restir_mcap 20
rt_reflrefr_depth 2
rt_tnmp_ev100_min 2
rt_tnmp_ev100_max 7.7
rt_debug_show 0
rt_debug_restir_m 0
rt_debug_visibility 0
rt_upscale_dlss 2
rt_rayreconstr 0
