// ab arm: spark-glowmax
// Four times the glow budget and twice the intensity. NOT a shipping
// candidate -- it is the cost probe. Fire a super-shotgun into a corner
// with a frame time on screen and watch what 32 moving lights costs before
// arguing for a higher rt_spark_glow_max.
//
// Self-contained: every rt_spark_* value is stated, so no arm can inherit
// another's leftovers from the ini (they are CVAR_ARCHIVE).
// Applied with +exec AFTER tools/d64rt-pins.cfg, so these win.
rt_spark 1
rt_spark_count 8
rt_spark_life 5.0
rt_spark_speed 6.0
rt_spark_spread 38
rt_spark_gravity 11
rt_spark_drag 1.6
rt_spark_size 0.02
rt_spark_grid 0.03125
rt_spark_bright 2.0
rt_spark_max 2000
rt_spark_far 40
rt_spark_style 1
rt_spark_streak 2.5
rt_spark_collide 1
rt_spark_bounce 0.38
rt_spark_friction 0.28
rt_spark_rest 0.55
rt_spark_trace_max 24
rt_spark_debris 1
