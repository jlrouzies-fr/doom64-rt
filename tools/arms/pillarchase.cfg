// ab arm: pillarchase -- the turning light back on the pillar, at the pins'
// own values. One crest, 1.83s per lap (script 12's 64 tics), clockwise, which
// is the direction the original tags ran in.
//
//   .\tools\ab.cmd pillarchase 01
//
// Judge this IN MOTION. A still frame cannot tell a chase from four lamps at
// four different brightnesses -- see the stills-cannot-measure-temporal-noise
// lesson; the same trap applies to anything that only exists over time.
rt_pillar_chase 1
rt_pillar_chase_period 1.83
rt_pillar_chase_floor 0.35
rt_pillar_chase_width 140
rt_pillar_chase_cw 1
rt_pillar_chase_debug 0
rt_wall_strips 1
rt_wall_strip_intensity 180
rt_wall_strip_minlight 120
rt_wall_strip_seglen 64
rt_wall_strip_radius 0.35
