// ab cull arm: cull-stock -- THE BASELINE, i.e. what you are playing now.
//
// THE SYMPTOM THIS IS FOR: light leaks into a room, and the leak CHANGES AS YOU
// TURN -- "like a wall behind me gets culled". It literally does.
//
// This is NOT the sky leak, and rt_sun_require_sky cannot fix it. That fix is
// about a shadow ray that reaches no geometry because the MAP has no geometry
// there (docs/moon-and-sky-leaks.md). This is a shadow ray that reaches no
// geometry because the ENGINE DID NOT UPLOAD IT THIS FRAME. The wall exists in
// the map and is missing from the acceleration structure.
//
// WHERE IT COMES FROM. gzdoom feeds RTGL1 from the same BSP walk it uses to
// rasterize, so the ray tracer only knows about geometry that walk submitted.
// hw_bsp.cpp reinstates the culled geometry with a SECOND, unculled walk whose
// breadth is rt_cpu_cullmode:
//
//   0  (default)  visible sectors + every NEIGHBOUR of a visible sector,
//                 plus everything within rt_cpu_nocullradius metres
//   1             original GZDoom culling -- visible only. The leakiest.
//   2             upload the whole map, no culling at all
//
// So at the default a wall is absent when it is all three of: not visible, not
// adjacent to anything visible, and more than rt_cpu_nocullradius (10 m = 320
// map units) away. Turn on the spot and the visible set changes, so the set of
// absent walls changes, so the leak breathes with the camera. That is the
// signature, and it is the one thing the sky-leak fix cannot produce -- sky
// geometry is submitted unconditionally (rt_sky_always).
//
// WHAT LEAKS THROUGH THE HOLE. Everything except the moon, which is why
// rt_sun_require_sky 1 does not help: it gates the DIRECTIONAL light only, and
// a ray escaping through a missing wall hits no sky either, so the moon is
// already rejected. What still arrives is the room next door's own lamps, the
// sky DOME on ray miss (a separate leak by construction -- moon-and-sky-leaks
// §5), and indirect bounce. In the reported shot the ceiling lamps are the
// suspects.
//
// Run this first, from the exact spot in the screenshot, and turn on the spot.
// Then cull-wide and cull-all. If the leak survives cull-all, the geometry was
// never the cause and this whole line of enquiry is finished in three runs.
//
// CEILING AND STRIP LAMPS ARE OFF IN ALL FOUR CULL ARMS. They are the engine's
// own inferred fixtures (rt_lights_fixtures.cpp) -- analytic lights placed from
// a TEXTURE rather than from a map thing -- so they are both the brightest
// suspects for something washing through a hole and the easiest to mistake FOR
// the hole. With them off, whatever wash remains is coming from lights the map
// actually places.
//
// THIS MEANS cull-stock IS NO LONGER "what you play". It is the play config
// minus those two families, which is the right baseline for the other three
// arms to be compared against but the wrong one for judging how the room
// LOOKS. Put them back for one run without editing anything:
//
//   .\tools\ab.cmd cull-stock 02 -- +rt_ceiling_lamps 1 +rt_ceiling_edge_lamps 1 +rt_wall_strips 1
//
// BOTH ceiling cvars are needed. rt_ceiling_edge_lamps is a SEPARATE path that
// rings the perimeter of a lamp ceiling with bulbs, and it is "independent of
// rt_ceiling_lamps" on purpose -- zeroing only the centre-sphere one leaves
// every big hall's edge bulbs still casting, which reads as "disabling the
// lamps did nothing".
rt_cpu_cullmode 0
rt_cpu_nocullradius 10
rt_sun 1
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_sky_always 1
rt_sky_nowalls 0
rt_flsh 0
// the two families under test, off
rt_ceiling_lamps 0
rt_ceiling_edge_lamps 0
rt_wall_strips 0
// the rest of the inferred-fixture family, stated because these are
// CVAR_ARCHIVE and another arm (e.g. floor-*) may have left them at 0
rt_hang_lamps 1
rt_solo_lamps 1
rt_spin_panels 1
rt_dynlight 1
rt_flame_light_on 1
