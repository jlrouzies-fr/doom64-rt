// ab arm: rr-preexp-on -- THE AFTER. DLSS-RR fed PRE-exposure radiance:
// CmPrepareFinal skips the EV100 multiply + screen-emissive add, and a new
// pass (CmRrPostExposure) reapplies both AFTER the upscaler. NVIDIA's RR guide
// (S3.7) declares exposure unsupported for RR; before this, RR denoised
// post-exposure color while told InPreExposure=1.0, so its temporal history
// mixed frames captured at different exposures whenever adaptation moved.
//
// WHAT TO JUDGE: motion stability, in play, not stills. The prediction is
// specific -- if exposure was the cause, instability correlates with
// auto-exposure ADAPTING (walk from a bright area into a dark one and back),
// not with camera motion as such. Compare against rr-preexp-off.
//
// READ THE ARM BACK before trusting anything: rt-console.log must print
//   Denoiser path: DLSS-RR (...) preExposure=on (post-RR pass)
// and run rr-preexp-probe FIRST if there is any doubt the pass is live.
//
// Self-contained: rt_rayreconstr is pinned 0 in d64rt-pins.cfg, the upscaler
// cvars are CVAR_ARCHIVE, and both arms state every RR-relevant value so
// neither inherits state (the ab-cvars-must-not-persist rule).
rt_upscale_dlss 2
rt_upscale_fsr2 0
rt_rayreconstr 1
rt_framegen 0
rt_sharpen 0
rt_dlss_preset 5
rt_rr_preset 5
rt_nrd 0
rt_nrd_validation 0
// THE ONE MOVED VALUE
rt_rr_preexposure 1
rt_rr_preexp_debug 0
// Contract-redo features pinned OFF in BOTH preexp arms so this pair still
// moves ONE value (the reorder alone). The full contract is rr-full.
rt_rr_exptex 0
rt_rr_translayer 0
rt_rr_glowpre 0
rt_rr_restir_mcap -1
// rt_rr_* held at shipping values so pre-exposure moves ONE thing.
rt_rr_temporal 0
rt_rr_disocc 1
rt_rr_disocc_ratio 3.0
rt_rr_disocc_mindelta 0.01
rt_rr_disocc_show 0
rt_rr_firefly 0
rt_rr_firefly_minlum 0.01
rt_rr_spechitdist 1
rt_rr_guide_mode 1
rt_rr_guide_min 0.01
rt_rr_reset_on_lightcut 1
rt_rr_reset_on_dynlight 1
rt_rr_reset_delta 0.5
rt_rr_reset_min_ms 250
rt_rr_reset_hold 0
rt_rr_reset_now 0
rt_rr_reset_debug 0
// Signal quality upstream of RR, held at shipping values -- state every one
// (a "tested" knob was once stuck at an A/B value for days).
rt_restir_bluenoise 1
rt_restir_tjitter 2.0
rt_restir_indir_antilag 1
rt_restir_initial 32
rt_restir_spatial 8
rt_restir_spatial_radius 30
rt_restir_mcap 20
rt_shadow_samples 1
rt_spp_direct 1
rt_spp_indirect 1
rt_mip_bias 0
// Auto-exposure must RUN for this A/B to mean anything -- stock range. If
// these were narrowed, both arms would look identical and prove nothing.
rt_tnmp_ev100_min 2.0
rt_tnmp_ev100_max 7.7


