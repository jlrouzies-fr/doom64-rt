// ab arm: spark-debrisdark
// THE ABSURD ARM for the whiteout, and it answers a question no amount of
// tuning can. Albedo 0.02 with no texture tint: a surface reflecting 2%
// of what hits it CANNOT read as white under any light, so --
//
//   chips go near-black -> the albedo reaches the material correctly and
//     the whiteout is irradiance saturation. A flashlight at 1 m is
//     enormously bright; the answer is exposure-side, not here.
//   chips STAY WHITE     -> the vertex colour is not becoming the albedo
//     at all, and this is a plumbing bug in the traced batch. Nothing
//     about brightness values will fix it.
//
// Build the absurd arm before concluding a mechanism is wrong -- the
// same reasoning as shaft-probe in docs/moon-and-sky-leaks.md 5.5, which
// retired a plumbing theory after two subtle arms had failed to.
//
// Self-contained: every rt_spark_* value is stated, so no arm can inherit
// another's leftovers from the ini (they are CVAR_ARCHIVE).
// Applied with +exec AFTER tools/d64rt-pins.cfg, so these win.
rt_spark 1
rt_spark_count 8
rt_spark_life 5.0
rt_spark_speed 6.0
rt_spark_spread 38
rt_spark_gravity 11
rt_spark_drag 1.6
rt_spark_size 0.02
rt_spark_grid 0.03125
rt_spark_bright 2.0
rt_spark_max 2000
rt_spark_far 40
rt_spark_style 1
rt_spark_streak 2.5
rt_spark_collide 1
rt_spark_bounce 0.38
rt_spark_friction 0.28
rt_spark_rest 0.55
rt_spark_trace_max 24
rt_spark_debris 1
rt_spark_debris_count 6
rt_spark_debris_life 20
rt_spark_debris_speed 3.4
rt_spark_debris_size 0.05
rt_spark_debris_gravity 17
rt_spark_debris_bounce 0.22
rt_spark_debris_ao 0
rt_spark_debris_ao_strength 0.5
rt_spark_debris_ao_radius 1.0
rt_spark_debris_ao_dist 20
rt_spark_debris_ao_max 64
rt_spark_debris_rough 1.0
rt_spark_debris_metal 0.0
rt_spark_debris_tint 0
rt_spark_debris_albedo 0.02
rt_spark_debris_sat 3.0
rt_spark_light 1
rt_spark_light_intensity 180
rt_spark_light_life 0.18
rt_spark_light_max 12
rt_spark_glow 1
rt_spark_glow_max 8
rt_spark_glow_intensity 26
rt_spark_surface_debug 1
rt_spark_debug 0
