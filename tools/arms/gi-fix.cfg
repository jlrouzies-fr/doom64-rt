// ab arm: gi-fix -- GI bounce ladder (docs/rt-gi-bounces.md)
//
//   .\tools\ab.cmd gi-fix 03
//
// STAGE 4 -- the energy fix, at the SHIPPED depth of 2, against gi-shadow3
// (same rt_shadowrays, same everything, legacy weight on). Bounce 2 goes from
// radiance * pi/cos (mean ~6.3x, 1/cos tail) to the correct throughput of 1.
//
// EXPECT GI-lit areas to get noticeably DIMMER and LESS SATURATED, and the
// stable bright dots in bounce-lit corners to go with them. If the result is
// too dark for the art, the honest lever is rt_emis_mapboost or the light
// intensities -- never putting the pi/cos back.
//
// Judge on the UNFILTERED signal first: rt_debug_show 16 (raw indirect) and
// 128 (only indirect diffuse). Exposure is pinned below so you are judging GI,
// not eye adaptation. Every value here is the live ini value except the one
// this arm exists to move.
rt_shadowrays 3
rt_gi_bounces 2
rt_gi_bounce_legacy 0
rt_gi_bounce_shadows 1
rt_spp_indirect 3
rt_spp_direct 1
rt_shadow_samples 1
rt_restir_initial 32
rt_restir_spatial 8
rt_restir_mcap 20
rt_reflrefr_depth 2
rt_tnmp_ev100_min 2
rt_tnmp_ev100_max 7.7
rt_debug_show 0
rt_debug_restir_m 0
rt_debug_visibility 0
rt_upscale_dlss 2
rt_rayreconstr 0
