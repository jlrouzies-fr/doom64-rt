// ab firesky arm: firesky-nowash -- IS THE BOLT BEING HIDDEN BY ITS OWN FLASH?
//
// The deck flash is OFF entirely and the strike's directional is a third of
// shipping, with a strike every 3-5 seconds aimed straight at you. Whatever the
// bolt looks like HERE is what the bolt actually looks like; everything the
// shipping arm adds on top is what is competing with it.
//
//   ab.cmd firesky-nowash 23
//
// Run it against firesky-new and the difference is the wash, not the bolt.
// If the bolt is clear here and gone in firesky-new, the two knobs to move are
// the deck flash and the strike intensity -- IN THAT ORDER. The deck is
// re-drawn additively across the whole sky, so it is the one that removes the
// headroom the bolt needs; the directional mostly moves the tonemapper.
//
// If the bolt is NOT clear even here, stop looking at the flash. Check the
// bolt is drawn at all: the bolt textures live in d64r-rt-sky.pk3, and the
// bolt is cut below its own minimum flash level rather than faded out.
