// ab arm: title-cheap -- the candidate SHIPPING setting.
//
//   .\tools\ab.cmd title-cheap menu
//
// Everything as played -- DLSS balanced, the pinned moon -- with the two knobs
// that buy shadow stability most cheaply:
//
//   rt_restir_initial 16   (from 8) TRACES NO RAYS. "pure light
//                          importance-sampling quality, so this is close to
//                          free. Raise before reaching for rt_spp_direct."
//                          More candidates means the one light ReSTIR picks for
//                          a pixel is more often the moon rather than some
//                          nearby lamp -- and a shadow only exists for the light
//                          that was actually sampled
//   rt_shadow_samples 4    half of title-sharp's 8. Noise falls as 1/sqrt(N), so
//                          4 recovers 2x against 1 and 8 only 2.8x: the third
//                          and fourth rays are worth much more than the fifth
//                          through eighth
//
// rt_spp_direct stays at 1 (stock, bit-identical) because it costs an extra
// shadow ray per sample ON TOP of rt_shadow_samples and does the same job less
// directly.
//
// The test is not "do the shadows look as good as title-sharp" -- they will not.
// It is whether the marines read as standing ON the ground rather than pasted
// over it, at a frame cost you are willing to pay everywhere. Check the cost in
// a real level too (MAP02 with a crowd), never on the title screen alone: this
// buys nothing on a static scene and costs everywhere.
//
// If 4 is not enough, try 8 here before touching the upscaler -- rays are
// predictable, and reconstruction quality is not.
rt_restir_initial 16
rt_shadow_samples 4
rt_spp_direct 1
rt_spp_indirect 1
rt_upscale_dlss 2
rt_rayreconstr 0
// play lighting, unchanged
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_flsh 0
