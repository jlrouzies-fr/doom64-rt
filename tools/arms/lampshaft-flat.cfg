// ab lampshaft arm: lampshaft-flat -- NO FALLOFF AT ALL, i.e. sun-like.
//
// rt_volume_shaft_falloff 2 cancels the whole inverse square beyond a metre, so
// every listed lamp scatters as hard at 20 m as at 1 m. That is exactly what the
// MOON does -- a directional light has no distance term -- and it is why the
// shafts this renderer already had read across a whole level.
//
// EXPECT IT TO LOOK LIKE FOG, not like beams. A lamp that lights the air
// uniformly to the end of a corridor has no shape, and shape is the thing a
// shaft is made of. The value of this arm is the upper bound: if the reach is
// still not enough HERE, the problem is not the falloff and
// rt_volume_shaft_falloff is the wrong knob to be turning.
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_moon_presets 1
rt_flsh 0
rt_volume_type 1
rt_volume_far 60
rt_volume_scatter 1
rt_volume_ambient 0.2
rt_volume_lintensity 1
rt_volume_lassymetry 0.5
rt_volume_history 8
rt_volume_dither 5
rt_volume_dither_z 1
rt_volume_blur 1
rt_volume_occlude_emis 1
rt_ceiling_lamps 0
rt_ceiling_lamp_intensity 0
rt_ceiling_edge_lamps 1
rt_faux_lamps 1
rt_solo_lamps 1
rt_ceiling_bulb_gain 7
rt_ceiling_bulb_emis 20
rt_smoke 1
rt_volume_shafts 1
rt_volume_shaft_src 7
rt_volume_shaft_bands 4
rt_volume_shaft_max 32
rt_volume_shaft_trace 4
rt_volume_shaft_mult 1
rt_volume_shaft_nearfade 1.5
rt_volume_shaft_falloff 2
rt_volume_shaft_relcull 0.05
rt_volume_shaft_mincontrib 0
rt_volume_shaft_asym -2
rt_volume_shaft_maxdist 1920
rt_volume_shaft_mingap 96
rt_volume_shaft_minint 0
rt_volume_shaft_debug 0
rt_volume_shaft_verbose 0
rt_dust 1
rt_dust_density 0.10
rt_dust_max 900
rt_dust_far 12
rt_dust_near 0.5
rt_dust_size 0.008
rt_dust_size_ang 0.0022
rt_dust_color C8C8C8
rt_dust_albedo 0.9
rt_dust_drift 0.35
rt_dust_speed 0.25
rt_dust_cone -0.25
rt_dust_shaft_floor 0.08
rt_dust_shaft_radius 2.5
rt_dust_moon 1
rt_dust_moon_weight 1.0
rt_dust_clip 1
rt_dust_debug 0
