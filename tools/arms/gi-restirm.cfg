// ab arm: gi-restirm -- GI bounce ladder (docs/rt-gi-bounces.md)
//
//   .\tools\ab.cmd gi-restirm 03
//
// V6 -- the ReSTIR reuse contract. Depth touches vertex 1's RADIANCE only,
// never the stored position/normal the spatial-reuse Jacobian and shade()
// reconnect to, so the indirect reservoir's M must NOT move with depth.
// rt_debug_restir_m 2 paints that M as a green ramp on the unfiltered-indirect
// layer (M/32; black = 1). Run it at depth 2, then `rt_gi_bounces 4` in the
// console: the ramp must look identical standing still. If it darkens, a
// different reconnection vertex is being stored -- stop.
//
// Judge on the UNFILTERED signal first: rt_debug_show 16 (raw indirect) and
// 128 (only indirect diffuse). Exposure is pinned below so you are judging GI,
// not eye adaptation. Every value here is the live ini value except the one
// this arm exists to move.
rt_shadowrays 3
rt_gi_bounces 2
rt_gi_bounce_legacy 0
rt_gi_bounce_shadows 1
rt_debug_show 16
rt_debug_restir_m 2
rt_spp_indirect 3
rt_spp_direct 1
rt_shadow_samples 1
rt_restir_initial 32
rt_restir_spatial 8
rt_restir_mcap 20
rt_reflrefr_depth 2
rt_tnmp_ev100_min 2
rt_tnmp_ev100_max 7.7
rt_debug_show 0
rt_debug_restir_m 0
rt_debug_visibility 0
rt_upscale_dlss 2
rt_rayreconstr 0
