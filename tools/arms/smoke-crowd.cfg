// ab-smoke arm: crowd
// EVERY SOURCE AT ONCE, in the worst case for the budget: a torch-lit room with
// a fight in it. This is the arm for the pool, not for any one effect.
//
// What to watch is whether YOUR smoke survives. The pool evicts ambient puffs
// before any other kind and rt_smoke_ambient_budget caps them at 40 of 128, so
// the wisp off your own barrel should still appear with a dozen torches burning
// and a firefight running. If it does not, that priority rule has broken.
// `smoke` reports the split.
// Self-contained: every rt_smoke_* value is stated, so no arm can inherit
// another's leftovers from the ini (they are CVAR_ARCHIVE).
// Applied with +exec AFTER tools/d64rt-pins.cfg, so these win.
rt_fog 0
rt_fog_presets 0
rt_volume_type 1
rt_volume_blur 1
rt_volume_occlude_emis 1
rt_volume_dither 2
rt_smoke 1
rt_smoke_density 14
rt_smoke_color AEAEAE
rt_smoke_count 4
rt_smoke_budget 48
rt_smoke_life 2.2
rt_smoke_radius 0.35
rt_smoke_growth 0.5
rt_smoke_speed 1.8
rt_smoke_spread 0.55
rt_smoke_rise 0.65
rt_smoke_drag 1.9
rt_smoke_inherit 0.85
rt_smoke_offset 0.8
rt_smoke_muzzle_u 0
rt_smoke_repeat 5
rt_smoke_far 14
rt_smoke_ambient 0.45
rt_smoke_illum 1
rt_smoke_spp 4
rt_smoke_maxlight 6
rt_smoke_light_near 0.5
rt_smoke_monster 1
rt_smoke_monster_scale 1
rt_smoke_monster_far 18
rt_smoke_trail 1
rt_smoke_projectile 1
rt_smoke_barrel 1
rt_smoke_barrel_scale 1
rt_smoke_ambient_fx 1
rt_smoke_ambient_scale 1
rt_smoke_ambient_budget 40
rt_smoke_ambient_far 9
rt_smoke_stylize 0
rt_smoke_stylize_steps 3
rt_smoke_stylize_grid 0
rt_smoke_tint 0.8
rt_smoke_absorb 3
rt_smoke_history 2
rt_smoke_curl 1.6
rt_smoke_rocket 1
rt_smoke_rocket_every 1
rt_smoke_rocket_radius 0.16
rt_smoke_boom 5
rt_smoke_boom_radius 0.34
rt_smoke_light_far 6
rt_smoke_illum_blend 0.4
rt_smoke_debug 1
