// ab arm: lingtrail-grad
// Stage 2 only: the A-SVGF gradient never samples the weapon (rt_svgf_fp_grad 1).
//
// THE REPRO (screen/smearingIssueOverLingeringLight.png): any dim room. Fire a
// ROCKET at a wall, then bob, strafe and swing the view while the impact
// flash (rt_arc_light_life 2.5 s) and the embers (rt_ember_life 20 s) decay.
// Watch the wall and floor beside the launcher's silhouette: the control
// shows a dark sprite-shaped band sweeping with the gun; the floor arm
// (no gun drawn) is what a finished fix should match.
//
// Launch: .	oolsb.cmd lingtrail-grad [map]      -- default MAP03.
// Read back in game: rt_svgf_fp / rt_svgf_fp_grad.
//
// Self-contained: both fix cvars are NOARCH and stated in every arm; the
// impact lights are held at shipping values so the arms differ only in the
// denoiser's handling of the silhouette.
rt_svgf_fp 0
rt_svgf_fp_grad 1
rt_svgf_indir_maxhist 0
rt_svgf_indir_antilag 0

// --- the lingering lights: shipping values ---------------------------
rt_arc_light 1
rt_arc_light_life 2.5
rt_arc_glow 1
rt_ember 1
rt_ember_life 20
rt_dynlight 1

// --- the denoiser lane: A-SVGF, which is where the bug lives ----------
rt_rayreconstr 0
rt_nrd 0
rt_illum_sens_direct 1
rt_illum_sens_indirect 0.75
rt_illum_sens_spec 1
r_drawplayersprites 1
