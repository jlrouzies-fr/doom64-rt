// ab arm: firesky-vclouds -- THE FIRE SKY ON VOLUMETRIC CLOUDS.
//
// firesky-new (black dome, moon straight overhead, green/orange tint, the
// fireback under-light, embers, recoloured strikes) with the shell deck
// replaced by the ray-marched slab. The fire's light comes from BELOW the
// cloud here -- rt_clouds_fireback feeds the march's under-light -- and the
// overhead moon's light is filtered through it per ray.
//
//   ab.cmd firesky-vclouds 23    green
//   ab.cmd firesky-vclouds 22    orange
//
// Do not name a cvar in these comments (see firesky-new.cfg).
