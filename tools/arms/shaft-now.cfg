// ab shaft arm: shaft-now -- THE SHIPPING CONFIGURATION with the fix in.
//
// rt_volume_dither_z 1. One line off shaft-stock; run the two back to back.
//
// A froxel of depth dither is enough to break SLICE BANDING, which is the only
// artefact the depth axis has to hide -- banding is a half-froxel quantisation
// error. The 5 froxels it inherited were chosen to hide NOISE, and noise is what
// rt_volume_blur's screen-plane filter and rt_volume_history are for. Sizing a
// one-sided filter against the wrong artefact is what cost the shafts their far
// end.
//
//   mean shortfall = 0.33 * 1 * 0.94 m = 0.31 m
//
// which is stock RTGL1's figure at stock settings, restored at a 60 m reach.
//
// EXPECTED: the beam carries visibly further along its length -- toward the
// floor pool it lights -- with no change to its edge softness, because the
// screen axes are untouched at rt_volume_dither 5.
//
// If the edge starts BANDING instead, this went too far and the answer is a
// value between this and shaft-stock, not a return to the coupled radius.
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_moon_presets 1
rt_flsh 0
rt_volume_type 1
rt_volume_far 60
rt_volume_scatter 1
rt_volume_ambient 0.2
rt_volume_lintensity 1
rt_volume_lassymetry 0.5
rt_volume_history 8
rt_volume_dither 5
rt_volume_dither_z 1
rt_volume_blur 1
rt_volume_occlude_emis 1
rt_ceiling_bulb_gain 7
rt_ceiling_bulb_emis 20
rt_smoke 1
