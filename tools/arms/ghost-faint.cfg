// ab arm: ghost-faint -- the see-through monsters at a tenth of the opacity
// ghost-opaque gives them. The low end of the same two-arm test.
//
//   .\tools\ab.cmd ghost-opaque 03      alpha 1.00
//   .\tools\ab.cmd ghost-faint  03      alpha 0.10
//
// Read ghost-opaque's header for what this pair is for. In short: the two alphas
// are the only difference between the arms, 10x apart, on the shipping mechanism
// (rt_ghost_emis_split 1) -- pick a value here and it becomes the pin.
//
// Both arms looked identical before 2026-08-14, which was the additive-blend bug
// and not the arms. See ghost-opaque's header or docs/spectre-issue-log.md.
//
// Stand in the SAME spot for both runs. rt_ghost_lightscale multiplies the final
// alpha by the room's brightness (0.84 where the last log was taken), so moving
// between runs changes the number this test is reading.
rt_nightmareimp_alpha 0.1
rt_spectre_alpha 0.1
// Everything else that touches a ghost's alpha, stated so neither arm can
// inherit it from the ini or from a previous arm.
rt_ghost_emis 1
rt_ghost_emis_split 1
rt_translucent_minalpha 0.72
rt_ghost_lightscale 1
rt_ghost_solid 0
rt_spectre_corpse_solid 1
rt_mod_compat 1
rt_ghost_debug 1
rt_upscale_dlss 2
rt_rayreconstr 0
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sky 25
rt_flsh 0
