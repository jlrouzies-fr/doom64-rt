// ab arm: spriteao-ghost -- the contact blob put BACK under the see-through
// monsters, as the control for the exclusion that now ships.
//
//   .\tools\ab.cmd spriteao-on    02      what ships: no blob under a live ghost
//   .\tools\ab.cmd spriteao-ghost 02      the old behaviour, blob under everything
//
// THE ONE FLAG THAT DIFFERS is rt_sprite_ao_ghosts; every other value here is
// spriteao-on's, so the pair isolates it.
//
// WHY THE EXCLUSION. The blob's claim is that a SOLID body is sitting on this
// floor and blocking the light that would otherwise reach it. The 64Spectre
// (SAR2) and the 64NightmareImp (TRO2) are rasterized translucent overlays -- you
// can see the room through them at rt_spectre_alpha / rt_nightmareimp_alpha -- so
// the claim is false for exactly these two, and an opaque smudge tracking a body
// you can see through is the most visible thing about a creature whose whole
// point is being hard to see. rt_sprite_shadow already refuses them, for the same
// reason (they are not in the acceleration structure and cast nothing).
//
// WHAT TO LOOK AT. MAP02/MAP03 for spectres, MAP14 for nightmare imps, on a LIT
// floor -- the blob multiplies albedo, so a dark room hides the very thing being
// judged. Watch the floor, not the monster:
//
//   ghost -- a dark disc slides along the floor and gives the spectre's position
//            away well before the body does.
//   on    -- nothing under it. The monster reads only as the shimmer it is.
//
// CORPSES ARE NOT PART OF THIS and must be identical in both arms. A dead spectre
// is an ordinary solid sprite (rt_spectre_corpse_solid) and keeps its blob; if a
// corpse's blob changes between these two arms, the exclusion is keyed on the
// wrong test.
rt_sprite_ao 1
rt_sprite_ao_strength 0.7
rt_sprite_ao_radius 1.6
rt_sprite_ao_upright 0.7
rt_sprite_ao_sizefall 0.2
rt_sprite_ao_shape 2
rt_sprite_ao_fit 1
rt_sprite_ao_aspect 0.4
rt_sprite_ao_fade 56
rt_sprite_ao_scope 0
rt_sprite_ao_ghosts 1
rt_sprite_ao_segments 32
rt_sprite_ao_dist 30
rt_sprite_ao_debug 0
// shipping sprite shadows, unchanged across the pair
rt_sprite_shadow 1
rt_sprite_shadow_planes 4
rt_sprite_shadow_scope 1
rt_sprite_shadow_hidecaster 1
rt_sprite_shadow_width 1
rt_sprite_shadow_dist 40
rt_sun_split 1
rt_shadow_samples 1
rt_spp_direct 1
rt_upscale_dlss 2
rt_rayreconstr 0
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sky 25
rt_flsh 0
