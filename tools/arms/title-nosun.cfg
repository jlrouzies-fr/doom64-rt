// ab arm: title-nosun -- is the moon lighting the title map AT ALL?
//
//   .\tools\ab.cmd title-nosun menu
//
// THE QUESTION. screen/moon_shadow_limit.png: 21 x 64MarineBot (sprite PLAY,
// editor type 3008) stand in TITLEMAP casting no shadow, while the buildings
// appear to. Ruled out already, from the data rather than by eye:
//
//   - no caster limit exists. rt_shadowrays -> RTGL1 maxBounceShadows gates
//     shadow rays by BOUNCE DEPTH ("if illumination bounce index is in
//     [0, maxBounceShadows)"), never by how many objects cast
//   - not meta noShadow: 441 textures carry it, but PLAY/POSS/SPOS/SARG/TROO
//     are 243 entries with ZERO
//   - not the shadow cull mask: getShadowCullMask() returns WORLD_0 (+ the
//     first-person-viewer bit), and an opaque sprite lands in WORLD_0
//   - not the sprite: enemies cast shadows in play when they shoot -- observed
//
// That leaves the LIGHT, not the caster. rt_sun 0 answers it in one look: if
// the title screen looks the SAME with the moon off, the moon was never
// lighting that ground, nothing there can cast a directional shadow, and the
// dark bands under the buildings are GI/ambient occlusion rather than shadows.
//
// If instead the scene goes noticeably flatter, the moon IS doing the work
// there, the marines are being lit by it too, and the question becomes why
// their shadow specifically does not survive -- go to title-sharp.
//
// Everything else is left at the play pins on purpose: this arm changes ONE
// thing.
rt_sun 0
rt_sky 25
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sun_intensity 90
rt_flsh 0
