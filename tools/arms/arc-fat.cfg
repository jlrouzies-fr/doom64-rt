// ab arm: arc-fat
// RUN THIS FIRST. Twelve times the life, 3x the reach, 5x the width and
// the crackle switched OFF, so the mark sits on the wall as an
// unmistakable static blot. It exists to prove the PLUMBING is live
// before any value is judged, and the plumbing here is long: an arc
// appears only if the thinker walk matched the class, the MF_MISSILE
// edge fired, AND the probe found a surface. If this shows nothing,
// read the log -- it distinguishes all three.
//
//
// THIS ARM SHOWS NO MOTION, BY DESIGN. Both rt_arc_churn and
// rt_arc_flicker are 0 here, so the mark neither re-paths nor
// crackles -- it is a static blot. That is deliberate: a branch that
// is meant to drop out for a few frames and one that never rendered
// look identical once things are moving, and so do a branch
// re-pathing and one being drawn in the wrong place. A plumbing probe
// has to hold still.
//
// So do NOT judge the erratic movement or the branch lights here --
// use arc-alive for that. This arm answers one question only: does
// anything appear on the wall at all.
//
// PROJECTILE IMPACT ARCS -- a MARK on the wall, not particles. Branches are
// polylines regenerated from the mark's seed every frame, which is what lets
// them flicker. See docs/rt-impact-fx.md.
// Self-contained: every rt_arc_* value is stated, plus rt_spark, so no arm
// can inherit another's leftovers from the ini (they are CVAR_ARCHIVE).
// Applied with +exec AFTER tools/d64rt-pins.cfg, so these win.
rt_arc 1
rt_arc_life 6.0
rt_arc_bright 6.0
rt_arc_max 64
rt_arc_burn 1
rt_arc_burn_life 120
rt_arc_burn_radius 0.40
rt_arc_burn_strength 0.90
rt_arc_burn_dist 25
rt_arc_burn_max 48
rt_arc_branches 16
rt_arc_segments 5
rt_arc_reach 1.6
rt_arc_width 0.06
rt_arc_jitter 0.55
rt_arc_fork 0.55
rt_arc_flicker 0
rt_arc_flicker_rate 1.0
rt_arc_churn 0
rt_arc_wander 0.45
rt_arc_creep 16
rt_arc_creep_reach 2.4
rt_arc_glow 1
rt_arc_glow_max 10
rt_arc_glow_intensity 45
rt_arc_core 0.30
rt_arc_far 40
rt_arc_light 1
rt_arc_light_intensity 600
rt_arc_light_life 1.5
rt_arc_probe 1.6
rt_arc_probe_max 512
rt_arc_debug 1
rt_spark 0
rt_spark_surface_debug 0
