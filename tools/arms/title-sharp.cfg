// ab arm: title-sharp -- play lighting, but nothing allowed to smear it.
//
//   .\tools\ab.cmd title-sharp menu
//
// THE THEORY THIS TESTS, and it fits the one piece of evidence the others do
// not: sprite shadows DO appear in play when an enemy shoots. A muzzle flash is
// a bright light a metre from the sprite, so the shadow it throws is most of the
// light at those pixels -- it survives anything. The moon at intensity 90,
// against a scene that also has a sky dome, sector emissives and the map's own
// lights, throws a shadow worth a few percent of the pixel, from a caster that
// is THIN, DISTANT and MOVING (64MarineBot runs A_Wander in its spawn state).
// Thin + distant + moving is precisely what a temporal denoiser cannot keep: it
// has no history to reuse, so it falls back on spatial blur and the shadow is
// averaged out of existence. Static buildings have stable history and keep
// theirs, which is exactly the split in the screenshot.
//
// So: upscaler OFF (native), denoiser given more to work with, and the direct
// term sampled hard enough that the shadow is not noise in the first place.
//
//   rt_upscale_dlss 0     no DLSS-SR -- it upsamples, so a few-pixel shadow of a
//                         distant sprite is reconstructed from fewer samples
//                         than it needs. The pins use 2 (balanced)
//   rt_rayreconstr 0      already the pinned value; stated so this arm cannot
//                         inherit a 1 left by an RR test
//   rt_shadow_samples 8   direct visibility is ONE binary ray per pixel by
//                         default -- a hard edge on a small caster is pure noise
//                         at 1 spp, and noise is what gets denoised away
//   rt_spp_direct 4
//
// If the marines' shadows appear here, nothing is broken: the shadow was always
// being cast and the pipeline was throwing it away. That is a tuning answer
// (contrast + samples), not a bug, and it should NOT be shipped as these values
// -- they are expensive. It just tells you where the loss is.
//
// If they still do not appear at native resolution with 8 shadow samples, the
// denoiser is exonerated and the sprite really is not occluding: go to
// title-sunonly, then `+rt_prim_debug 1` and read the console.
rt_upscale_dlss 0
rt_rayreconstr 0
rt_shadow_samples 8
rt_spp_direct 4
rt_spp_indirect 1
// play lighting, unchanged
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_flsh 0
