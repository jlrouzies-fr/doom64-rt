// ab lampshaft arm: lampshaft-on -- THE SHIPPING VALUES.
//
// Everything at its compiled default and its pin in tools/d64rt-pins.cfg, so
// this arm is what play actually looks like. It exists so the A/B against
// lampshaft-off is a switch rather than a rebuild, and so a later retune has a
// fixed point to move away from.
//
// What to look for: a soft cone in the air under a ceiling lamp, strongest when
// you look TOWARD the lamp and weak from the side. That asymmetry is the phase
// function's forward bias (rt_volume_lassymetry 0.5, ~11x) and is expected, not
// a bug -- docs/moon-and-sky-leaks.md 5.5 is the write-up. If it reads too weak,
// the knobs in order are rt_volume_shaft_mult, then rt_volume_scatter (which
// thickens the whole level's haze with it), then rt_volume_shaft_asym.
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_moon_presets 1
rt_flsh 0
rt_volume_type 1
rt_volume_far 60
rt_volume_scatter 1
rt_volume_ambient 0.2
rt_volume_lintensity 1
rt_volume_lassymetry 0.5
rt_volume_history 8
rt_volume_dither 5
rt_volume_dither_z 1
rt_volume_blur 1
rt_volume_occlude_emis 1
rt_ceiling_lamps 0
rt_ceiling_lamp_intensity 0
rt_ceiling_edge_lamps 1
rt_faux_lamps 1
rt_solo_lamps 1
rt_ceiling_bulb_gain 7
rt_ceiling_bulb_emis 20
rt_smoke 1
rt_volume_shafts 1
rt_volume_shaft_src 7
rt_volume_shaft_max 16
rt_volume_shaft_trace 3
rt_volume_shaft_mult 1
rt_volume_shaft_nearfade 1.5
rt_volume_shaft_falloff 1
rt_volume_shaft_relcull 0.05
rt_volume_shaft_mincontrib 0
rt_volume_shaft_asym -2
rt_volume_shaft_maxdist 1024
rt_volume_shaft_mingap 96
rt_volume_shaft_minint 0
rt_volume_shaft_debug 0
rt_volume_shaft_verbose 1
