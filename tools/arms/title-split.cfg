// ab arm: title-split -- THE FIX. The moon shaded outside ReSTIR's lottery.
//
//   .\tools\ab.cmd title-split menu        the title map, where this was found
//   .\tools\ab.cmd title-split 02          and a real level, where it must not cost
//
// Against title-nosplit, which is the same cfg with rt_sun_split 0. Everything
// else is the PLAY configuration -- stock rt_shadow_samples 1, stock
// rt_spp_direct 1, DLSS balanced -- on purpose: the claim being tested is that
// one deterministic sun ray beats eight samples and four direct spp, so it has
// to be shown at stock quality settings, not on top of them.
//
// WHAT CHANGED IN THE ENGINE. RaygenCommon.h built two reservoirs -- one for the
// regular lights, one for the directional light -- and merged them with
// updateCombinedReservoir(combined, dirLightReservoir, rnd): a random draw, so
// ONE light wins per pixel. Correct importance sampling, and fatal for a light
// that is huge but weak. At intensity 90 against this game's lamps and
// rt_sector_emis surfaces the moon wins on a minority of pixels, so its shadows
// are a sparse random subset that the denoiser flattens. With rt_sun_split 1 the
// sun is excluded from that draw (in the DIRECT *and* INITIAL passes -- INITIAL
// writes the reservoir DIRECT's first sample loads) and shaded separately: one
// shadow ray on every pixel facing it.
//
// WHAT TO CHECK, in this order:
//
//   1. The marines in the title map cast shadows. That is the whole point.
//   2. SUNLIT SURFACES ARE THE SAME BRIGHTNESS as in title-nosplit. The split is
//      unbiased by construction -- same single-candidate reservoir, same weight,
//      the light merely removed from the candidate set rather than counted twice
//      -- so anything brighter or dimmer is a bug, not a preference. Judge this
//      on a big lit wall, not on the shadows.
//   3. A room the moon does NOT reach is unchanged. Indirect bounce and the
//      volumetric fog shafts keep the stock path and should be bit-identical.
//   4. Frame time on MAP02, not on the title screen. The cost is one shadow ray
//      per sun-facing pixel: outdoors that is most of the screen, indoors nearly
//      none.
//
// If (2) fails, suspect the weight rather than the ray: calcSunOnlyReservoir
// deliberately mirrors how calcInitialReservoir built dirLightReservoir, and a
// drift between the two is the one way this can change energy.
rt_sun_split 1
// stock quality -- the fix must stand on its own
rt_shadow_samples 1
rt_spp_direct 1
rt_spp_indirect 1
rt_restir_initial 8
rt_upscale_dlss 2
rt_rayreconstr 0
// play lighting, unchanged
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_flsh 0
