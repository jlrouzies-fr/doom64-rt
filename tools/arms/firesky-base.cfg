// ab firesky arm: firesky-base -- THE SHIPPING VALUES, stated explicitly.
//
// rt_sky 175, which is MAP22/24/28. On MAP23/32 the shipping value is 400 --
// run `.\tools\ab.cmd firesky-base 23 -- +rt_sky 400` for the green one, or
// just play the map, since RT_MOON_PRESETS applies these anyway.
//
// Pair it with firesky-before (the old 1.2 / 2.7) to see the change, and with
// firesky-loud to see where the ceiling is. See docs/plan-fire-skies.md.
//
// WHERE THE NUMBERS COME FROM. 400 was judged in play on MAP23 (2026-08-23).
// 175 is 400 divided by the two families' measured linear-radiance ratio of
// 2.32x, so the orange dome keeps rendering brighter than the green one the way
// its art is. That ratio is a whole-image figure and it lives entirely in the
// horizon band -- over the upper half the two families measure 0.99x, i.e.
// identical -- so it is preserved for APPEARANCE, not because orange delivers
// more light to a room. 175 has not been judged in play.
//
// CONDITIONS, held by every firesky-* arm so they differ in ONE value only:
//
//   rt_moon_presets 0   LOAD-BEARING, not tidiness. RT_MoonApplyPresets
//                       (rt_presets.cpp) rewrites rt_sky from RT_MOON_PRESETS
//                       on EVERY level load while presets are on, and the fire
//                       maps are IN that table. An arm that sets rt_sky and
//                       leaves this at 1 gets the preset back at map load and
//                       never says so -- the same trap leak-base documents for
//                       rt_sun_a/_b.
//   rt_sun 0 + i 0      What the preset does anyway on these five maps
//                       (intensity 0, disc false). Stated explicitly so the arm
//                       does not depend on the table it just turned off.
//   rt_clouds 0         No deck on a fire map today -- none of the five is in
//                       RT_CLOUD_PRESETS. Stated for the same reason.
rt_moon_presets 0
rt_sun 0
rt_sun_intensity 0
rt_moon_geo 0
rt_clouds 0
rt_clouds_presets 0
rt_sky 175
rt_sky_saturation 1
rt_sky_stretch 1.2
rt_sky_always true
