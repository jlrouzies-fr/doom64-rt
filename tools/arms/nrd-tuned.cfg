// ab arm: nrd-tuned -- nrd-probe plus the gap-closing ReLAX tuning, built
// from the verdict "NRD is a bit noisier than A-SVGF at 1 spp, similar at 2":
//   maxaccum 60      (2x accumulation -- the primary noise lever)
//   atrous 6         (one more wavelet iteration, nearer A-SVGF's blur)
//   prepass_diff 40  (stronger diffuse spatial reuse before accumulation)
//   minhitdist 0.02  (NVIDIA's own recommendation for ReSTIR-class signals)
// All are LIVE cvars -- tweak in the console mid-game, read back via the
// 'NRD/ReLAX settings:' log line. Judge vs rr-asvgf at 1 spp; if this
// matches A-SVGF, 2 spp stays in the pocket instead of the budget.
//
// Self-contained: every denoiser-relevant value stated (ab-cvars-must-not-persist).
rt_upscale_dlss 2
rt_upscale_fsr2 0
rt_rayreconstr 0
rt_framegen 0
rt_sharpen 0
rt_dlss_preset 5
rt_rr_preset 5
// THE PROBE
rt_nrd 1
rt_nrd_validation 0
rt_nrd_maxaccum 60
rt_nrd_fastaccum 0
rt_nrd_atrous 6
rt_nrd_prepass_diff 40
rt_nrd_prepass_spec 0
rt_nrd_philum 0
rt_nrd_minhitdist 0.02
rt_nrd_antifirefly 1
// Inert here (RR off) -- stated at rr-full's values.
rt_rr_preexposure 1
rt_rr_exptex 1
rt_rr_translayer 1
rt_rr_glowpre 0
rt_rr_restir_mcap 4
rt_rr_preexp_debug 0
rt_rr_temporal 0
rt_rr_disocc 1
rt_rr_disocc_ratio 3.0
rt_rr_disocc_mindelta 0.01
rt_rr_disocc_show 0
rt_rr_firefly 0
rt_rr_firefly_minlum 0.01
rt_rr_spechitdist 1
rt_rr_guide_mode 1
rt_rr_guide_min 0.01
rt_rr_reset_on_lightcut 1
rt_rr_reset_on_dynlight 1
rt_rr_reset_delta 0.5
rt_rr_reset_min_ms 250
rt_rr_reset_hold 0
rt_rr_reset_now 0
rt_rr_reset_debug 0
// Signal quality upstream, shipping values.
rt_restir_bluenoise 1
rt_restir_tjitter 2.0
rt_restir_indir_antilag 1
rt_restir_initial 32
rt_restir_spatial 8
rt_restir_spatial_radius 30
rt_restir_mcap 20
rt_shadow_samples 1
rt_spp_direct 1
rt_spp_indirect 1
rt_mip_bias 0
rt_tnmp_ev100_min 2.0
rt_tnmp_ev100_max 7.7

