// ab moon arm: moon-dens -- TWICE the historical density. The arm for "the fix
// is right and the shafts should still be stronger".
//
// rt_volume_scatter 1 -> 2 on top of the per-metre normalisation, so this is
// double what the moon ever scattered through, not a return to anything.
//
// WHAT IT ALSO DOES, and why it is the blunt option: rt_volume_scatter moves the
// WHOLE medium. In RtVolumetric.rgen the cell stores
//
//     lighting  = volumeAmbient + volumeLightMult * radiance * phase
//     imageStore( ..., vec4( lighting * scattering, scattering + absorbtion ) )
//
// so doubling it doubles the lit shaft, the grey ambient floor around it, and
// the extinction that fades distance -- a hazier level, not just a brighter
// beam. moon-lint is the same brightness with none of that.
//
// Judge it in a long hall as well as in the shaft; the haze reaches 60 m now.
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_moon_presets 1
rt_flsh 0
rt_volume_type 1
rt_volume_far 60
rt_volume_scatter 2
rt_volume_ambient 0.2
rt_volume_lintensity 1
rt_volume_lassymetry 0.5
rt_volume_history 8
rt_volume_dither 5
rt_volume_dither_z 1
rt_volume_blur 1
rt_volume_occlude_emis 1
rt_ceiling_bulb_gain 7
rt_ceiling_bulb_emis 20
rt_smoke 1
