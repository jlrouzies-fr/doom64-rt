// ab cull arm: cull-wide -- the cheap fix, if it is enough.
//
// Same culling MODE as the default (0: visible sectors + their neighbours), but
// the unconditional radius goes 10 m -> 40 m, i.e. 320 -> 1280 map units. Any
// wall within 40 m of you is uploaded whether or not it is visible or adjacent
// to something visible, so turning on the spot stops changing what exists.
//
// This is the arm to prefer if it works, because it keeps the neighbour-graph
// culling that makes big maps affordable and only widens the guaranteed shell
// around the player. Cost is CPU, not GPU: it is more geometry submitted per
// frame from the second BSP walk, and rt_cpu_nocullradius is flagged
// "[IMPACTS CPU PERFORMANCE]" for that reason. Watch the frame time, not the
// GPU meter.
//
// If cull-wide fixes it and cull-all also fixes it, ship the radius, not the
// mode -- see cull-all.cfg for why mode 2 is not a free win here.
//
// Ceiling and strip lamps off, as in every cull arm -- cull-stock.cfg explains
// why, and why BOTH ceiling cvars have to be zeroed.
rt_cpu_cullmode 0
rt_cpu_nocullradius 40
rt_sun 1
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_sky_always 1
rt_sky_nowalls 0
rt_flsh 0
rt_ceiling_lamps 0
rt_ceiling_edge_lamps 0
rt_wall_strips 0
rt_hang_lamps 1
rt_solo_lamps 1
rt_spin_panels 1
rt_dynlight 1
rt_flame_light_on 1
