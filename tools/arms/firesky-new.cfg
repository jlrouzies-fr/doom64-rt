// ab firesky arm: firesky-new -- THE ALTERNATIVE SKY, at its shipping values.
//
// The master switch is the FIRST setting below. It was once quoted in this
// header too, and a script that rewrote these files matched the quoted copy
// instead of the real one and silently deleted the setting -- two test runs
// measured a mode that was never on. Do not name a cvar in the comments here.
//
// On the five hell maps this is MAP12's arrangement moved to hell: a BLACK
// dome, the cloud deck maxed and tinted hard orange or green, a moon straight
// overhead as the light the deck filters, embers drifting in the sky, and
// strikes recoloured to match, held longer and aimed into your view.
//
//   ab.cmd firesky-new 23    green -- MAP23
//   ab.cmd firesky-new 22    orange -- MAP22
//
// Pair it with firesky-base, the same maps on the WAD's own dome at the
// corrected rt_sky. They are different skies, not better and worse versions of
// one.
//
// WHAT TO LOOK AT, in this order:
//
//   1. Is the sky SOLID CLOUD down to near the horizon? The deck is a bowl
//      overhead and its rim angle is what decides how much sky it fills -- at
//      the storm's 9 degrees you have to look straight up to find any.
//   2. Is the LEVEL coloured by it? Under total cover the transmitted moonlight
//      is the only light the outdoors gets, so the ground should read orange or
//      green. If it is dark, the deck's transmit is the knob, not the moon.
//   3. Do embers drift and BURN OUT IN THE AIR? They must never reach the
//      floor. Stand in a courtyard -- they spawn only under an open sky.
//   4. Do strikes appear IN FRONT of you, and last long enough to see?
//
// The console command `firesky` prints what is actually in effect, and the
// level-load line in rt-console.log says the same. Read one of them before
// changing a value: this mode has twice been overwritten after it applied.
//
// rt_moon_presets stays ON, unlike the other firesky-* arms: this mode needs
// RT_MOON_PRESETS to run so that it can override it afterwards.
rt_fireskies_new 1
rt_firesky_dome 1
rt_firesky_clouds 1
rt_firesky_cloud_horizon 3.5
rt_firesky_cloud_wind 0.008
rt_firesky_cloud_transmit 0.45
rt_firesky_moon 1
rt_firesky_moon_intensity 140
rt_firesky_embers 1
rt_firesky_ember_rate 5
rt_firesky_ember_life 7
rt_firesky_ember_size 0.05
rt_firesky_ember_fall 0.5
rt_firesky_ember_radius 34
rt_firesky_ember_height 40
rt_firesky_ember_floor 6
rt_firesky_strikes 1
rt_firesky_strike_min 16
rt_firesky_strike_max 45
rt_firesky_flash 0.55
rt_firesky_strike_intensity 900
rt_firesky_fireback 1.0
rt_firesky_underlit 0.15


rt_firesky_strike_boltmin 0.05
rt_firesky_strike_aim 0.8
rt_lightning 1
rt_lightning_bolt 1
rt_spark 1
rt_spark_glow 1
rt_moon_presets 1
rt_clouds_presets 1
