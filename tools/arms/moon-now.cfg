// ab moon arm: moon-now -- THE SHIPPING CONFIGURATION, with the fix in. Run
// this one and moon-before back to back.
//
// The report: since the smoke work the moon's volumetric shafts are much weaker
// on MAP01 -- barely visible standing in front of the ceiling opening, but
// clearly there if you stand UNDER it and look up at the moon.
//
// The cause was rt_volume_far 30 -> 60, a pin raised for smoke's render
// distance. The shader applies scattering PER CELL and the grid is 64 slices
// whatever the reach, so doubling the reach halved how many cells a shaft
// crosses -- and halved the light scattered out of it. rt_main.cpp now
// normalises rt_volume_scatter into a per-METRE density against a 30 m
// reference, so this arm is the old density at the new reach.
//
// HOW TO VIEW EVERY ARM IN THIS FAMILY. Two positions, always both:
//
//   A. in front of the opening, looking ACROSS the shaft
//   B. under the opening, looking UP at the moon, along the shaft
//
// B is far stronger in every arm and that is not a fault: the phase function is
// Henyey-Greenstein at rt_volume_lassymetry 0.5, so scattering into the eye is
// ~11x stronger looking into the beam than across it. What these arms decide is
// whether position A reads at all.
//
// DON'T FIRE. rt_smoke is left at its shipping 1 so this is genuinely the play
// configuration, but a puff in frame switches those froxels onto a different
// lighting path (docs/rt-smoke.md S4) and is not what is being judged.
//
// Every arm in this family states the whole volume block, because these are
// CVAR_ARCHIVE and would otherwise inherit whatever the previous arm left in the
// ini. Diff two arms to see the one line that differs.
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_moon_presets 1
rt_flsh 0
rt_volume_type 1
rt_volume_far 60
rt_volume_scatter 1
rt_volume_ambient 0.2
rt_volume_lintensity 1
rt_volume_lassymetry 0.5
rt_volume_history 8
rt_volume_dither 5
rt_volume_dither_z 1
rt_volume_blur 1
rt_volume_occlude_emis 1
rt_ceiling_bulb_gain 7
rt_ceiling_bulb_emis 20
rt_smoke 1
