// ab lampshaft arm: lampshaft-listorder -- THE BUG, kept runnable.
//
// rt_volume_shaft_relcull 0 restores the original behaviour: the per-froxel ray
// budget is spent in LIST ORDER, and the list is sorted by distance to the
// CAMERA. So a froxel ten metres down a corridor is tested against the three
// lamps behind the player and never against its own -- which is not merely dim,
// it is absent, whatever its brightness.
//
// That was half of the 2026-08-14 "shafts do not reach" report (the other half
// was the inverse square, see lampshaft-phys). It is kept as an arm because the
// symptom -- shafts only near whichever lamp you are standing under -- looks
// exactly like a brightness problem and is not one, and because raising
// rt_volume_shaft_trace to 16 here should make the distant shafts reappear,
// which is the confirmation.
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_moon_presets 1
rt_flsh 0
rt_volume_type 1
rt_volume_far 60
rt_volume_scatter 1
rt_volume_ambient 0.2
rt_volume_lintensity 1
rt_volume_lassymetry 0.5
rt_volume_history 8
rt_volume_dither 5
rt_volume_dither_z 1
rt_volume_blur 1
rt_volume_occlude_emis 1
rt_ceiling_lamps 0
rt_ceiling_lamp_intensity 0
rt_ceiling_edge_lamps 1
rt_faux_lamps 1
rt_solo_lamps 1
rt_ceiling_bulb_gain 7
rt_ceiling_bulb_emis 20
rt_smoke 1
rt_volume_shafts 1
rt_volume_shaft_src 7
rt_volume_shaft_max 16
rt_volume_shaft_trace 3
rt_volume_shaft_mult 1
rt_volume_shaft_nearfade 1.5
rt_volume_shaft_falloff 1
rt_volume_shaft_relcull 0
rt_volume_shaft_mincontrib 0
rt_volume_shaft_asym -2
rt_volume_shaft_maxdist 1024
rt_volume_shaft_mingap 96
rt_volume_shaft_minint 0
rt_volume_shaft_debug 0
rt_volume_shaft_verbose 1
