rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_moon_presets 1
rt_flsh 0
rt_volume_type 1
rt_volume_far 60
rt_volume_scatter 1
rt_volume_ambient 0.2
rt_volume_lintensity 1
rt_volume_lassymetry 0.5
rt_volume_history 8
