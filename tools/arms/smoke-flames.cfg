// ab-smoke arm: flames
// AMBIENT FLAME SMOKE ON ITS OWN -- torches, sconces, floor fires, 64BigFire's
// bonfires and the Lost Soul's head. Everything event-driven is off, so nothing
// you see came from a gun.
//
// Stand in a torch-lit room and DON'T fire. What you are judging is whether it
// reads as heat carrying soot upward or as a row of little puffs; a torch that
// coughs like a shotgun looks like it is going out.
//
// `smoke` in the console reports "N ambient, cap 40". Sitting AT the cap is the
// expected state in a busy room, not a fault -- it means the budget is holding
// flames back so a shot can still find a slot.
// MAP02 and MAP05 are torch-heavy; MAP12 has 64BigFire.
// Self-contained: every rt_smoke_* value is stated, so no arm can inherit
// another's leftovers from the ini (they are CVAR_ARCHIVE).
// Applied with +exec AFTER tools/d64rt-pins.cfg, so these win.
rt_fog 0
rt_fog_presets 0
rt_volume_type 1
rt_volume_blur 1
rt_volume_occlude_emis 1
rt_volume_dither 2
rt_smoke 1
rt_smoke_density 14
rt_smoke_color AEAEAE
rt_smoke_count 4
rt_smoke_budget 48
rt_smoke_life 2.2
rt_smoke_radius 0.35
rt_smoke_growth 0.5
rt_smoke_speed 1.8
rt_smoke_spread 0.55
rt_smoke_rise 0.65
rt_smoke_drag 1.9
rt_smoke_inherit 0.85
rt_smoke_offset 0.8
rt_smoke_muzzle_u 0.3
rt_smoke_repeat 5
rt_smoke_far 14
rt_smoke_ambient 0.45
rt_smoke_illum 1
rt_smoke_spp 4
rt_smoke_maxlight 6
rt_smoke_light_near 0.5
rt_smoke_monster 0
rt_smoke_monster_scale 1
rt_smoke_monster_far 18
rt_smoke_trail 0
rt_smoke_projectile 0
rt_smoke_barrel 0
rt_smoke_barrel_scale 1
rt_smoke_ambient_fx 1
rt_smoke_ambient_scale 1
rt_smoke_ambient_budget 40
rt_smoke_ambient_far 9
rt_smoke_stylize 0
rt_smoke_stylize_steps 3
rt_smoke_stylize_grid 0
rt_smoke_tint 0.8
rt_smoke_absorb 3
rt_smoke_curl 1.6
rt_smoke_rocket 0
rt_smoke_rocket_every 1
rt_smoke_rocket_radius 0.16
rt_smoke_boom 5
rt_smoke_boom_radius 0.34
rt_smoke_light_far 6
rt_smoke_illum_blend 0.4
// OFF. This is a LOOK arm -- the console spam belongs to smoke-debug and
// the probe arms, not to an arm you are trying to judge an image in.
rt_smoke_debug 0