// ab arm: title-native -- the other half of title-sharp: the upscaler.
//
//   .\tools\ab.cmd title-native menu
//
// Native resolution (rt_upscale_dlss 0), shadow sampling left at the stock 1.
// The complement of title-samples, so between them they say which of the two
// was actually keeping the marine shadows alive.
//
//   shadows back here, not in title-samples  -> DLSS-SR is reconstructing them
//     away. A few-pixel umbra on a moving sprite has no stable history to
//     upsample from, so it is invented from neighbours that are lit. That is a
//     harder problem than a sample count: the honest options are a higher DLSS
//     preset (quality rather than balanced) or accepting it
//   shadows back in BOTH                     -> they are independent losses and
//     the cheap partial fix is still the samples
//   shadows back only in title-sharp         -> neither alone is enough and it
//     takes both, which means shipping this is a real performance decision
//     rather than a tweak
//
// Do not read frame rate off this arm as if it were a setting. Native is here to
// attribute the cause, not to be played.
rt_upscale_dlss 0
rt_rayreconstr 0
rt_shadow_samples 1
rt_spp_direct 1
rt_spp_indirect 1
// play lighting, unchanged
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_flsh 0
