// ab lampshaft arm: lampshaft-fat -- RUN THIS ONE FIRST.
//
// THE ABSURD ARM, and it is not a look. rt_volume_shaft_mult 200 with the near
// fade off, the dedupe off, every family on, the full 32-light list and 8 shadow
// rays per froxel. Interiors should be unmistakably, unpleasantly full of light
// -- solid beams under every lamp, blown out around the bulbs.
//
// It exists because "the knob does nothing" is always TWO hypotheses -- the
// value is too small to see, or it never reached the shader -- and only a value
// far past visible separates them for one launch. Every subtle arm in this
// family is worthless until this one has been seen to do something. That is the
// same lesson shaft-probe and rt_smoke_debug 4 were built for, and it has been
// paid for three times in this renderer.
//
//   the level floods       -> the plumbing is live end to end. Go to
//                             lampshaft-on and judge values.
//   nothing changes at all -> the list, the uniform or the shader is dead. Go to
//                             lampshaft-probe, which reads nothing but the
//                             count, and stop tuning.
//
// rt_volume_shaft_verbose is on in every arm here: the console line says how
// many fixtures each family offered and how many were actually sent, which
// separates "nothing qualified" from "the bulb lattice ate the budget".
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_moon_presets 1
rt_flsh 0
rt_volume_type 1
rt_volume_far 60
rt_volume_scatter 1
rt_volume_ambient 0.2
rt_volume_lintensity 1
rt_volume_lassymetry 0.5
rt_volume_history 8
rt_volume_dither 5
rt_volume_dither_z 1
rt_volume_blur 1
rt_volume_occlude_emis 1
rt_ceiling_lamps 0
rt_ceiling_lamp_intensity 0
rt_ceiling_edge_lamps 1
rt_faux_lamps 1
rt_solo_lamps 1
rt_ceiling_bulb_gain 7
rt_ceiling_bulb_emis 20
rt_smoke 1
rt_volume_shafts 1
rt_volume_shaft_src 7
rt_volume_shaft_bands 4
rt_volume_shaft_max 32
rt_volume_shaft_trace 8
rt_volume_shaft_mult 200
rt_volume_shaft_nearfade 0
rt_volume_shaft_falloff 1
rt_volume_shaft_relcull 0.05
rt_volume_shaft_mincontrib 0
rt_volume_shaft_asym -2
rt_volume_shaft_maxdist 1920
rt_volume_shaft_mingap 0
rt_volume_shaft_minint 0
rt_volume_shaft_debug 0
rt_volume_shaft_verbose 1
rt_dust 1
rt_dust_density 0.10
rt_dust_max 900
rt_dust_far 12
rt_dust_near 0.5
rt_dust_size 0.008
rt_dust_size_ang 0.0022
rt_dust_color C8C8C8
rt_dust_albedo 0.9
rt_dust_drift 0.35
rt_dust_speed 0.25
rt_dust_cone -0.25
rt_dust_debug 1
