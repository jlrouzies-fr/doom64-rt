// ab arm: title-rr -- the denoiser the project calls preferred, which the pins
// currently turn OFF.
//
//   .\tools\ab.cmd title-rr menu
//
// AGENTS.md lists "+rt_upscale_dlss 2 +rt_rayreconstr 1" as the preferred
// denoising path. tools/d64rt-pins.cfg line 20 says `rt_rayreconstr 0`. So every
// arm in this investigation, and normal play, has been running A-SVGF + DLSS-SR
// rather than DLSS Ray Reconstruction. Worth one look before writing any code:
// A-SVGF is a hand-tuned spatiotemporal filter whose antilag gate REJECTS
// history exactly where things move, which is the case that loses a walking
// sprite's shadow; RR is a trained denoiser fed the raw signal plus guide
// buffers, and small contact shadows are the kind of detail it is trained to
// keep.
//
// Two honest caveats:
//
//   - This is not a free swap. RAYRECONSTRUCTION.md is the reference and it
//     carries five faults that cost days -- read it before concluding anything
//     from this arm, especially before deciding to flip the pin.
//   - RR needs rt_upscale_dlss > 0 and nvngx_dlssd.dll, and it disables frame
//     generation.
//
// Shadow samples are left at 4 rather than 1 or 8: enough that the moon's shadow
// is a soft fraction where the moon IS chosen, so what this arm tests is the
// denoiser's ability to keep it, not the raw signal's existence.
rt_rayreconstr 1
rt_upscale_dlss 2
rt_shadow_samples 4
rt_spp_direct 1
rt_spp_indirect 1
rt_restir_initial 16
// play lighting, unchanged
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_flsh 0
