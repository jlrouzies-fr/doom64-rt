// ab lampshaft arm: lampshaft-lit -- WHERE A LAMP REACHES, ignoring occluders.
//
// rt_volume_shaft_debug 1: a froxel is painted RED wherever any listed light
// survives the radiance cull, BEFORE its shadow ray. So this is the reach of the
// lights themselves -- the set of air the feature could possibly light.
//
// Its whole value is the pair with lampshaft-vis, which paints the same thing
// after the shadow ray. Red here and not there is an OCCLUDER, and that is the
// one distinction the final image can never make: a beam missing because nothing
// reaches the cell and a beam missing because a ceiling is in the way look
// identical. Two ladders in this project were run against composed images that
// could not separate them (AGENTS.md, "Something casts no shadow").
