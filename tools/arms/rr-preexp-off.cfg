// ab arm: rr-preexp-off -- THE BEFORE. DLSS-RR on the old frame order:
// CmPrepareFinal bakes EV100 auto-exposure and the screen emissive into the
// image BEFORE the upscaler, and RR denoises that post-exposure color while
// told InPreExposure=1.0. Identical to rr-preexp-on except the one moved value.
//
// READ THE ARM BACK: rt-console.log must print
//   Denoiser path: DLSS-RR (...) preExposure=off (baked in CmPrepareFinal)
//
// Self-contained: every RR-relevant value stated (ab-cvars-must-not-persist).
rt_upscale_dlss 2
rt_upscale_fsr2 0
rt_rayreconstr 1
rt_framegen 0
rt_sharpen 0
rt_dlss_preset 5
rt_rr_preset 5
rt_nrd 0
rt_nrd_validation 0
rt_nrd_maxaccum 0
rt_nrd_fastaccum 0
rt_nrd_atrous 0
rt_nrd_prepass_diff 0
rt_nrd_prepass_spec 0
rt_nrd_philum 0
rt_nrd_minhitdist 0
rt_nrd_antifirefly 1
// THE ONE MOVED VALUE
rt_rr_preexposure 0
rt_rr_preexp_debug 0
// Contract-redo features pinned OFF in BOTH preexp arms so this pair still
// moves ONE value (the reorder alone). The full contract is rr-full.
rt_rr_exptex 0
rt_rr_translayer 0
rt_rr_glowpre 0
rt_rr_glowscale 35
rt_rr_restir_mcap -1
// rt_rr_* held at shipping values so pre-exposure moves ONE thing.
rt_rr_temporal 0
rt_rr_disocc 1
rt_rr_disocc_ratio 3.0
rt_rr_disocc_mindelta 0.01
rt_rr_disocc_show 0
rt_rr_firefly 0
rt_rr_firefly_minlum 0.01
rt_rr_spechitdist 1
rt_rr_guide_mode 1
rt_rr_guide_min 0.01
rt_rr_reset_on_lightcut 1
rt_rr_reset_on_dynlight 1
rt_rr_reset_delta 0.5
rt_rr_reset_min_ms 250
rt_rr_reset_hold 0
rt_rr_reset_now 0
rt_rr_reset_debug 0
// Signal quality upstream of RR, held at shipping values -- state every one
// (a "tested" knob was once stuck at an A/B value for days).
rt_restir_bluenoise 1
rt_restir_tjitter 2.0
rt_restir_indir_antilag 1
rt_restir_initial 32
rt_restir_spatial 8
rt_restir_spatial_radius 30
rt_restir_mcap 20
rt_shadow_samples 1
rt_spp_direct 1
rt_spp_indirect 1
rt_mip_bias 0
// Auto-exposure must RUN for this A/B to mean anything -- stock range. If
// these were narrowed, both arms would look identical and prove nothing.
rt_tnmp_ev100_min 2.0
rt_tnmp_ev100_max 7.7


