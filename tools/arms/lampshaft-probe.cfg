// ab lampshaft arm: lampshaft-probe -- IS THE UNIFORM ARRIVING. Yes or no.
//
// rt_volume_shaft_debug 3: every froxel in the volume is painted GREEN whenever
// the shaft list is non-empty. No position test, no visibility test, no
// magnitude -- it reads the count and nothing else.
//
//   screen goes green -> the list, the ID resolution and the uniform are all
//                        live. Anything still invisible is a VALUE problem;
//                        go to lampshaft-fat.
//   screen unchanged  -> either nothing qualified (relaunch with
//                        `-- +rt_volume_shaft_verbose 1` for the count) or the
//                        uniform is not reaching the shader. Nothing downstream
//                        is worth testing until this paints.
//
// NOT A LOOK. This is deliberately unmissable and hideous.
