// ab lampshaft arm: lampshaft-probe -- IS THE UNIFORM ARRIVING. Yes or no.
//
// rt_volume_shaft_debug 3: every froxel in the volume is painted GREEN whenever
// the shaft list is non-empty. No position test, no visibility test, no
// magnitude -- it reads the count and nothing else.
//
//   screen goes green -> the list, the ID resolution and the uniform are all
//                        live. Anything still invisible is a VALUE problem;
//                        go to lampshaft-fat.
//   screen unchanged  -> either nothing qualified (check the rt_volume_shafts
//                        console line -- verbose is on in every arm here) or the
//                        uniform is not reaching the shader. Nothing downstream
//                        is worth testing until this paints.
//
// NOT A LOOK. This is deliberately unmissable and hideous.
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_moon_presets 1
rt_flsh 0
rt_volume_type 1
rt_volume_far 60
rt_volume_scatter 1
rt_volume_ambient 0.2
rt_volume_lintensity 1
rt_volume_lassymetry 0.5
rt_volume_history 8
rt_volume_dither 5
rt_volume_dither_z 1
rt_volume_blur 1
rt_volume_occlude_emis 1
rt_ceiling_lamps 0
rt_ceiling_lamp_intensity 0
rt_ceiling_edge_lamps 1
rt_faux_lamps 1
rt_solo_lamps 1
rt_ceiling_bulb_gain 7
rt_ceiling_bulb_emis 20
rt_smoke 1
rt_volume_shafts 1
rt_volume_shaft_src 7
rt_volume_shaft_max 16
rt_volume_shaft_trace 3
rt_volume_shaft_mult 1
rt_volume_shaft_nearfade 1.5
rt_volume_shaft_mincontrib 0
rt_volume_shaft_asym -2
rt_volume_shaft_maxdist 1024
rt_volume_shaft_mingap 96
rt_volume_shaft_minint 0
rt_volume_shaft_debug 3
rt_volume_shaft_verbose 1
