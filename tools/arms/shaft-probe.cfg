// ab shaft arm: shaft-probe -- IS THE KNOB CONNECTED AT ALL. Answer yes or no.
//
// rt_volume_dither_z 40, which is deliberately absurd: 40 froxels at
// rt_volume_far 60's 0.94 m slices is a mean shortfall of
//
//   0.33 * 40 * 0.94 = 12.5 m,  worst case 37.5 m of a 60 m volume
//
// i.e. most of every froxel column never gets integrated. The volumetric medium
// should visibly COLLAPSE -- shafts gone, haze gone, the screen noticeably
// cleaner and flatter than any other arm in this family.
//
// This exists because shaft-stock and shaft-bias reportedly look identical, and
// a null result is worth nothing until the value is proven live
// (docs/moon-and-sky-leaks.md S7 -- three separate silent value collapses have
// produced exactly this symptom here: a bool cvar eating an int mode, an RTGL
// `> 0.5f ? 1 : 0` eating it again, and the code sitting in a shader the effect
// does not use). It is the same philosophy as rt_smoke_debug 4: far past
// "visible", because the point is to answer a yes/no question, not to look like
// anything.
//
//   screen changes visibly  -> the uniform reaches the shader. The knob works,
//                              the range 0..5 is simply too small to see, and
//                              the depth bias is NOT what cut the shafts off.
//                              Go to shaft-iso next.
//   screen does not change  -> the plumbing is dead between rt_volume_dither_z
//                              and CmScatterAccum.comp, and every other result
//                              in this family is meaningless. Say so and stop.
//
// NOT A LOOK. Do not judge shaft quality here.
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_moon_presets 1
rt_flsh 0
rt_volume_type 1
rt_volume_far 60
rt_volume_scatter 1
rt_volume_ambient 0.2
rt_volume_lintensity 1
rt_volume_lassymetry 0.5
rt_volume_history 8
rt_volume_dither 5
rt_volume_dither_z 40
rt_volume_blur 1
rt_volume_occlude_emis 1
rt_ceiling_bulb_gain 7
rt_ceiling_bulb_emis 20
rt_smoke 1
