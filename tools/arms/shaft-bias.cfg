// ab shaft arm: shaft-bias -- THE UPPER BOUND. rt_volume_dither_z 0.
//
// No depth jitter at all, so no shortfall at all: the volume is sampled at the
// surface's own froxel and every column is integrated in full. This is the most
// reach the fix can possibly buy, and it exists to bound the effect rather than
// to ship.
//
// READ IT AS AN ARITHMETIC CHECK, not as a look. Against shaft-stock the
// difference should be about 1.56 m of beam near the camera and up to 4.7 m at
// the tail. If shaft-bias and shaft-stock look the SAME, the depth bias is not
// the carrier and this whole family is the wrong tree -- go to
// rt_volume_lassymetry next (0.5 is a 34x swing in phase response between
// looking along the beam and across it, which is the other way a shaft can read
// as dying along its length), and note that the two are separable because the
// phase term depends on view ANGLE while this one depends on view DISTANCE.
//
// NOT A CANDIDATE TO SHIP: at 0 the depth quantisation is unhidden, so the
// volume's 64 slices show as concentric banding in any low-contrast medium --
// fog especially, where the bands are the whole screen. That is exactly what the
// depth dither is for, and one froxel of it (shaft-now) is enough.
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_moon_presets 1
rt_flsh 0
rt_volume_type 1
rt_volume_far 60
rt_volume_scatter 1
rt_volume_ambient 0.2
rt_volume_lintensity 1
rt_volume_lassymetry 0.5
rt_volume_history 8
rt_volume_dither 5
rt_volume_dither_z 0
rt_volume_blur 1
rt_volume_occlude_emis 1
rt_ceiling_bulb_gain 7
rt_ceiling_bulb_emis 20
rt_smoke 1
