// ab arm: title-sunonly -- the moon alone, turned up, everything else off.
//
//   .\tools\ab.cmd title-sunonly menu
//
// Maximum contrast for the one question that matters: with a single strong
// directional light and no fill of any kind, does a 64MarineBot cast a shadow?
// A sprite shadow either appears here or the sprite is not in the acceleration
// structure -- there is no third option once the fill is gone, because a shadow
// is only ever visible in proportion to how much of the local light it blocks.
//
// intensity 400 against the pins' 90, because at 90 with the dome, the sector
// emissives and 80-odd map lights all contributing, a thin sprite's shadow is a
// few percent of the light at that pixel and the denoiser will not keep it.
//
// If the marines cast here and the buildings cast here, the answer is CONTRAST,
// not geometry: the shadow exists in play too and is being buried by fill light
// (and then smeared by the temporal denoiser -- see title-sharp).
//
// If the buildings cast and the marines still do not, the sprite is genuinely
// absent from the acceleration structure, and the next move is
// `+rt_prim_debug 1` reading the CONSOLE, not the screen -- it prints which
// textures RTGL1 rasterizes instead of tracing, and a rasterized primitive can
// never block a shadow ray.
//
// One-off worth trying on top, since the title map's sky may not be real F_SKY1
// geometry and the probe would then reject the moon everywhere:
//
//   .\tools\ab.cmd title-sunonly menu -- +rt_sun_require_sky 0
//
rt_sun 1
rt_sun_intensity 400
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sun_angdiam 0.5
// no fill of any kind
rt_sky 0
rt_sector_emis 0
rt_emis_mapboost 0
rt_dynlight 0
rt_sector_lights 0
rt_ceiling_lamps 0
rt_ceiling_edge_lamps 0
rt_wall_strips 0
rt_hang_lamps 0
rt_solo_lamps 0
rt_spin_panels 0
rt_switch_lights 0
rt_flame_light_on 0
rt_lava_light_on 0
rt_flsh 0
rt_gunglow 0
rt_mzlflsh 0
