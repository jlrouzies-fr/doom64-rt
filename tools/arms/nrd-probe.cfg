// ab arm: nrd-probe -- NOW STAGE 2: rt_nrd 1 runs NRD/ReLAX as the actual
// denoiser (pack -> DenoiseVK -> compose), replacing A-SVGF for the session.
// The image is EXPECTED to differ from rr-asvgf now -- that difference is the
// A/B. Everything downstream is the stock A-SVGF frame shape (exposure baked,
// glow before the upscaler, DLSS-SR reconstructing), so none of the RR lane's
// exposure/glow/reset problems can appear here by construction.
//
// READ THE ARM BACK (rt-console.log):
//   NRD: instance ALIVE ... Stage 2 active: ReLAX is the denoiser
//
// WHAT TO JUDGE vs rr-asvgf, in play, in motion: overall noise at 1 spp,
// dark-dot pattern, flashlight toggles (should behave EXACTLY like A-SVGF --
// same reset-free machinery), emissive edges (glow is pre-upscaler here, so
// no shimmer class exists), motion stability, and specular quality (ReLAX
// has real hit-distance reprojection; A-SVGF does not).
//
// Self-contained: every denoiser-relevant value stated (ab-cvars-must-not-persist).
rt_upscale_dlss 2
rt_upscale_fsr2 0
rt_rayreconstr 0
rt_framegen 0
rt_sharpen 0
rt_dlss_preset 5
rt_rr_preset 5
// THE PROBE
rt_nrd 1
rt_nrd_validation 0
rt_nrd_maxaccum 0
rt_nrd_fastaccum 0
rt_nrd_atrous 0
rt_nrd_prepass_diff 0
rt_nrd_prepass_spec 0
rt_nrd_philum 0
rt_nrd_minhitdist 0
rt_nrd_antifirefly 1
// Inert here (RR off) -- stated at rr-full's values.
rt_rr_preexposure 1
rt_rr_exptex 1
rt_rr_translayer 1
rt_rr_glowpre 0
rt_rr_glowscale 1
rt_rr_demod 1
rt_rr_demod_filter 1
rt_rr_restir_mcap 4
rt_rr_preexp_debug 0
rt_rr_temporal 0
rt_rr_disocc 1
rt_rr_disocc_ratio 3.0
rt_rr_disocc_mindelta 0.01
rt_rr_disocc_show 0
rt_rr_firefly 0
rt_rr_firefly_minlum 0.01
rt_rr_spechitdist 1
rt_rr_guide_mode 1
rt_rr_guide_min 0.01
rt_rr_reset_on_lightcut 1
rt_rr_reset_on_dynlight 1
rt_rr_reset_delta 0.5
rt_rr_reset_min_ms 250
rt_rr_reset_hold 0
rt_rr_reset_now 0
rt_rr_reset_debug 0
// Signal quality upstream, shipping values.
rt_restir_bluenoise 1
rt_restir_tjitter 2.0
rt_restir_indir_antilag 1
rt_restir_initial 32
rt_restir_spatial 8
rt_restir_spatial_radius 30
rt_restir_mcap 20
rt_shadow_samples 1
rt_spp_direct 1
rt_spp_indirect 1
rt_mip_bias 0
rt_tnmp_ev100_min 2.0
rt_tnmp_ev100_max 7.7

