// ab arm: nrd-probe -- STAGE-1 LIVENESS PROBE for the NRD lane. Identical to
// rr-asvgf (A-SVGF is still the active denoiser; NRD's Denoise() data path is
// not wired yet) plus rt_nrd 1, which brings the full NRD stack up: NRD
// compiled into RTGL1.dll, its embedded SPIR-V unpacked into pipelines, NRI
// wrapped around the live VkDevice, history pools allocated.
//
// THE IMAGE MUST NOT CHANGE. The verdict is one line in rt-console.log:
//   NRD: instance ALIVE at WxH -- ReBLUR+ReLAX+SIGMA created, ... pools N MB
// or, if the stack failed:
//   NRD: NRDIntegration RecreateVK FAILED (code) ...
// No line at all = rt_nrd never reached RTGL (plumbing break -- report it).
//
// Self-contained: every denoiser-relevant value stated (ab-cvars-must-not-persist).
rt_upscale_dlss 2
rt_upscale_fsr2 0
rt_rayreconstr 0
rt_framegen 0
rt_sharpen 0
rt_dlss_preset 5
rt_rr_preset 5
// THE PROBE
rt_nrd 1
// Inert here (RR off) -- stated at rr-full's values.
rt_rr_preexposure 1
rt_rr_exptex 1
rt_rr_translayer 1
rt_rr_restir_mcap 4
rt_rr_preexp_debug 0
rt_rr_temporal 0
rt_rr_disocc 1
rt_rr_disocc_ratio 3.0
rt_rr_disocc_mindelta 0.01
rt_rr_disocc_show 0
rt_rr_firefly 0
rt_rr_firefly_minlum 0.01
rt_rr_spechitdist 1
rt_rr_guide_mode 1
rt_rr_guide_min 0.01
rt_rr_reset_on_lightcut 1
rt_rr_reset_on_dynlight 1
rt_rr_reset_delta 0.5
rt_rr_reset_min_ms 250
rt_rr_reset_hold 0
rt_rr_reset_now 0
rt_rr_reset_debug 0
// Signal quality upstream, shipping values.
rt_restir_bluenoise 1
rt_restir_tjitter 2.0
rt_restir_indir_antilag 1
rt_restir_initial 32
rt_restir_spatial 8
rt_restir_spatial_radius 30
rt_restir_mcap 20
rt_shadow_samples 1
rt_spp_direct 1
rt_spp_indirect 1
rt_mip_bias 0
rt_tnmp_ev100_min 2.0
rt_tnmp_ev100_max 7.7
