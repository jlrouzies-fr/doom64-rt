// ab firesky arm: firesky-fat -- THE ABSURD ARM. RUN THIS ONE FIRST.
//
// Embers 30x as thick and 3x the size, strikes every 1-2 seconds held twice as
// long and every one aimed at your face, and the deck passing double the light.
// It should be unmistakably, unpleasantly busy.
//
//   ab.cmd firesky-fat 23
//
// WHY IT EXISTS. "I don't see any embers" has two causes that look identical
// from a screenshot -- too small or too rare to notice, and never reached the
// draw at all -- and only a setting far past reasonable separates them. This is
// lampshaft-fat's job, and dust-fat's, for the fire sky. Every subtle arm here
// is worthless until this has been seen to do something.
//
// IF THIS SHOWS NOTHING, stop tuning and read the `rt_firesky:` line in
// rt-console.log. It prints the DECK AND MOON AS THEY ACTUALLY ARE after the
// level finished loading, not what the mode asked for, which is the only way
// to tell these apart:
//
//   no rt_firesky line   -- the mode is off. The master cvar never arrived.
//   deck OFF             -- something re-applied the preset tables after it.
//   deck ON, sky is dark -- the draw, or a stale d64r-rt-sky.pk3.
//
// AND STAND OUTSIDE. Embers spawn only under a sector whose ceiling is F_SKY1.
// In a corridor the correct behaviour is none at all.
rt_fireskies_new 1
rt_firesky_dome 1
rt_firesky_clouds 1
rt_firesky_cloud_horizon 3.5
rt_firesky_cloud_wind 0.008
rt_firesky_cloud_transmit 0.9
rt_firesky_moon 1
rt_firesky_moon_intensity 140
rt_firesky_embers 1
rt_firesky_ember_rate 40
rt_firesky_ember_life 7
rt_firesky_ember_size 0.14
rt_firesky_ember_fall 0.3
rt_firesky_ember_radius 20
rt_firesky_ember_height 22
rt_firesky_ember_floor 6
rt_firesky_strikes 1
rt_firesky_strike_min 3
rt_firesky_strike_max 5
rt_firesky_flash 0.55
rt_firesky_strike_intensity 900
rt_firesky_fireback 1.0
rt_firesky_underlit 0.15


rt_firesky_strike_boltmin 0.05
rt_firesky_strike_aim 1.0
rt_lightning 1
rt_lightning_bolt 1
rt_spark 1
rt_spark_glow 1
rt_moon_presets 1
rt_clouds_presets 1
