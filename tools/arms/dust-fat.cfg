// ab dust arm: dust-fat -- RUN THIS FIRST. Is dust being drawn at all?
//
// THE ABSURD ARM, and not a look: motes ten times their shipping angular size,
// four times the density, the full cap, and reach out to 20 m. Any lit room
// should be visibly full of floating chips -- unpleasantly so.
//
// It exists because a dust mote is SMALL and "I cannot see any" has two causes
// that look identical: it is not being drawn, or it is being drawn at a fifth of
// a pixel. Only an unmissable size separates them, and every subtle judgement
// about density or colour is worthless until this has been seen to do something.
// Same reason lampshaft-fat and rt_smoke_debug 4 exist.
//
//   the room fills with chips -> the batch is live and the shipping size is the
//                                only question. Go to dust-on.
//   nothing at all            -> the primitive is not reaching the scene.
//                                Relaunch with `-- +rt_dust_debug 1` and read the
//                                mote count before touching any value.
