// ab moon arm: moon-dark -- IS IT THE SHAFT, OR THE ROOM AROUND IT?
//
// rt_ceiling_bulb_gain 7 -> 0 and rt_ceiling_bulb_emis 20 -> 0. Everything about
// the volume is left at today's shipping values.
//
// The lamp-ceiling work (docs/rt-smoke.md S3.2a) landed in the same stretch as
// the smoke: SFLATAQ/SFLATAS panes now get a real point light in every painted
// bulb socket AND keep their full painted glow. MAP01's halls are lamp-ceiling
// halls, so they are brighter than they were -- and a shaft of fixed brightness
// against a brighter room reads weaker without anything having happened to the
// shaft.
//
// This arm separates the two. Shafts unchanged here -> the room's brightness is
// not the story and the volume arms own the answer. Shafts obviously back ->
// part of the report is contrast, and the fix is partly a bulb-gain trim rather
// than a density one.
//
// It is a DIAGNOSTIC, not a candidate: shipping it would put the lamp ceilings
// back to being unlit panes, which is the bug that work fixed.
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_moon_presets 1
rt_flsh 0
rt_volume_type 1
rt_volume_far 60
rt_volume_scatter 1
rt_volume_ambient 0.2
rt_volume_lintensity 1
rt_volume_lassymetry 0.5
rt_volume_history 8
rt_volume_dither 5
rt_volume_blur 1
rt_volume_occlude_emis 1
rt_ceiling_bulb_gain 0
rt_ceiling_bulb_emis 0
rt_smoke 1
