// ab shaft arm: shaft-iso -- THE OTHER WAY A SHAFT DIES ALONG ITS LENGTH.
//
// rt_volume_lassymetry 0.5 -> 0. Nothing else moves.
//
// THE HYPOTHESIS. A shaft is not a fixed brightness that falls off with
// distance; it is scattering weighted by the angle between the light and your
// eye, and that angle CHANGES ALONG THE BEAM even though the light is
// directional. RtVolumetric.rgen:
//
//   phaseFunction_Schlick( -lightdir, toviewer, volumeAsymmetry )
//     = (1 - k^2) / (4*pi*(1 + k*costheta)^2),   k = 1.55a - 0.55a^3
//
// At a 0.5, k = 0.706 and that function is steep:
//
//   costheta  -1.0   -0.5    0.0   +1.0        (looking into the beam -> across)
//   phase     0.462  0.096  0.080  0.0137      a 34x range end to end
//
// tolight is constant, toviewer is not, so froxels at one end of a raking beam
// are weighted several times harder than froxels at the other. On MAP13 the
// moon is at altitude 25 -- a low, raking beam, which is the worst case for
// this, because the view direction swings furthest along its length.
//
// At a 0 the phase is a flat 1/(4*pi) = 0.0796 everywhere, so the beam is
// weighted IDENTICALLY along its whole length.
//
//   the shaft reads EVEN end to end here  -> the phase function is the carrier.
//        The fix is a value between (0.2-0.3), not 0: the forward peak is also
//        what makes a shaft read as a shaft rather than as uniform haze, and
//        docs/moon-and-sky-leaks.md S5.4's "fine looking up at the moon,
//        invisible from in front" observation is that same peak doing its job.
//   no change                             -> not the phase either. Then it is
//        the prefix-sum path length itself: a ray that crosses the beam near
//        where the beam meets the floor spends almost no distance inside it, so
//        the shaft's ground contact is genuinely faint, and the answer is
//        rt_volume_scatter / rt_volume_lintensity rather than a bug.
//
// VIEW IT ACROSS THE BEAM. Along the beam this arm will look WORSE (the forward
// peak is what was carrying that view) and that is expected, not a regression --
// the question is whether the far end of the beam catches up with the near end.
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_moon_presets 1
rt_flsh 0
rt_volume_type 1
rt_volume_far 60
rt_volume_scatter 1
rt_volume_ambient 0.2
rt_volume_lintensity 1
rt_volume_lassymetry 0
rt_volume_history 8
rt_volume_dither 5
rt_volume_dither_z 1
rt_volume_blur 1
rt_volume_occlude_emis 1
rt_ceiling_bulb_gain 7
rt_ceiling_bulb_emis 20
rt_smoke 1
