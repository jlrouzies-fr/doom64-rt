// ab lampshaft arm: lampshaft-iso -- IS THE FORWARD BIAS CARRYING THE SHAFT?
//
// rt_volume_shaft_asym 0, i.e. isotropic scattering for the LAMP shafts only --
// the moon keeps rt_volume_lassymetry 0.5 and its shafts are untouched, which is
// the entire reason the two knobs were split.
//
// EXPECT IT TO BE DIMMER, NOT FLATTER, and do not read that as a bug. The same
// experiment was run on the moon and is written up in
// docs/moon-and-sky-leaks.md 5.5: the phase function's forward peak is what
// carries a shaft, so removing it removes the shaft. The answer to a shaft that
// reads unevenly is never lower asymmetry.
//
// What this arm is actually for: telling a real beam from a symmetric glow
// around a bulb. A real beam collapses here. A glow does not.
