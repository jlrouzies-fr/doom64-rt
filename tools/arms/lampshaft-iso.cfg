// ab lampshaft arm: lampshaft-iso -- IS THE FORWARD BIAS CARRYING THE SHAFT?
//
// rt_volume_shaft_asym 0, i.e. isotropic scattering for the LAMP shafts only --
// the moon keeps rt_volume_lassymetry 0.5 and its shafts are untouched, which is
// the entire reason the two knobs were split.
//
// EXPECT IT TO BE DIMMER, NOT FLATTER, and do not read that as a bug. The same
// experiment was run on the moon and is written up in
// docs/moon-and-sky-leaks.md 5.5: the phase function's forward peak is what
// carries a shaft, so removing it removes the shaft. The answer to a shaft that
// reads unevenly is never lower asymmetry.
//
// What this arm is actually for: telling a real beam from a symmetric glow
// around a bulb. A real beam collapses here. A glow does not.
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_moon_presets 1
rt_flsh 0
rt_volume_type 1
rt_volume_far 60
rt_volume_scatter 1
rt_volume_ambient 0.2
rt_volume_lintensity 1
rt_volume_lassymetry 0.5
rt_volume_history 8
rt_volume_dither 5
rt_volume_dither_z 1
rt_volume_blur 1
rt_volume_occlude_emis 1
rt_ceiling_lamps 0
rt_ceiling_lamp_intensity 0
rt_ceiling_edge_lamps 1
rt_faux_lamps 1
rt_solo_lamps 1
rt_ceiling_bulb_gain 7
rt_ceiling_bulb_emis 20
rt_smoke 1
rt_volume_shafts 1
rt_volume_shaft_src 7
rt_volume_shaft_max 16
rt_volume_shaft_trace 3
rt_volume_shaft_mult 1
rt_volume_shaft_nearfade 1.5
rt_volume_shaft_falloff 1
rt_volume_shaft_relcull 0.05
rt_volume_shaft_mincontrib 0
rt_volume_shaft_asym 0
rt_volume_shaft_maxdist 1024
rt_volume_shaft_mingap 96
rt_volume_shaft_minint 0
rt_volume_shaft_debug 0
rt_volume_shaft_verbose 1
