// ab moon arm: moon-sharp -- HOW MUCH OF THE SOFTNESS IS THE SMOOTHING PINS.
//
// rt_volume_dither 5 -> 2 and rt_volume_blur 1 -> 0. Both were raised during the
// smoke work to settle the volume's noise, and both smooth the shaft as readily
// as they smooth a puff.
//
// rt_volume_dither IS MEASURED IN FROXELS, and the froxels doubled in length
// when rt_volume_far went to 60. So 2 froxels at 0.47 m was ~0.94 m of depth
// jitter and 5 froxels at 0.94 m is ~4.7 m -- a five-fold increase in how far a
// shaft's sample is smeared along the view, from one pin change plus another
// pin's side effect. That compounding is why this arm exists separately from
// moon-far30.
//
// rt_volume_blur is the 5-tap screen-plane filter in volume_sampleDithered
// (Volumetric.h). Note the identically-named attempt inside CmVolumetricProcess
// does NOT work and the comment there says why -- do not move it back.
//
// Judge this one MOVING as well as standing: both knobs exist because the volume
// has no denoiser of its own, so turning them down buys edge definition and pays
// in boil. If this arm is the one that fixes the shafts, the answer is a value
// between, not 0.
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_moon_presets 1
rt_flsh 0
rt_volume_type 1
rt_volume_far 60
rt_volume_scatter 1
rt_volume_ambient 0.2
rt_volume_lintensity 1
rt_volume_lassymetry 0.5
rt_volume_history 8
rt_volume_dither 2
rt_volume_dither_z 1
rt_volume_blur 0
rt_volume_occlude_emis 1
rt_ceiling_bulb_gain 7
rt_ceiling_bulb_emis 20
rt_smoke 1
