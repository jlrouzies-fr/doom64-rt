// ab arm: title-max -- title-sharp WITHOUT the native-resolution part.
//
//   .\tools\ab.cmd title-max menu
//
// title-sharp (samples 8 + spp_direct 4 + native) restored the marine shadows.
// title-samples (samples 8 alone) kept "a bit". title-native (native alone) did
// not. So the missing ingredient is rt_spp_direct -- and that is diagnostic, not
// just a setting, because of WHERE the variance is.
//
// RaygenCommon.h ~493: the directional light gets its own reservoir and is then
// merged into the regular-lights reservoir STOCHASTICALLY --
// updateCombinedReservoir(combined, dirLightReservoir, rnd). One light wins per
// pixel. With the moon at intensity 90 against this map's lamps and emissives,
// the moon wins that lottery on a minority of pixels, so its shadow is resolved
// on a sparse random subset of the image. rt_shadow_samples cannot help there:
// it averages visibility for the light ALREADY CHOSEN (reservoir.selected), so
// it sharpens the moon's shadow only on the pixels that picked the moon.
// rt_spp_direct is the one that takes N INDEPENDENT estimates, i.e. N more
// chances for the moon to be picked at all.
//
// So if this arm restores the shadows at DLSS balanced, the cause is confirmed
// as LIGHT-SELECTION variance rather than visibility noise or upscaling -- and
// that matters, because selection variance has a proper fix that costs one ray
// instead of four (see the note in the reply: split the directional light out of
// the combined reservoir and shade it deterministically, which is what most
// path tracers do with a sun).
//
// Not a shipping candidate: spp_direct 4 costs an extra shadow ray per sample
// across the WHOLE image, for a problem that only concerns one light.
rt_shadow_samples 8
rt_spp_direct 4
rt_spp_indirect 1
rt_restir_initial 16
rt_upscale_dlss 2
rt_rayreconstr 0
// play lighting, unchanged
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_flsh 0
