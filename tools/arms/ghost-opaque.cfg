// ab arm: ghost-opaque -- the see-through monsters as SOLID as their alpha goes,
// with their glowing eyes intact. The high end of the tuning ladder.
//
//   .\tools\ab.cmd ghost-faint  03      alpha 0.10
//   .\tools\ab.cmd ghost-opaque 03      alpha 1.00
//
// Both arms are the SHIPPING mechanism (rt_ghost_emis_split 1) and differ only in
// the two alpha cvars, 10x apart. Use them to pick a value, then that value
// becomes the pin.
//
// READ THIS FIRST IF YOU RAN THESE BEFORE 2026-08-14. They used to look
// identical, and that was the bug, not the arms: the eye mask's emissiveMult put
// the body in RTGL1's ADDITIVE pipeline (SRC_ALPHA / ONE), which cannot occlude
// anything at any alpha. The body now blends normally, so these two are very far
// apart -- 1.00 is a nearly solid monster.
//
// WHAT TO LOOK AT. MAP03 has 21 nightmare imps, MAP13 has 41. Judge on a LIT
// floor, standing in the SAME spot for both runs: rt_ghost_lightscale multiplies
// the final alpha by room brightness (0.84 where the last log was taken), so
// moving between runs changes the number you are comparing.
//
// Watch the BODY. The eyes are on the ONE,ONE emission attachment and never read
// alpha, so they are identical in both arms by construction -- if the eyes look
// different between these two, something is wrong with the split, not with the
// alpha. Both arms leave rt_ghost_debug 1 on, so rt-console.log carries packedA
// for each: expect ~214 here and ~21 in ghost-faint.
rt_nightmareimp_alpha 1.0
rt_spectre_alpha 1.0
// Everything else that touches a ghost's alpha, stated so neither arm can
// inherit it from the ini or from a previous arm.
rt_ghost_emis 1
rt_ghost_emis_split 1
rt_translucent_minalpha 0.72
rt_ghost_lightscale 1
rt_ghost_solid 0
rt_spectre_corpse_solid 1
rt_mod_compat 1
rt_ghost_debug 1
rt_upscale_dlss 2
rt_rayreconstr 0
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sky 25
rt_flsh 0
