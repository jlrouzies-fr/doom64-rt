// ab arm: vclouds -- the VOLUMETRIC clouds, at their shipping values.
//
// The master switch is the first setting below. Do not name a cvar in the
// comments here (see firesky-new.cfg for the script that once ate one).
//
//   ab.cmd vclouds 12        the storm map, moon-lit from above
//   ab.cmd vclouds 23        a fire sky: pair with firesky-new for the ground light
//
// Pair it with vclouds-off, which is the same maps on the shell deck.
//
// WHAT TO LOOK AT:
//
//   1. Do the clouds have an INTERIOR -- lit tops, dark undersides, edges
//      that thin out -- rather than one flat colour per shell?
//   2. Does the moon DIM behind dense cloud, and do its shafts come and go
//      with it? That is the CPU twin of the field doing its job.
//   3. Turn the camera fast with a monster in front of the sky: NO smear,
//      no stamp. The history is keyed by direction, not by screen pixel.
//   4. Does thunder strike INSIDE cloud (rt_lightning_debug 1 prints the
//      coverage it found)?
//
// The debug view paints the map: 1 = transmittance, 2 = density only.
rt_clouds_volumetric 1
rt_vclouds_altitude 600
rt_vclouds_thick 500
rt_vclouds_coverage 0.55
rt_vclouds_density 0.03
rt_vclouds_feature 500
rt_vclouds_detail 0.5
rt_vclouds_wind 6
rt_vclouds_steps 32
rt_vclouds_lightsteps 6
rt_vclouds_light 100
rt_vclouds_under 0
rt_vclouds_ambient 0.06
rt_vclouds_asym 0.3
rt_vclouds_horizon 4
rt_vclouds_history 0.8
rt_vclouds_flash 0.15
rt_vclouds_debug 0
rt_clouds 1
rt_clouds_presets 1
rt_moon_presets 1
rt_vclouds_sunshadow 1
rt_vclouds_back 0
rt_vclouds_fire 0
rt_vclouds_fire_scale 300
rt_vclouds_fire_cover 0.25
rt_vclouds_fire_lit 1
rt_vclouds_layers 1
rt_vclouds_gap 0.25
rt_vclouds_sheet_ext 0.3
rt_vclouds_fire_pulse 0.5
rt_vclouds_fire_pulse_speed 1
rt_vclouds_fire_flicker 0.2
rt_vclouds_cascade 0
rt_vclouds_cascade_len 400
rt_vclouds_cascade_cover 0.3
rt_vclouds_cascade_speed 80
rt_vclouds_cascade_width 40
