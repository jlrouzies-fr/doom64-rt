// ab arm: preset-j -- DLSS render preset 10
// Transformer, the other one. 'Might exhibit slightly less ghosting at the cost of extra flickering. Preset K is generally recommended over J.'
//
// Self-contained. rt_dlss_preset is NOARCH so it cannot leak between runs, but
// the upscaler cvars around it are CVAR_ARCHIVE and would otherwise inherit
// whatever the last arm left in the ini -- and "which upscaler was running" is
// the whole variable here.
rt_upscale_dlss 2
rt_upscale_fsr2 0
rt_rayreconstr 0
rt_framegen 0
rt_sharpen 0
rt_dlss_preset 10

// The volumetric side held fixed at the shipping values, so this arm moves ONE
// thing. rt_volume_edgesoft 2 stays ON: it removes the silhouette half of the
// artefact (doc S7.3) and what is being judged here is what it leaves behind.
rt_volume_edgesoft 2
rt_volume_edgesoft_edge 0.05
rt_volume_ubias 0
rt_volume_ubias_debug 0
rt_volume_postcomp 0
