// ab dust arm: dust-only -- DUST INSIDE BEAMS AND NOWHERE ELSE.
//
// rt_dust_shaft_floor 0. A mote outside a shaft has zero albedo, so the only
// dust in the level is the dust a beam is shining through.
//
// The upper bound of the gate, and worth seeing once: it is probably too clean.
// Real air has dust in it everywhere and the beam merely reveals more of it, so
// a hard zero tends to read as a special effect switching on. If 0.08 looks too
// hazy, the answer is somewhere between this and it -- not below it.
rt_sun 1
rt_sun_intensity 90
rt_sun_require_sky 1
rt_sun_leak_debug 0
rt_sky 25
rt_moon_presets 1
rt_flsh 0
rt_volume_type 1
rt_volume_far 60
rt_volume_scatter 1
rt_volume_ambient 0.2
rt_volume_lintensity 1
rt_volume_lassymetry 0.5
rt_volume_history 8
rt_volume_dither 5
rt_volume_dither_z 1
rt_volume_blur 1
rt_volume_occlude_emis 1
rt_ceiling_lamps 0
rt_ceiling_lamp_intensity 0
rt_ceiling_edge_lamps 1
rt_faux_lamps 1
rt_solo_lamps 1
rt_ceiling_bulb_gain 7
rt_ceiling_bulb_emis 20
rt_smoke 1
rt_volume_shafts 1
rt_volume_shaft_src 7
rt_volume_shaft_bands 4
rt_volume_shaft_max 32
rt_volume_shaft_trace 4
rt_volume_shaft_mult 10
rt_volume_shaft_nearfade 1.5
rt_volume_shaft_falloff 0.5
rt_volume_shaft_relcull 0.05
rt_volume_shaft_mincontrib 0
rt_volume_shaft_asym -2
rt_volume_shaft_maxdist 1920
rt_volume_shaft_mingap 96
rt_volume_shaft_minint 0
rt_volume_shaft_debug 0
rt_volume_shaft_verbose 0
rt_dust 1
rt_dust_density 0.10
rt_dust_max 900
rt_dust_far 12
rt_dust_near 0.5
rt_dust_size 0.008
rt_dust_size_ang 0.0022
rt_dust_color C8C8C8
rt_dust_albedo 0.9
rt_dust_drift 0.35
rt_dust_speed 0.25
rt_dust_cone -0.25
rt_dust_variance 0.75
rt_dust_size_var 0.6
rt_dust_fade 0.25
rt_dust_shaft_floor 0
rt_dust_shaft_radius 2.5
rt_dust_moon 1
rt_dust_moon_weight 1.0
rt_dust_clip 1
rt_dust_debug 0
