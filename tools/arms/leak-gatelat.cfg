// ab leak arm: leak-gatelat -- WHAT IS LEFT AFTER THE GATE? The lateral smear.
//
// rt_volume_depthgate is ON and working; a small residual remains on one wall
// and was knowingly accepted. This arm is the one launch that says which of the
// two remaining mechanisms owns it, because they need different fixes.
//
// It is leak-gate with the LATERAL filters off and nothing else changed:
//   rt_volume_dither 0   the per-pixel jitter of the volume lookup, measured in
//                        FROXELS against a 160-column grid -- 5 froxels is ~3%
//                        of screen width, about +/-60 px at 1080p, temporally
//                        averaged into an effective blur.
//   rt_volume_blur 0     the 4-tap neighbour filter in volume_sampleDithered.
//
// rt_volume_dither_z and rt_volume_history stay at SHIPPING, unlike
// leak-nofilter: the depth axis is what the gate now owns, and dragging it in
// would confound the two.
//
//   residual GONE  -> the LATERAL SMEAR. The gate blacks out the cells behind
//                     the wall, but the jitter reads a NEIGHBOURING column --
//                     one that legitimately sees past the wall through a doorway
//                     or an edge -- and drags its value onto the wall pixel. The
//                     gate cannot reach that: it is a sample-time problem in
//                     volume_sampleDithered, not a volume-content one.
//   residual STAYS -> the FOOTPRINT MAX under-culling, which the gate does ON
//                     PURPOSE: volume_depthGate takes the maximum depth over the
//                     column's ~12x12 px footprint so air genuinely visible past
//                     a thin foreground edge survives, and the cost is that a
//                     column straddling a wall EDGE keeps its cells lit. Expect
//                     it at corners and silhouettes, not mid-wall. Measured on
//                     2026-08-15: this is the one that stayed, and tightening it
//                     was judged a worse trade than the residual.
//
// Expect visible froxel banding across the image -- that is what those two cvars
// hide, and it is not what is being judged. Look only at the wall.
