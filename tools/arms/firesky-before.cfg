// ab firesky arm: firesky-before -- the OLD values, kept runnable.
//
// rt_sky 1.2. This is what MAP22/24/28 shipped with until 2026-08-23, and
// MAP23/32 shipped with 2.7 -- run
// `.\tools\ab.cmd firesky-before 23 -- +rt_sky 2.7` for the green one.
//
// It exists so the change has a before. What it shows is the report that
// started this: a fire sky behind a path-traced level, emitting nothing.
//
// WHY IT WAS THAT LOW, and why the reasoning failed: the value was set for
// parity with the cloud families off a FULL-IMAGE mean radiance, measured at
// 953x the starfield. But 60% of that energy is in the art's bottom quarter and
// 0% in its top quarter -- it is a band at and below the horizon, which is the
// one part of the sky a Doom wall blocks. The 953x is real and the geometry
// never collects it, so dividing the multiplier by 21 to compensate left the
// maps with nothing. See docs/plan-fire-skies.md section 1.
//
// CONDITIONS -- identical to firesky-base, so the two differ in rt_sky only.
rt_moon_presets 0
rt_sun 0
rt_sun_intensity 0
rt_moon_geo 0
rt_clouds 0
rt_clouds_presets 0
rt_sky 1.2
rt_sky_saturation 1
rt_sky_stretch 1.2
rt_sky_always true
