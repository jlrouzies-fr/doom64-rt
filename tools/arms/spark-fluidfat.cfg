// ab arm: spark-fluidfat
// RUN THIS FIRST. The absurd arm: 10x the droplets, 4x the size, no gravity, so
// they hang where they were born. A droplet is small and short-lived, and "I
// cannot see any splash" has two causes that look identical on screen -- the
// hook never fired, or it fired and the result is below the threshold of
// noticing. This separates them in one launch. It is a PROBE, not a candidate.
//
// It does all of that through the rt_spark_fluid_* overrides, so the CONCRETE
// chips off the wall behind you stay their shipping size. It used to move
// rt_spark_debris_* instead, which fattened every class at once -- an arm that
// fattens the thing you are not looking at cannot isolate the thing you are.
//
// The surface probe is on, so every impact also prints what it landed on:
//   'D64W1_01' -> fluid (debris)
// No line at all on a water hit means the hook is still being gated out, which
// is a different bug from the splash being too small.
//
// Self-contained: every rt_spark_* value is stated, so no arm can inherit
// another's leftovers from the ini (they are CVAR_ARCHIVE).
// Applied with +exec AFTER tools/d64rt-pins.cfg, so these win.
rt_spark 1
rt_spark_count 8
rt_spark_life 5.0
rt_spark_speed 6.0
rt_spark_spread 38
rt_spark_gravity 11
rt_spark_drag 1.6
rt_spark_size 0.02
rt_spark_grid 0.03125
rt_spark_bright 2.0
rt_spark_max 2000
rt_spark_far 40
rt_spark_style 1
rt_spark_streak 2.5
rt_spark_collide 1
rt_spark_bounce 0.38
rt_spark_friction 0.28
rt_spark_rest 0.55
rt_spark_trace_max 24
rt_spark_debris 1
rt_spark_debris_count 6
rt_spark_debris_life 20
rt_spark_debris_speed 3.4
rt_spark_debris_size 0.05
rt_spark_debris_gravity 17
rt_spark_debris_bounce 0.22
rt_spark_debris_ao 1
rt_spark_debris_ao_strength 0.5
rt_spark_debris_ao_radius 1.0
rt_spark_debris_ao_dist 20
rt_spark_debris_ao_max 64
rt_spark_debris_rough 1.0
rt_spark_debris_metal 0.0
rt_spark_debris_tint 0.85
rt_spark_debris_albedo 0.30
rt_spark_debris_sat 3.0
rt_spark_light 1
rt_spark_light_intensity 180
rt_spark_light_life 0.18
rt_spark_light_max 12
rt_spark_glow 1
rt_spark_glow_max 8
rt_spark_glow_intensity 26
rt_spark_surface_debug 1
rt_spark_debug 0
rt_spark_fluid 1
rt_spark_fluid_color 1
rt_spark_fluid_albedo 0.6
rt_liquid_nopuff 1
rt_spark_fluid_count 10
rt_spark_fluid_size 4.0
rt_spark_fluid_life 4.0
rt_spark_fluid_speed 1.0
rt_spark_fluid_gravity 0.0
rt_spark_fluid_bounce 1.0
rt_spark_fluid_spread 1.6
