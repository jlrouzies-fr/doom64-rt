; Minimal config for unattended launches (skips IWAD "Launch" dialog, windowed).
; Used via: -config G:\AI\Doom64-RT\tools\gzdoom-auto.ini
[IWADSearch.Directories]
Path=D:\Games\GZDoom
Path=$PROGDIR
Path=$DOOMWADDIR

[GlobalSettings]
queryiwad=false
queryiwad_key=shift
vid_fullscreen=false
vid_maxfps=0
