// Loadout for A/B runs, exec'd LAST by tools\ab.cmd.
//
// WHY THIS IS A FILE WITH A `wait` IN IT rather than two lines next to `god` in
// d64rt-pins.cfg. That was tried and it does not work.
//
// In the source the two cheats are the same shape -- CCMD(god) and CCMD(give)
// are both CheckCheatmode() followed by Net_WriteByte(DEM_*), going out through
// the same network command queue (c_cmds.cpp:118 and :444). So there is no
// structural reason to expect them to behave differently, and the reasoning
// that they would was wrong in both directions. What is true is only what the
// game does: from the pins, which run BEFORE +map, `god` survives and
// `give weapons` is silently dropped. No message, no error -- you simply spawn
// holding a pistol, which looks exactly like the arm having failed to apply.
//
// So: wait a second of game time for the level and the player to exist, then
// ask. `wait` defers the REST of the line, which is why the gives sit after it
// on one line rather than on their own.
//
// If a slow level load ever outruns this, the fix is a bigger number here and
// nothing else.
wait 35; give weapons; give ammo
