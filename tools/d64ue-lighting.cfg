// Doom 64: Unseen Evil -- world lighting for DOOM 1/2 maps.
//
// Exec'd by tools/launch-unseenevil-rt.cmd AFTER d64rt-pins.cfg, so these win.
//
//
// NO INVENTED LIGHT. BOTH MECHANISMS ARE OFF, ON PURPOSE.
//
// DOOM 1/2 maps contain no light things at all, so under a path tracer only real
// sources light them: the mod's keys and torches, its weapon projectiles, the
// pickup glows (d64ue-pickup-lights.pk3), the key-door trim (rt_keytrim_lights)
// and the flashlight. Two schemes were tried to fill the rest in and both are
// rejected:
//
//   rt_sector_lights  a PointLight actor at every sector centre
//                     (d64rt-autolights.pk3). Lights the level, but a point light
//                     under a flat ceiling burns a round pool into it -- a bright
//                     disc with no fixture anywhere near it. Lowering it in the
//                     room spreads the disc; nothing removes it, because the
//                     emitter is a ball hanging in mid-air.
//
//   rt_sector_emis    bright surfaces emit light themselves. No disc, since the
//                     emitter IS the ceiling -- but it is the same lie told more
//                     smoothly: a wall glowing because its lightlevel is high,
//                     with nothing in the room producing that light.
//
// Both are fake fixtures, and they are off. THE LEVELS WILL BE DARK. That is the
// accepted cost of only ever showing light that something in the world is actually
// emitting, and the flashlight (F) is the intended way to see.
//
// Neither is deleted, so either can be judged again in one command:
//   rt_sector_lights 1     point lights back, live, no map reload
//   rt_sector_emis 0.8     plus rt_sector_emis_margin -130 (see below)
//
// THE MARGIN, if the emissive route is ever revisited: the effective threshold is
// max(rt_sector_emis_minlight, map_median + rt_sector_emis_margin). Unseen Evil's
// Terraformer normalises sector lightlevel UPWARDS -- DOOM II MAP02's median is 240
// of 255 -- so at the stock +40 margin the threshold lands at 280 and nothing can
// ever emit. It has to go NEGATIVE on this content to do anything at all, which is
// worth knowing before concluding the cvar is broken.
rt_sector_emis 0
rt_sector_lights 0

// WATER FULLY LIGHTING-DEPENDENT. rt_water_glow is an UNLIT sheen on the caustic
// veins -- it casts no light, but it draws the pattern regardless of how dark the
// room is, so a pool reads as glowing in the dark. Its 0.15 default is right for
// Retribution, whose rooms are lit; here, with every invented light removed, it was
// the brightest thing in a black room and the only surface not obeying the lighting.
//
// 0 means the veins are drawn only by light that actually reaches them, which is the
// point of taking the fake lighting out in the first place. The cost is that in a
// genuinely unlit room the water goes black like everything else -- correct, and what
// the flashlight is for.
//
// This does NOT touch the caustics the water casts ONTO walls (rt_water_caustics),
// which are a real light transport effect and stay.
rt_water_glow 0

// KEEP THE MOD'S SECTOR PALETTE OUT OF ALBEDO. Unseen Evil's Terraformer paints
// every sector from an authored colour list (9E321E, C85F4B, FF7E66 ...). Normally
// rt_mod_compat's force-white keeps sector lightlevel/colour out of path-traced
// albedo -- but rt_mod_compat also gates ReplaceTextures, so this mod must run it
// at 0 to have its textures at all, and the protection went with it. Every surface
// then baked the sector's red, which reads as a red glow filling rooms that contain
// no light. rt_world_white restores just that half.
//
// Hue is still preserved; this drops LIGHTLEVEL from the vertex colour rather than
// washing the map white.
rt_world_white 1

// AUTO-EXPOSURE FLOOR. rt_tnmp_ev100_min is the brightest the tonemapper may open
// to, and its stock 2.0 was chosen for Retribution, whose rooms have real lights.
// With every invented light removed here, the room is genuinely near-black, so the
// exposure opens all the way up and lifts whatever albedo dominates -- which in
// Unseen Evil's DOOM II maps is red rock. That is what reads as "a red glow with no
// source": not an emitter, just the darkest scene in the game being amplified.
//
// Measured on MAP02, mean RGB of the ceiling band:
//     ev100_min 2.0  ->  67 / 26 / 25     (lifted, reads as a red wash)
//     ev100_min 3.5  ->  41 / 15 / 15
//     ev100_min 4.5  ->  28 / 11 / 11     (reads as a dark room)
//
// 4.0 sits between the last two: dark enough that unlit rock stays unlit, bright
// enough that the flashlight pool and the torch/key lights still carry the frame.
// It is a taste knob -- raise it for a darker game, lower it toward 2.0 to get the
// old lifted look back.
rt_tnmp_ev100_min 4.0
