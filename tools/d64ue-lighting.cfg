// Doom 64: Unseen Evil -- world lighting for DOOM 1/2 maps.
//
// Exec'd by tools/launch-unseenevil-rt.cmd AFTER d64rt-pins.cfg, so these win.
//
//
// NO INVENTED LIGHT. BOTH MECHANISMS ARE OFF, ON PURPOSE.
//
// DOOM 1/2 maps contain no light things at all, so under a path tracer only real
// sources light them: the mod's keys and torches, its weapon projectiles, the
// pickup glows (d64ue-pickup-lights.pk3), the UE monitor fixtures and the
// flashlight. Two schemes were tried to fill the rest in and both are
// rejected:
//
//   rt_sector_lights  a PointLight actor at every sector centre
//                     (d64rt-autolights.pk3). Lights the level, but a point light
//                     under a flat ceiling burns a round pool into it -- a bright
//                     disc with no fixture anywhere near it. Lowering it in the
//                     room spreads the disc; nothing removes it, because the
//                     emitter is a ball hanging in mid-air.
//
//   rt_sector_emis    bright surfaces emit light themselves. No disc, since the
//                     emitter IS the ceiling -- but it is the same lie told more
//                     smoothly: a wall glowing because its lightlevel is high,
//                     with nothing in the room producing that light.
//
// Both are fake fixtures, and they are off. THE LEVELS WILL BE DARK. That is the
// accepted cost of only ever showing light that something in the world is actually
// emitting, and the flashlight (F) is the intended way to see.
//
// Neither is deleted, so either can be judged again in one command:
//   rt_sector_lights 1     point lights back, live, no map reload
//   rt_sector_emis 0.8     plus rt_sector_emis_margin -130 (see below)
//
// THE MARGIN, if the emissive route is ever revisited: the effective threshold is
// max(rt_sector_emis_minlight, map_median + rt_sector_emis_margin). Unseen Evil's
// Terraformer normalises sector lightlevel UPWARDS -- DOOM II MAP02's median is 240
// of 255 -- so at the stock +40 margin the threshold lands at 280 and nothing can
// ever emit. It has to go NEGATIVE on this content to do anything at all, which is
// worth knowing before concluding the cvar is broken.
rt_sector_emis 0
rt_sector_lights 0

// CheelloRocket inherits GZDoom's stock +ROCKETTRAIL. Its particle billboards
// are the small grey squares seen around the missile and are independent of the
// RT volumetric smoke tracker. Disable only that raster trail here; the UE-only
// launcher executes this after the shared pins, while rt_smoke_rocket remains 1.
cl_rockettrails 0

// A small unlit crest sheen makes UE's correctly tagged WATERA/WATERB readable
// in its deliberately dark IWAD rooms. It is surface-only -- not an invented
// light -- and stays below Retribution's 0.15 because the flashlight is still
// meant to carry the room. rt_water_debug=1 confirms the actual shader branch.
// This does NOT touch the caustics cast onto surrounding walls.
rt_water_glow 0.08

// MAP02's pool exposed both red sources clearly: a synthetic key-trim light and
// the leaked red sky environment. The launcher disables the first and pins the
// UE sky environment off for every map; rt_main.cpp namespaces UE's RT scene so
// no colliding Retribution scene profile can override that pin. Retain a small
// physical-looking reflection for the real lights that remain.
rt_water_reflmin 0.02
rt_water_reflmax 0.25

// KEEP THE MOD'S SECTOR PALETTE OUT OF ALBEDO. Unseen Evil's Terraformer paints
// every sector from an authored colour list (9E321E, C85F4B, FF7E66 ...). Normally
// rt_mod_compat's force-white keeps sector lightlevel/colour out of path-traced
// albedo -- but rt_mod_compat also gates ReplaceTextures, so this mod must run it
// at 0 to have its textures at all, and the protection went with it. rt_world_white
// restores just that half. This is still required, but the white-albedo diagnostic
// proved it was NOT the persistent MAP02 room-filling red source.
//
// Unlike Retribution, these DOOM II sector colours are not authored RT lighting.
// Keep both the albedo and analytic-source hue neutral on Unseen Evil; real
// coloured fixtures supply their own measured colour. SFLATAI/SFLATAB themselves
// are mildly warm, but measured far less saturated than the old rendered wash.
rt_world_white 1
rt_sector_tint_albedo 0
rt_sector_tint_lights 0

// Do not override the shared auto-exposure floor. Raising it did not address
// either MAP02 red source and made the Unseen Evil flashlight needlessly dim.
// Retribution's pinned stock value therefore remains in effect.
