// Doom64-RT: the UE monster lab's "make them fight" overlay.
//
// exec'd AFTER d64rt-pins.cfg, never instead of it, so the lab keeps every RT
// setting the game actually ships with. It only undoes the one pin that stops a
// solo lab working.
//
// `notarget` is a TOGGLE: d64rt-pins.cfg runs it once, turning it ON, and this
// runs it again, turning it OFF. That is why this file is a second exec rather
// than a "+notarget" on the command line -- a cheat passed as a +command does
// not take effect, while one inside an exec'd cfg does. Measured both ways.
//
// AND IT IS NOT A FILTERED COPY OF THE PINS, which is what this used to be.
// findstr could not filter that file at all: it left `god` and `notarget` in
// place and still returned 63 KB of a 93 KB source, so the copy was junk. When
// it failed outright the copy was EMPTY, and the lab then launched with NO PINS
// -- monsters hostile for the wrong reason, no god, and every RT cvar at its
// compiled default rather than the shipped value. Nothing said so.
notarget
