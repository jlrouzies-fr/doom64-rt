// Sprite shadow proxies -- SHIPPING ON. A sprite is a camera-facing quad with
// no thickness, so a light in its plane casts no shadow at all and the shadow's
// shape follows the camera; these are invisible crossed quads that occlude
// shadow rays and nothing else. Pinned as well as compiled on, because a pin
// overrides the compiled default and the two must agree.
// Scope 1 = live monsters only: the vertical-cross assumption fits a standing
// body and nothing else, so corpses, gibs and dropped weapons keep the stock
// billboard shadow. See docs/moon-and-sky-leaks.md 5.3.
rt_sprite_shadow 1
rt_sprite_shadow_scope 1
rt_sprite_shadow_planes 4
rt_sprite_shadow_width 1
rt_sprite_shadow_hidecaster 1
rt_sprite_shadow_dist 40
// Contact occlusion under sprites -- the soft blob on the floor that keeps
// enemies, corpses, barrels and dropped weapons sitting ON the ground. Not a
// second shadow: it answers "is something touching this floor", which is the one
// question a cast shadow cannot answer when the light lies in the board's plane
// and the shadow collapses to a line. Scope 0 = every thing with a floor under
// it. See docs/moon-and-sky-leaks.md 5.3.1.
rt_sprite_ao 1
rt_sprite_ao_strength 0.7
rt_sprite_ao_radius 1.6
// A standing body gets a FAINTER blob than a thing lying on the floor: a dropped
// weapon is in contact across its whole footprint, a soldier only at his feet.
// This is the knob for "monsters read too heavy", not rt_sprite_ao_strength,
// which would take the props down with them.
rt_sprite_ao_upright 0.7
// The bigger the sprite, the LESS blob it gets. Both sizing paths above are
// linear in the object, so a soldier got a footprint as much bigger than a
// shotgun as his body is -- and contact occlusion is not a scale model of the
// object, it is the gap where it meets the floor, which does not grow with it.
// 0 = strictly proportional, 1 = every blob the same size. 0.2 since 2026-08-14
// (was 0.6): with shape 2 the footprint is fitted to the sprite art anyway, so a
// heavy correction on top of that flattened big and small things together.
rt_sprite_ao_sizefall 0.2
// Shape 2 = an ellipse fitted to the SPRITE QUAD for everything, standing or
// lying down (was 1, circle-when-upright, until 2026-08-14). A shotgun on the
// floor gets a smudge along the barrel rather than a disc, and that ellipse
// turns with the billboard because the art it is measured from does.
rt_sprite_ao_shape 2
rt_sprite_ao_fit 1
rt_sprite_ao_aspect 0.4
rt_sprite_ao_fade 56
rt_sprite_ao_scope 0
