// intensity 40 -> 16 and blink_floor 0.55: the SMON monitors read as strobing and too
// bright once all 199 of them were switched on. The two knobs are COUPLED through
// rt_dynlight_max -- at scale 40 a 24/20 monitor's raw crest is 960, so the 500 cap
// clips it and any blink floor above ~0.52 clips too, flattening the swing to nothing.
// Dropping the scale under the cap (24*16=384) is what makes the floor work at all.
// 24/20 monitor:  was trough 144 crest 347 swing 2.41x -> now 147 / 267 / 1.82x.
// Naturally targeted: lights with radius >= 32 are cap-limited at both scales and do
// not change (MAP04's r=88 hall stays at 26). Only small panel-sized lights move.
