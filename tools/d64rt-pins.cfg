// ON while the material labelling is in progress: a plain launcher run prints
// the texture name and class of every surface a shot lands on, which is the
// worklist for tools/_material_labels. It runs even with rt_spark off -- the
// probe is a surface IDENTIFICATION tool in the same family as whatsthat and
// rt_tex_probe, and gating it on an effect that ships off would have made this
// pin print nothing, ever. NOARCH, so it cannot persist into the ini.
// Turn it off for a quiet session; every spark-* arm states its own value.
rt_spark_surface_debug 0
// NOARCH, so it cannot persist in the ini -- pinned anyway for the same reason
// rt_smoke_debug is: no arm or leftover may leave the console printing the
// spark ladder over the game.
rt_spark_debug 0
// PROJECTILE IMPACT ARCS -- SHIPPING ON, unlike the sparks above.
//
// They are a separate master on purpose. rt_spark ships 0 pending a play
// verdict; arcs share its particle pool but not its switch, so pinning them
// here is what stops one being held hostage by the other. Every value below
// equals its compiled default -- a pin that disagrees silently wins, and that
// has cost this project two tuning passes already.
rt_arc 1
rt_arc_life 2.5
rt_arc_bright 3.0
rt_arc_max 160
rt_arc_branches 9
rt_arc_segments 5
rt_arc_reach 0.35
rt_arc_width 0.024
rt_arc_jitter 0.55
rt_arc_fork 0.55
rt_arc_flicker 0.6
rt_arc_flicker_rate 1.0
// The re-path clock and the root drift -- what makes the branches MOVE
// rather than merely fade. Both quantized against the mark's age.
rt_arc_churn 24
rt_arc_wander 0.45
// Detached arcs that jump to a new spot on the wall at every re-path --
// what makes the churn legible on the SURFACE rather than only along the
// radial branches. Without them the mark reads as 'a ball plus arcs'.
rt_arc_creep 16
// THE SCORCH. A real decal that darkens the wall's albedo, on its own
// much longer clock -- the arcs are the event, this is the evidence.
rt_arc_burn 1
// 0 = FOREVER, and forever means 'until rt_arc_max evicts it'. A burn has no
// reason to weather on the timescale of a firefight, and one quietly vanishing
// while you were still in the room was what made it read as a decal.
rt_arc_burn_life 0
rt_arc_burn_radius 0.50
// NOT BLACK. The decal LERPS into the albedo buffer, so black at strength
// 0.9 leaves a surface that reflects almost nothing and swallows any light
// aimed at it -- which is what hid the embers' glow inside their own scorch.
// Real soot reflects 4-10%; this is a dark warm charcoal.
rt_arc_burn_color 120C06
// No two scorches the same tint -- one repeated colour reads as a stamp.
rt_arc_burn_color_var 0.65
// How blotchy ONE scorch is -- per-vertex, so a single mark has real black and
// grey patches instead of being a flat brown wash.
rt_arc_burn_mottle 0.7
// How far ash and scorch travel from rt_arc_burn_color. Without it every blob
// kind was a shade of the same near-black and the mark read as one colour.
rt_arc_burn_spread 1.0
// The scorch is LAYERED FANS, not a ring mesh: ring quads alternate light/dark
// wedges (screen/pointyTriangles.png) at any ring count, while every triangle
// of a fan is identical. Several offset fans give the blotches back.
rt_arc_burn_blobs 9
rt_arc_burn_strength 1.00
rt_arc_burn_dist 25
rt_arc_burn_max 96
rt_arc_creep_reach 2.4
// ARCS CAST LIGHT. One spherical light per visible branch, collected from
// the geometry the draw actually emitted -- the branch quads are an
// additive raster overlay and light nothing on their own.
rt_arc_glow 1
rt_arc_glow_max 100
rt_arc_glow_intensity 45
rt_arc_core 0.07
rt_arc_far 40
rt_arc_light 1
rt_arc_light_intensity 220
rt_arc_light_life 2.5
rt_arc_probe 1.6
rt_arc_probe_max 512
// NOARCH, pinned for the same reason rt_spark_debug is: no arm or leftover may
// leave the console printing every projectile impact over the game.
rt_arc_debug 0
// ROCKET IMPACT EMBERS -- the third thing the projectile hook feeds. Cooling
// coals plus the same scorch decal the arcs leave, wider. THE ONLY IMPACT IN
// THE GAME THAT GETS SMOKE; plasma and the Unmaker deliberately get none.
rt_ember 1
rt_ember_count 10
rt_ember_life 20
rt_ember_scatter 0.5
rt_ember_size 0.01
rt_ember_bright 2.0
// Embers BREATHE rather than fading smoothly -- two sines at incommensurate
// rates per ember, driving brightness, a little size, and the light they cast.
rt_ember_glow_intensity 55
rt_ember_glow_radius 0.10
// The scorch multiplies the wall's albedo down by 90%, so an ember's real
// light has almost nothing to bounce off exactly where the embers are. This
// additive halo does not consult albedo and reads over the black burn.
rt_ember_halo 0
rt_ember_halo_alpha 0.35
rt_ember_flicker 0.55
rt_ember_flicker_rate 1.6
rt_ember_far 40
rt_ember_burn_scale 3.4
// The wisps. Modelled on the PISTOL's muzzle filament, not on a flame -- one
// small parcel with a low growth rate, which is what makes a thread instead of
// a ball. Needs rt_smoke as well as rt_ember_smoke.
rt_ember_smoke 1
rt_ember_smoke_every 0.30
rt_ember_smoke_delay 0.65
rt_ember_smoke_hot 0.55
// THE INSIDE-THE-WALL FIX, both halves: born clear of its own radius (and of
// the +/-0.6r birth jitter RT_SpawnSmokePuffs applies on all three axes), and
// given outward velocity so it does not just climb the wall half buried.
rt_ember_smoke_lift 2.0
rt_ember_smoke_drift 0.35
rt_ember_smoke_radius 0.06
rt_ember_smoke_life 2.0
rt_ember_smoke_density 0.55
rt_ember_smoke_max 10
// EXPLODING BARREL DESTRUCTION. Independent of rt_smoke on purpose -- the
