// Doom64-RT: the static cvar pins for launch-retribution-rt.cmd.
// Moved out of the launcher because 325 "+name value" pairs made its command
// line 8016 characters and cmd.exe truncates at 8191 -- which silently ate the
// "-- +cvar" A/B passthrough at the end of the line, and some of these pins.
// Edit values here; the launcher execs this file before +map.
// >>> DEV-ONLY <<<  Everything down to END-DEV-ONLY is STRIPPED by
// tools/package_release.py and must never reach a player. These make the game
// convenient to TEST -- windowed, no IWAD prompt, unkillable, ignored by
// monsters -- and a shipped build with them is a shipped build you cannot lose.
//
// Do not move a line out of this block without deciding it is right for someone
// playing the game for the first time. vid_fullscreen and win_x are in here
// because a launcher that reasserts them every start overwrites whatever the
// player chose in the menus, which reads as "my settings do not save".
vid_fullscreen 0
win_x -1
queryiwad false
sv_cheats 1
god
notarget
// >>> END-DEV-ONLY <<<
// NO `give` HERE, and it was tried. `god` and `give` look identical in the
// source -- both are CheckCheatmode() then Net_WriteByte(DEM_*) -- so it is
// reasonable to expect one to work wherever the other does. It does not: from
// this file, which runs BEFORE +map, `give weapons` is silently dropped while
// `god` survives. Tested, not reasoned. The loadout lives in
// tools\ab-cheats.cfg, which waits for the level to exist first.
rt_mod_compat 1
r_drawvoxels 0
d64_enterfade 0
d64_exitfade 0
// The WAD's own casing feature, shipped OFF (default 0). Everything is already
// authored -- BulletCasing/ShellCasing, bounce physics, 5 random rest poses,
// 28 sound lumps, the liquid plop -- and every weapon's Fire state jumps on an
// ACS read of this cvar, so 0 means the whole system never spawns. See
// docs\plan-projectile-impact-fx.md section 8: the open question is population
// cost (Death states are -1, so casings lie there for the rest of the level),
// which is answered by holding the chaingun trigger with a frame time on screen.
d64_dropcasings 1
rt_fluid false
rt_autoexport false
// GEOMETRY CULLING -- PINNED AT THE STOCK DEFAULTS, TO STOP A ONE-OFF
// EXPERIMENT BECOMING THE CONFIGURATION.
//
// These decide what reaches the acceleration structure at all, and a wall that
// is not in it cannot shadow anything: the moon and the next room's lamps shine
// straight through where it should be (docs/moon-and-sky-leaks.md 5.1). So they
// are load-bearing for every lighting result in the game.
//
// 0 = visible sectors + every neighbour + everything within nocullradius
// 1 = stock GZDoom culling, visible only (the leakiest)
// 2 = the WHOLE MAP, no culling at all
//
// WHY THEY ARE PINNED AT ALL -- 2026-08-15, and it cost most of a session.
// rt_cpu_cullmode was set to 2 by hand, once, on ONE map, to stop a wall behind
// the player being culled. It is CVAR_ARCHIVE and nothing pinned it, so it went
// into gzdoom-rt2.ini and stayed there: invisible to the repo, carried into
// every later session, and eventually remembered as "how we always were". It was
// never the default -- git says 0 at the initial import and 0 at HEAD, always.
//
// The cost of not noticing: mode 2 makes RTGL log and drop a duplicate primitive
// for a handful of sidedefs every frame (~1500 console lines a session), which
// was reported as a renderer bug; and it sent a whole diagnostic ladder chasing
// geometry that was never the problem.
//
// tools/arms/cull-*.cfg set this deliberately. With these pins, an arm can no
// longer follow you into the next play session.
//
// THE ANSWER TO "A WALL BEHIND ME GETS CULLED" IS THE RADIUS, NOT MODE 2.
// Mode 0 already submits every visible sector AND every neighbour of one; on top
// of that hw_bsp.cpp:988 marks any sector whose lines touch a box of
// 32 * rt_cpu_nocullradius map units around the camera, visible or not. So the
// shell is what guarantees the geometry behind you, and it costs a sector/line
// scan plus those uploads -- not the whole level every frame.
//
// 10 -> 20 m (320 -> 640 map units) was measured to help on the map that
// prompted this. Raise it further if a big hall still drops walls; if one map
// needs much more than the rest, that belongs in an RT_FOG_PRESETS-style
// per-map table in rt_presets.cpp rather than a global value everyone pays for.
rt_cpu_cullmode 0
rt_cpu_nocullradius 20
rt_upscale_dlss 2
rt_upscale_fsr2 0
rt_rayreconstr 0
rt_framegen 0
// DLSS render preset, as the raw NGX enum: 5 = E, 11 = K, 0 = Default.
// RTGL1 hard-coded E, and rt\bin\nvngx_dlss.dll is 310.7 -- a DLSS 4 runtime on
// which E is a deprecated CNN preset. Pinned so the value is stated rather than
// inherited; the cvar is NOARCH so nothing else can set it behind our back.
rt_dlss_preset 5
// The Ray Reconstruction twin -- different value set: only 0 = Default, 4 = D,
// 5 = E exist for RR (J/K do not). 5 = E, what DLSSRR.cpp hard-coded before it
// was configurable. Same stated-not-inherited rationale as rt_dlss_preset.
rt_rr_preset 5
gl_noskyboxes false
rt_sky 25
rt_sky_always true
rt_sky_nowalls 0
rt_sun 1
rt_sun_intensity 90
rt_sun_a 25
rt_sun_b 135
rt_sun_color B4C8FF
rt_sun_angdiam 0.5
rt_moon_geo 1
rt_moon_geo_size 12
rt_moon_presets 1
rt_clouds 0
rt_clouds_presets 1
rt_clouds_shells 6
rt_clouds_horizon 9
rt_clouds_curve 0.55
rt_clouds_thick 0.7
rt_clouds_tiles 6
rt_clouds_alpha 0.9
rt_clouds_dark 0.45
rt_clouds_wind 0.014
rt_clouds_wind_dir 30
rt_clouds_shear 0.09
rt_clouds_occlude 1
rt_clouds_transmit 0.22
rt_clouds_tint B4C0DC
rt_clouds_flash 2.2
rt_lightning 1
rt_lightning_intensity 2200
rt_lightning_color C8D8FF
rt_lightning_decay 0.18
rt_lightning_strokes 3
rt_lightning_angdiam 6
rt_lightning_alt_min 15
rt_lightning_alt_max 40
rt_lightning_bolt 1
rt_lightning_bolt_size 55
rt_lightning_sectorflash 1
rt_lightning_debug 0
rt_fog 1
rt_fog_presets 1
rt_fog_color 000000
rt_fog_density 0.01
rt_fog_density_mult 0.3
rt_fog_density_far 10
rt_fog_color_far 000000
rt_fog_curve 1
rt_fog_far 45
rt_fog_ambient 1
rt_fog_lightmult 1
rt_fog_light_near 2
rt_fog_illum 1
rt_mzlflsh 1
rt_volume_type 1
rt_volume_blur 1
rt_volume_occlude_emis 1
// THE FROXEL DEPTH GATE -- the fix for a lamp shaft read THROUGH a wall
// (docs/plan-light-shafts.md 4d). Restates the compiled default, because a pin
// overrides it and the two must agree.
//
// The volume is a prefix sum stored at cell CENTRES and read TRILINEARLY at the
// surface's distance, so a wall collects part of the cell BEHIND it, where the
// froxel legitimately sees the next room's lamp -- and the sample's z is CLAMPED
// to [0,1] while slice 0's centre sits ~0.47 m out, so a surface nearer than
// that collects slice 0 whole. Hence "worst with my face against the wall".
// Every shadow ray was already correct and the leak survived rt_cpu_cullmode 2,
// so neither visibility nor geometry was ever the problem.
rt_volume_depthgate 1
rt_volume_depthgate_bias 0
rt_volume_depthgate_feather 1
rt_volume_depthgate_taps 5
// The upscaler bias mask (docs/rt-volumetric-edge-outlines.md). Pinned even at
// 0 so an arm that turns it on cannot leak into the next run through the ini --
// these are archived cvars, and the launcher's pins are what makes a capture
// mean the same thing twice.
rt_volume_ubias 0
rt_volume_ubias_edge 0.15
rt_volume_ubias_floor 0
// Pinned OFF even though the cvar is NOARCH: making it NOARCH stops it being
// SAVED, it does not remove the line an earlier build already wrote into the
// ini -- and that line was still turning the debug view on, which renders a
// black screen whenever there is no medium in frame. The pins run after the
// config and before the arm's own +cvars, so this is what makes a capture mean
// the same thing twice.
rt_volume_ubias_debug 0
// Composite the medium after the upscaler. Built and measured; it does NOT fix
// the outlines and makes DLAA worse, so it stays off -- kept as a switch and a
// recorded negative result.
rt_volume_postcomp 0
// SHIPPING ON. Softens the medium across a silhouette, which removes the lines
// around sprites and geometry seen through smoke or fog (-1.0 -> -0.4 on the
// MAP93 lab) with the temporal noise inside its own repeatability floor. Pinned
// to the same value as the compiled default ON PURPOSE: a pin overrides the
// default, so the two disagreeing is how a shipped value silently does not
// happen.
rt_volume_edgesoft 2
rt_volume_edgesoft_edge 0.05
// THE SPRITE-VS-MEDIUM FIXES (docs/rt-volumetric-weapon-trails.md). Three
// switches, all NOARCH so they have to be stated here or not at all.
//
// rt_volume_fp 1        -- the weapon: the accumulator keeps the WORLD's fog
//                          alive under the sprite (far integral, sign-marked
//                          history) and the composite paints NO fog on the gun.
//                          A freeze was tried first and dragged the fog around
//                          with the gun; this replaces it.
// rt_volume_reproj 1    -- media reprojection rules: relative path length
//                          within 25%, no normal test. The surface rules
//                          rejected medium history at every billboard
//                          silhouette for a difference of a few percent of
//                          veil, and every rejection restarts from one noisy
//                          sample -- the smear bands at sprite edges.
// rt_volume_spriteshadow 0 -- billboards and their shadow-proxy planes no
//                          longer occlude the froxel volume's light. The
//                          casing's proxy stamped a solid RECTANGLE of shadow
//                          into the muzzle smoke; on MAP12 every monster
//                          strobed plane-shadows through the lightning shafts.
//                          Grates and fences still cut their shafts.
rt_volume_fp 1
rt_volume_reproj 1
rt_volume_spriteshadow 0
// rt_volume_taccum 8   -- accumulate IN THE FROXEL GRID (world space) and
//                         recompute the ray integral fresh every frame. The
//                         structural fix: with no screen-space history there is
//                         nothing to reject at any silhouette, so no trails --
//                         weapon, casing, monsters, geometry edges alike.
//                         Upstream shipped this and left it hard-disabled.
rt_volume_taccum 8
// SCREEN AXES ONLY. This used to drive the depth axis too, and depth is
// one-sided (-sampleHemisphere), so 5 froxels against rt_volume_far 60's 0.94 m
// slices was a mean 1.56 m of column that never got integrated -- MAP13's moon
// shafts dying in mid-air short of the floor they were lighting. The screen
// jitter is symmetric and stays where the smoke work put it; the depth one is
// below and belongs under a froxel. docs/moon-and-sky-leaks.md S5.5.
rt_volume_dither 5
rt_volume_dither_z 1
rt_volume_far 60
// PER METRE since the moon-shaft fix -- rt_main.cpp scales this by
// rt_volume_far/30 before upload, because the shader applies it per CELL and the
// grid is 64 slices at any reach. Before that, raising the reach above silently
// halved the medium and took the moon's shafts with it
// (docs/moon-and-sky-leaks.md S5.4). 1 is the density this level set was tuned
// with; the arms that move it are tools/arms/moon-*.cfg.
rt_volume_scatter 1
rt_volume_ambient 0.2
// Pinned at their compiled defaults so an arm cannot leave them in the ini and
// follow you into play -- moon-lint sets lintensity 2, and these are
// CVAR_ARCHIVE like everything else here.
rt_volume_lintensity 1
rt_volume_lassymetry 0.5
rt_volume_history 8
// LIGHT SHAFTS FROM ORDINARY LAMPS (docs/plan-light-shafts.md). The froxel pass
// shadow-tests exactly ONE light -- the moon -- which is why beams only ever
// happened outdoors; these hand it a short list of interior fixtures as well.
// Pinned at their compiled defaults for the same reason the three above are: a
// tools/arms/lampshaft-*.cfg arm sets them, they are CVAR_ARCHIVE, and without
// a pin the last arm run would follow you into play.
rt_volume_shafts 1
rt_volume_shaft_src 7
// BANDS ARE WHAT MADE SHAFTS REACH (2026-08-14, second report). Taking the
// nearest N with a 3 m dedupe fills a disc of ~7 m around the camera, and a
// lamp room offers hundreds of candidates -- so a lamp ten metres down the
// corridor was never SENT, not merely dim. Each band gets its own share of
// the slots. Watch the 'reach a..b m' field in rt_volume_shaft_verbose.
rt_volume_shaft_bands 4
rt_volume_shaft_max 32
rt_volume_shaft_trace 4
rt_volume_shaft_mult 10
rt_volume_shaft_nearfade 1.5
// THE TWO KNOBS THE "SHAFTS DO NOT REACH" REPORT NEEDED (2026-08-14). A sphere
// light's weight is a solid angle, so a lamp's scattering is inverse square and
// dies 36x between 1 m and 6 m -- the moon's shafts read across a level because
// a DIRECTIONAL light does not fall off at all. _falloff hands that back;
// _relcull decides who spends the per-froxel ray budget, which without it went
// in list order, i.e. to the lamps nearest the CAMERA rather than the ones
// reaching the cell. Both values below are JUDGED IN PLAY: falloff 0 read as a
// puddle around the bulb and 1 as fog with no shape, so 0.5 sits between them;
// mult 10 is large because a lamp's solid angle and the moon's directional light
// are not in the same units, which is why the knob is separate at all.
rt_volume_shaft_falloff 0.5
rt_volume_shaft_relcull 0.05
rt_volume_shaft_mincontrib 0
rt_volume_shaft_asym -2
// 1920 = 60 m = rt_volume_far, the reach of the froxel volume itself. Past it
// there is no medium to scatter in, so there is no reason to be tighter.
rt_volume_shaft_maxdist 1920
rt_volume_shaft_mingap 96
rt_volume_shaft_minint 0
rt_volume_shaft_debug 0
rt_volume_shaft_verbose 0
// DUST MOTES (docs/plan-light-shafts.md). The sparkle half of a light shaft:
// tiny quads on a hashed world lattice, drawn as REAL TRACED GEOMETRY so each
// is lit by whatever reaches it and invisible where nothing does. Every value
// here restates its compiled default, so check_pins.py rt_dust stays clean.
rt_dust 1
rt_dust_density 0.10
rt_dust_max 900
rt_dust_far 12
rt_dust_near 0.5
rt_dust_size 0.008
rt_dust_size_ang 0.0022
rt_dust_color C8C8C8
rt_dust_albedo 0.9
rt_dust_drift 0.35
rt_dust_speed 0.25
rt_dust_cone -0.25
// THE SHAFT GATE. Traced lighting alone does not make dust a shaft effect:
// ambient and bounced GI reach everywhere, so every mote picks up something and
// the field reads as an even haze of specks. This is the albedo a mote keeps
// where there is no beam -- 1 is ungated, 0 is beams only, 0.08 is 'barely'.
// The weight is proximity x phase against the shaft light list, never a
// radiance: how much light arrives is the tracer's answer, and visibility stays
// the tracer's job, so a mote near a lamp but behind a wall is still black.
// PER-MOTE SPREAD. Every mote used to share one albedo and one size, so a lit
// field came out as a uniform sheet of identical squares -- reported as too flat
// and brown with not enough gray and black. Real dust is a MIXTURE, mostly dark
// grit with a few bright flecks, and the spread is what reads as dust.
rt_dust_variance 0.75
rt_dust_size_var 0.6
// Fraction of rt_dust_far the motes shrink out over. Shrink, not fade: below
// RTGL1's 0.98 alpha threshold the batch is demoted to the rasterized overlay
// and goes fullbright. Raising rt_dust_far moves this band with it.
rt_dust_fade 0.25
rt_dust_shaft_floor 0.08
rt_dust_shaft_radius 2.5
rt_dust_moon 1
rt_dust_moon_weight 1.0
rt_dust_clip 1
// QUIET. Both of these are diagnostics and the release setting is off; turn one
// on for a run with `-- +rt_volume_shaft_verbose 1` / `-- +rt_dust_debug 1`.
rt_dust_debug 0
rt_smoke 1
rt_smoke_density 14
rt_smoke_color AEAEAE
rt_smoke_count 4
rt_smoke_budget 120
rt_smoke_life 2.2
rt_smoke_radius 0.35
rt_smoke_growth 0.5
rt_smoke_speed 1.8
