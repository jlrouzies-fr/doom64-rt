// The two knobs are COUPLED through rt_dynlight_max. At scale 40 a 24/20 monitor's raw
// crest is 960, so the 500 cap clips it, and any floor above ~0.52 clips too -- which
// flattens the swing to 1.00x, i.e. raising the floor at that scale turns the flicker OFF
// rather than calming it. The scale has to sit under the cap for the floor to be linear.
// At 10 nothing clips at all, which is why every monitor family now swings a uniform
// 1.25x instead of each arg3/arg4 pair behaving differently.
