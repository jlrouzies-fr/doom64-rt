// Per-monster blood colour depends on this. A palette-TRANSLATED texture gets
// its own RTGL1 material name (BLUDA0 -> BLUDA0_tr7); with it off, every
// translation of a sprite uploads under one name and RTGL1 keeps only the FIRST
// (PreferExistingMaterials), so whichever blood was drawn first colours all of
// it. Launch-time only -- the name is cached per hardware texture.
