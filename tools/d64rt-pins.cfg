// Eye-mask emission on the living see-through monsters. Also decides their
// BLEND MODE, which is not obvious: RTGL1 turns any translucent primitive with
// emissive>0 into an ADDITIVE one, and additive cannot occlude the background at
// any alpha -- which is why rt_nightmareimp_alpha reads as inert. 0 restores real
// alpha blending and takes the glowing eyes with it. See docs/spectre-issue-log.md.
rt_ghost_emis 1
// ...and this is what lets us keep the eyes AND have the alpha work: the body
// goes out with no emissive (so it alpha-blends), and the eye mask is uploaded
