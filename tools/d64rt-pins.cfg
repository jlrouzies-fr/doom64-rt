rt_smoke_drag 1.9
rt_smoke_inherit 0.85
rt_smoke_offset 0.8
rt_smoke_muzzle_u 0
rt_smoke_repeat 5
rt_smoke_far 14
rt_smoke_ambient 0.1
rt_smoke_illum 1
rt_smoke_spp 8
rt_smoke_maxlight 6
rt_smoke_light_near 0.5
rt_smoke_illum_blend 0.45
rt_smoke_perweapon 1
rt_smoke_trail 1
rt_smoke_monster 1
rt_smoke_monster_scale 1
rt_smoke_monster_far 18
rt_smoke_projectile 1
