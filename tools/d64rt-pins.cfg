// The SMON monitors, settled in play over three passes. All 199 of them light at once,
// so anything that reads as busy on one panel reads as a strobing wall on twenty.
//
//   first pass   scale 40  floor 0.15  ->  100..347   swing 3.47x   "flickering like crazy"
//   second       scale 16  floor 0.55  ->  147..267   swing 1.82x   still too much
//   SHIPPED      scale 10  floor 0.8   ->  133..167   swing 1.25x
//
// The two knobs are COUPLED through rt_dynlight_max. At scale 40 a 24/20 monitor's raw
// crest is 960, so the 500 cap clips it, and any floor above ~0.52 clips too -- which
// flattens the swing to 1.00x, i.e. raising the floor at that scale turns the flicker OFF
// rather than calming it. The scale has to sit under the cap for the floor to be linear.
// At 10 nothing clips at all, which is why every monitor family now swings a uniform
// 1.25x instead of each arg3/arg4 pair behaving differently.
//
// Collateral: this scale is global to FDynamicLight, so steady 9800/9801 lights up to
// radius ~50 are dimmed with it (r24 267->167, r32 195->125). Radius >= 50 is cap-limited
// at both scales and does not move -- MAP04's r=88 hall stays at 26.
// Arms: tools/ab-smon.cmd (2026-08-12)
rt_dynlight_blink_floor 0.8
// The TV-static class, and the ONLY 9804s in the game -- the SMONBA readout
// panels added by PANEL_LAMPS. Split from blink_floor because that one is global
// to all 199 SMON panels, so the 0.8 that settled the wall also forbade any one
// family from swinging harder. 0.3 = 3.3x swing on a 20/16 fixture (60..200)
// against the 9802 wall's 1.25x. Retribution ships no 9804 of its own, so this
// cannot move an existing fixture.
rt_dynlight_rndflicker_floor 0.3
rt_dynlight_flicker_scale 0.25
