rt_smoke_barrel_scale 1
rt_smoke_ambient_fx 1
rt_smoke_ambient_scale 1
rt_smoke_ambient_budget 96
rt_smoke_ambient_far 60
// NOARCH, so it cannot persist in the ini -- pinned anyway so the play
// launcher states it, and no arm or leftover can leave the console
// printing puff positions over the game.
rt_smoke_debug 0
rt_smoke_stylize 0
