# Class-level roughness corrections applied at bake time, on top of the labels.
#
# WHY THESE EXIST AT ALL. A billboard has no normal map. A DIELECTRIC at low
# roughness therefore lays a broad, near-uniform WHITE specular sheen over the
# whole sprite -- it fills the dark areas of the painted art toward grey and
# takes the contrast out, which is exactly the "leather looks really bad, like it
# has zero contrast" report. Metal does not do this: it has no diffuse lobe and
# tints its specular by the albedo, so a low-roughness metal reads as shaped
# rather than washed.
#
# So the correction is only ever applied to the dielectric classes, and only as a
# FLOOR (--roughmin), never a fixed value: the per-cluster variation in the
# exports was deliberate work and must survive. Anything already rougher is left
# exactly as called.
#
# METAL IS NOT TOUCHED. 283 clusters at 0.20 and 692 at 0.40 are a real
# judgement about weapons being the most polished thing in the game, and the one
# class where low roughness is physically right.
#
# Used by tools/apply-sprite-labels.cmd. Edit and re-run; no re-labelling.

--roughmin flesh=0.60
--roughmin leather=0.70
--roughmin wood=0.65
--roughmin rubber=0.70
--roughmin other=0.70
