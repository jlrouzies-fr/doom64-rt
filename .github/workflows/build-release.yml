name: Build release package

# Builds the engine, the path tracer and the release zip on a clean Windows
# runner. It cannot test the result: GitHub runners have no GPU, so nothing here
# proves the renderer works -- only that a fresh machine can build and package it.
#
# Everything the package needs is public. What it deliberately does NOT contain:
# the DOOM II IWAD, Doom 64: Retribution, its brightmaps, soundfont, or the OGG
# music pack. The launcher asks the user for those on first run.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  STOCK_URL: https://github.com/vs-shirokii/gzdoom-rt/releases/download/rt-1.0.2/gzdoom-rt-1.0.2.zip
  # The stock package ships NO NVIDIA redistributables -- its rt/bin holds 11
  # files, all AMD FFX -- so the engine opens a "DLL check failure" dialog on
  # first run offering to fetch them. This is the page that dialog points at, so
  # the Streamline versions match the engine that was built against them.
  RTGL_BUNDLE_URL: https://github.com/vs-shirokii/RTGL/releases/download/1.6.3/rtgl-1.6.3.zip

# The default GITHUB_TOKEN is read-only, so creating the release on a tag fails
# with "403 Resource not accessible by integration" after a successful build --
# which is a long way to walk before finding out.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout Doom64-RT
        uses: actions/checkout@v4
        with:
          # Ancestry against main decides the release channel below, and the
          # default shallow clone cannot answer that question.
          fetch-depth: 0

      # Both forks carry changes this project depends on. Upstream builds, then
      # behaves wrong in ways nothing reports -- see the README.
      - name: Checkout gzdoom-rt fork
        uses: actions/checkout@v4
        with:
          repository: jlrouzies-fr/gzdoom-rt
          # The performance branch, deliberately unmerged: doom64-rt stays the
          # known-good baseline until this branch is judged in play. The two
          # settings-persistence fixes (14e062b40, 86d303c34) live here and on
          # no other ref -- a release cut from doom64-rt resets the player's
          # Quality settings on every launch.
          ref: performance
          submodules: recursive          # unordered_dense; a flat clone fails late
          path: sourcecode/gzdoom-rt

      - name: Checkout RTGL fork
        uses: actions/checkout@v4
        with:
          repository: jlrouzies-fr/RTGL
          # Stays doom64-rt: the performance work changed nothing in RTGL, and
          # no performance branch exists on this remote -- naming one here would
          # fail the checkout.
          ref: doom64-rt
          submodules: recursive          # imgui, glfw, cgltf, glaze, glm, DX12
          path: deps/RTGL

      - name: Checkout DLSS SDK
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/DLSS
          path: deps/DLSS

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      # 500 MB, and only a handful of files survive packaging -- but the engine
      # stages rt/ out of it, so it is not optional.
      - name: Cache stock gzdoom-rt package
        id: stock
        uses: actions/cache@v4
        with:
          path: gzdoom-rt-1.0.2
          key: stock-gzdoom-rt-1.0.2

      - name: Download stock gzdoom-rt package
        if: steps.stock.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:STOCK_URL -OutFile stock.zip
          Expand-Archive stock.zip -DestinationPath stock-extract
          $inner = Get-ChildItem stock-extract -Directory | Select-Object -First 1
          if ($inner -and -not (Test-Path "stock-extract\rt")) {
            Move-Item $inner.FullName gzdoom-rt-1.0.2
          } else {
            Move-Item stock-extract gzdoom-rt-1.0.2
          }
          if (-not (Test-Path 'gzdoom-rt-1.0.2\rt')) { throw 'stock package has no rt/ folder' }

          # Prune before the cache is saved: 2.9 GB extracted, of which this
          # project loads none. Keeps the cache small and the staging step quick.
          # 'replace' is the name in a fresh package (1.9 GB of Doom II glTF
          # models that RTGL1 would load); 'replace_old' is only what a developer
          # renames it to locally to disable it. Both listed on purpose.
          foreach ($d in 'replace','replace_old','scenes','scenes_doom2_backup','bin_remix','launcher','mat_src') {
            Remove-Item -Recurse -Force "gzdoom-rt-1.0.2\rt\$d" -ErrorAction SilentlyContinue
          }
          foreach ($d in 'filter','sounds') {
            Remove-Item -Recurse -Force "gzdoom-rt-1.0.2\rt\wad\$d" -ErrorAction SilentlyContinue
          }
          Remove-Item stock.zip -Force -ErrorAction SilentlyContinue
          '{0:N0} MB kept from the stock package' -f ((Get-ChildItem 'gzdoom-rt-1.0.2' -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: sourcecode/gzdoom-rt/build/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('sourcecode/gzdoom-rt/vcpkg.json') }}

      # The build scripts find Visual Studio through vswhere and the repo root
      # through their own location, so they run here unmodified.
      - name: Build engine
        shell: cmd
        run: .\tools\build-gzdoom-rt.cmd

      - name: Cache NVIDIA runtime DLLs
        id: nvruntime
        uses: actions/cache@v4
        with:
          path: deps/nv-runtime
          key: nv-runtime-rtgl-1.6.3

      - name: Fetch NVIDIA runtime DLLs
        if: steps.nvruntime.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:RTGL_BUNDLE_URL -OutFile rtgl.zip
          Expand-Archive rtgl.zip -DestinationPath rtgl-extract
          New-Item -ItemType Directory -Force deps/nv-runtime | Out-Null
          $want = 'NvLowLatencyVk.dll','nvngx_dlssg.dll','sl.common.dll','sl.dlss.dll',
                  'sl.dlss_g.dll','sl.interposer.dll','sl.pcl.dll','sl.reflex.dll'
          foreach ($f in $want) {
            $src = Get-ChildItem rtgl-extract -Recurse -File -Filter $f |
                   Where-Object { $_.FullName -match '\\rt\\bin\\' } | Select-Object -First 1
            if (-not $src) { throw "the RTGL bundle does not contain $f" }
            Copy-Item $src.FullName "deps/nv-runtime/$f" -Force
          }
          Remove-Item rtgl.zip -Force
          Remove-Item rtgl-extract -Recurse -Force
          '{0:N0} MB of NVIDIA runtime' -f ((Get-ChildItem deps/nv-runtime -File | Measure-Object Length -Sum).Sum / 1MB)

      - name: Build RTGL1
        shell: cmd
        run: .\tools\build-rtgl.cmd

      # After build-rtgl.cmd, which is what creates rt/bin.
      - name: Stage NVIDIA runtime DLLs
        shell: pwsh
        run: Copy-Item deps/nv-runtime/* sourcecode/gzdoom-rt/build/RelWithDebInfo/rt/bin/ -Force

      - name: Package
        run: python tools/package_release.py --out dist --zip

      - name: Verify the package
        shell: pwsh
        run: |
          $p = 'dist\Doom64-RT'
          $need = @(
            'gzdoom.exe', 'launch-doom64-rt.cmd', 'launch-doom64-rt-ui.ps1',
            'launch-doom64-rt-checks.ps1', 'launch-doom64-rt-ui-classic.ps1',
            'rt\bin\RTGL1.dll', 'rt\RTGL1.json', 'rt\data\textures.json',
            'mods\d64r-mugshot.pk3', 'mods\d64rt-pins.cfg',
            'CREDITS.md', 'AI-DECLARATION.md', 'game\PUT-YOUR-GAME-FILES-HERE.txt',
            'Addons\PUT-YOUR-ADDONS-HERE.txt'
          )
          $bad = $need | Where-Object { -not (Test-Path (Join-Path $p $_)) }
          if ($bad) { throw "package is missing: $($bad -join ', ')" }

          # The stock textures.json is ~30 KB and the authored one ~236 KB. Shipping
          # the stock file silently disables every authored material.
          $meta = (Get-Item "$p\rt\data\textures.json").Length
          if ($meta -lt 100000) { throw "textures.json is $meta bytes - that is the stock file" }

          # Every DLL the engine's own startup check looks for. Missing any of
          # them means a "DLL check failure" dialog in the user's face before the
          # game has drawn a frame -- which is how v0.1.0 shipped.
          $dlls = 'D3D12Core.dll','nvngx_dlss.dll','nvngx_dlssd.dll','nvngx_dlssg.dll',
                  'NvLowLatencyVk.dll','sl.dlss.dll','sl.dlss_g.dll','sl.reflex.dll',
                  'sl.pcl.dll','sl.common.dll','sl.interposer.dll','ffx_fsr2_x64.dll',
                  'ffx_fsr3_x64.dll','ffx_fsr3upscaler_x64.dll','ffx_frameinterpolation_x64.dll',
                  'ffx_opticalflow_x64.dll','ffx_backend_dx12_x64.dll','ffx_backend_vk_x64.dll'
          $lack = $dlls | Where-Object { -not (Test-Path "$p\rt\bin\$_") }
          if ($lack) { throw "rt\bin is missing: $($lack -join ', ')" }

          # Renderer inputs that live loose at the root of rt/. Without the blue
          # noise one the renderer aborts on startup with "Can't find blue noise
          # file", which is how v0.1.1 shipped.
          $tex = 'BlueNoise_LDR_RGBA_128.ktx2','DirtMask.ktx2','SceneBuildWarning.ktx2','WaterNormal_n.ktx2'
          $lack = $tex | Where-Object { -not (Test-Path "$p\rt\$_") }
          if ($lack) { throw "rt\ is missing: $($lack -join ', ')" }

          # THE AUTHORED MATERIALS. 898 wall/flat textures and 132 sprite codes were
          # hand-classified; they reach the package only because build-gzdoom-rt.cmd
          # copies Retribution-RT-Materials\rt over the stock rt\. If that copy ever
          # stops happening the package still builds, still runs, and silently looks
          # like the stock game -- exactly the failure the textures.json size check
          # above exists for, one directory along.
          $orm = @(Get-ChildItem "$p\rt\mat_dev" -Filter '*_orm.png' -ErrorAction SilentlyContinue).Count
          if ($orm -lt 1500) { throw "rt\mat_dev has $orm _orm maps - the authored materials did not make it" }
          foreach ($m in 'SHTGA0_orm.png','POSSA1_orm.png') {
            if (-not (Test-Path "$p\rt\mat_dev\$m")) { throw "rt\mat_dev is missing $m - the SPRITE materials did not make it" }
          }

          # The launcher reads mods\d64rt-pins.cfg and its +cvar pins OVERRIDE the
          # compiled-in defaults. A stale pins file therefore ships a build whose
          # defaults the release quietly ignores.
          $pins = Get-Content "$p\mods\d64rt-pins.cfg" -Raw
          foreach ($c in 'rt_sprite_pbr_mix','rt_tex_pbr_mix','rt_metallic') {
            if ($pins -notmatch [regex]::Escape($c)) { throw "d64rt-pins.cfg does not pin $c" }
          }
          # developerMode must be ON (the material loader is KTX2-only without it)
          # and debugWindows must be OFF (it opens RTGL1's ImGui window over the
          # game). They used to be the same flag; shipping the window is the kind of
          # thing a player sees instantly and CI never would.
          $rtgl = Get-Content "$p\rt\RTGL1.json" -Raw | ConvertFrom-Json
          if (-not $rtgl.developerMode) { throw 'RTGL1.json: developerMode is off - authored materials would be ignored' }
          if ($rtgl.debugWindows)       { throw 'RTGL1.json: debugWindows is on - the release would open the debug window' }
          # NO CHEATS AND NO VIDEO OVERRIDES IN THE SHIPPED PINS. The pins file is
          # written for the tester's launcher and its head carries sv_cheats/god/
          # notarget plus a windowed block; the release launcher execs the same file.
          # v0.1.0-v0.1.6 all shipped an invulnerable game that monsters ignored.
          # package_release.py strips the marked DEV-ONLY block -- this proves it did.
          foreach ($bad in 'sv_cheats','god','notarget','vid_fullscreen','win_x','queryiwad') {
            if ($pins -match "(?m)^$bad( |$)") { throw "d64rt-pins.cfg still pins '$bad' - the DEV-ONLY strip did not run" }
          }
          # Nothing that belongs to somebody else's game, and nothing we cannot ship.
          foreach ($f in @('D64RTR_v15.WAD','D64MUS.PK3','doom2.wad','DOOMSND.SF2','D64RTR_BRIGHTMAPS.PK3')) {
            if (Get-ChildItem $p -Recurse -Filter $f -ErrorAction SilentlyContinue) {
              throw "package must not contain $f"
            }
          }
          if (Test-Path "$p\rt\replace_old") { throw 'replace_old should have been stripped' }
          '{0:N0} MB packaged' -f ((Get-ChildItem $p -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: Doom64-RT-${{ github.sha }}
          path: dist/Doom64-RT.zip
          compression-level: 0        # already a zip

      # MAIN SHIPS RELEASES, EVERY OTHER BRANCH SHIPS PRE-RELEASES.
      # The tag alone cannot say which: a tag is just a commit, and this project
      # tags from a working branch as often as from main. So ask whether the
      # tagged commit is an ancestor of origin/main -- that is the same question
      # as "has this been merged", and it survives the squash merges this repo
      # uses, because the squash commit is what main actually contains.
      - name: Decide the release channel
        id: channel
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "pre=false" >> "$GITHUB_OUTPUT"
            echo "label=" >> "$GITHUB_OUTPUT"
            echo "This commit is on main -> RELEASE"
          else
            echo "pre=true" >> "$GITHUB_OUTPUT"
            echo "label= (beta)" >> "$GITHUB_OUTPUT"
            echo "This commit is not on main -> PRE-RELEASE"
          fi

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Doom64-RT.zip
          name: Doom 64 - Ray Traced ${{ github.ref_name }}${{ steps.channel.outputs.label }}
          # Set by "Decide the release channel": a tag on main is a release,
          # a tag anywhere else is a beta.
          prerelease: ${{ steps.channel.outputs.pre }}
          # Auto-changelog: commits since the previous tag, grouped by PR/author
          # by GitHub's own release-notes generator. No separate step, no wait --
          # it runs in this same call and is appended after `body` below.
          generate_release_notes: true
          body: |
            Built from ${{ github.sha }}.

            This archive contains the renderer, not the game. On first run the
            launcher will ask you for a DOOM II IWAD you own, and for Doom 64:
            Retribution v1.5 plus its OGG music pack (both free, from ModDB).

            Engine: GPLv3, sources at jlrouzies-fr/gzdoom-rt @ doom64-rt.
            RTGL1: MIT, Sultim Tsyrendashiev and Vasilii Shirokii.
            See CREDITS.md and AI-DECLARATION.md inside the archive.
